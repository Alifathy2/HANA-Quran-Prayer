name: Build Signed Release APK (HANA EL Quran v7.3)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean Old Files & Generate v7.3 Project
        run: |
          rm -rf app/src/main/java
          rm -rf app/src/main/res/layout
          rm -rf app/build

          # 1. إعداد gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 2. إعداد settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HonaAlQuran"
          include(":app")
          EOF

          # 3. إعداد build.gradle.kts الرئيسي
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 4. إنشاء هيكل المجلدات
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/java/com/hona/alquran/service

          # 5. جلب ملف صوت أذان المحور المرفق (azan_012.mp3)
          find . -maxdepth 3 -name "azan_012*.mp3" -exec cp {} app/src/main/res/raw/adhan.mp3 \; || true
          find . -maxdepth 3 -name "adhan.mp3" ! -path "./app/src/main/res/raw/adhan.mp3" -exec cp {} app/src/main/res/raw/adhan.mp3 \; || true

          if [ ! -s app/src/main/res/raw/adhan.mp3 ]; then
            curl -L -A "Mozilla/5.0" -s "https://ia801900.us.archive.org/28/items/90-azan/012.mp3" -o app/src/main/res/raw/adhan.mp3 || true
          fi

          # 5-أ. ملفات الصوت "صل على محمد" (salawat.mp3 و salawt2.mp3)
          find . -maxdepth 3 -name "salawat*.mp3" ! -path "./app/src/main/res/raw/salawat.mp3" -exec cp {} app/src/main/res/raw/salawat.mp3 \; || true
          find . -maxdepth 3 -name "salawt2*.mp3" ! -path "./app/src/main/res/raw/salawt2.mp3" -exec cp {} app/src/main/res/raw/salawt2.mp3 \; || true

          if [ ! -s app/src/main/res/raw/salawat.mp3 ]; then
            python3 -c '
          import urllib.request, urllib.parse
          text = "صَلِّ عَلَى مُحَمَّد، اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّد"
          url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=" + urllib.parse.quote(text)
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=15) as r, open("app/src/main/res/raw/salawat.mp3", "wb") as f:
              f.write(r.read())
          ' || true
          fi

          if [ ! -s app/src/main/res/raw/salawt2.mp3 ]; then
            python3 -c '
          import urllib.request, urllib.parse
          text = "عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ، يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا"
          url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=" + urllib.parse.quote(text)
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=15) as r, open("app/src/main/res/raw/salawt2.mp3", "wb") as f:
              f.write(r.read())
          ' || true
          fi

          # 6. أيقونة التطبيق الإسلامية (الزمردي والذهبي المطابق للموقع)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#06281E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0B3B2D" android:pathData="M54,54m-45,0a45,45 0,1 1,90 0a45,45 0,1 1,-90 0"/>
              <path android:strokeColor="#E5A93B" android:strokeWidth="2.2" android:fillColor="#00000000" android:pathData="M54,54m-41,0a41,41 0,1 1,82 0a41,41 0,1 1,-82 0"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#E5A93B" android:pathData="M54,22A22,22 0,1 0,76 44A18,18 0,1 1,54 22Z"/>
              <path android:fillColor="#FFD700" android:pathData="M65,28L66.8,32.2L71.2,32.5L67.8,35.4L68.9,39.8L65,37.4L61.1,39.8L62.2,35.4L58.8,32.5L63.2,32.2Z"/>
              <path android:fillColor="#E5A93B" android:pathData="M34,60 L52,64 L52,78 L34,74 Z"/>
              <path android:fillColor="#C58B20" android:pathData="M74,60 L56,64 L56,78 L74,74 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 7. إعداد app/build.gradle.kts (مع تفعيل ProGuard و ShrinkResources لتخفيف حجم التطبيق)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hona.alquran"
              compileSdk = 34

              defaultConfig {
                  applicationId = "alhana.quran"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 23
                  versionName = "7.3"
                  resourceConfigurations += setOf("ar", "en")
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("../alhana.jks")
                      storePassword = System.getenv("KEYSTORE_PASS") ?: "AlHana2026Secure"
                      keyAlias = "alhana_key"
                      keyPassword = System.getenv("KEYSTORE_PASS") ?: "AlHana2026Secure"
                      enableV1Signing = true
                      enableV2Signing = true
                      enableV3Signing = true
                      enableV4Signing = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("com.batoulapps.adhan:adhan:1.2.1")
              implementation("com.google.android.gms:play-services-location:21.3.0")
          }
          EOF

          # ProGuard rules for code shrinking and safety
          cat << 'EOF' > app/proguard-rules.pro
          -keep class com.hona.alquran.** { *; }
          -keep class com.batoulapps.adhan.** { *; }
          -dontwarn okhttp3.**
          -dontwarn retrofit2.**
          EOF

          # 8. إعداد themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.HonaAlQuran" parent="android:Theme.Material.NoActionBar" />
          </resources>
          EOF

          # 9. إعداد AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="هَنَا القُرآن - HANA EL Quran"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.HonaAlQuran"
                  tools:targetApi="33">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".service.AdhanReceiver" android:enabled="true" android:exported="false" />
                  <receiver android:name=".service.SalawatReceiver" android:enabled="true" android:exported="false" />
                  <receiver android:name=".service.MediaActionReceiver" android:enabled="true" android:exported="false" />
                  <receiver android:name=".service.BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".service.AdhanService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 10. كود المحتوى الديني الموسع والمحدث (IslamicRepository.kt)
          cat << 'EOF' > app/src/main/java/com/hona/alquran/IslamicRepository.kt
          package com.hona.alquran

          data class CityLocation(val name: String, val lat: Double, val lng: Double)
          data class IslamicArticle(val title: String, val subtitle: String, val content: String, val details: String = "")
          data class SurahMetaInfo(val revelationTypeAr: String, val reasonOfRevelation: String, val virtuesAndTheme: String)

          object IslamicRepository {
              val EGYPT_AND_ARAB_CITIES = listOf(
                  CityLocation("القاهرة - مصر", 30.0444, 31.2357),
                  CityLocation("الإسكندرية - مصر", 31.2001, 29.9187),
                  CityLocation("دمنهور (البحيرة) - مصر", 31.0341, 30.4682),
                  CityLocation("طنطا (الغربية) - مصر", 30.7865, 31.0004),
                  CityLocation("المنصورة (الدقهلية) - مصر", 31.0409, 31.3785),
                  CityLocation("الزقازيق (الشرقية) - مصر", 30.5877, 31.5020),
                  CityLocation("أسيوط - مصر", 27.1810, 31.1837),
                  CityLocation("أسوان - مصر", 24.0889, 32.8998),
                  CityLocation("مكة المكرمة - السعودية", 21.4225, 39.8262),
                  CityLocation("المدينة المنورة - السعودية", 24.4672, 39.6112),
                  CityLocation("الرياض - السعودية", 24.7136, 46.6753),
                  CityLocation("القدس الشريف - فلسطين", 31.7683, 35.2137),
                  CityLocation("عمّان - الأردن", 31.9454, 35.9284)
              )

              fun getSurahDetails(surahNumber: Int, surahName: String, ayahsCount: Int): SurahMetaInfo {
                  return when (surahNumber) {
                      1 -> SurahMetaInfo("مكية • 7 آيات", "نزلت بمكة المكرمة في بداية البعثة لتعليم المسلمين كيفية الثناء على الله ودعائه.", "تُسمى أم الكتاب والسبع المثاني والشافية، ولا تصح الصلاة إلا بقراءتها.")
                      2 -> SurahMetaInfo("مدنية • 286 آية", "نزلت في المدينة المنورة على مراحل لتأسيس التشريعات وبناء المجتمع المسلم.", "سنام القرآن وفيها آية الكرسي، وأخذها بركة وتركها حسرة.")
                      3 -> SurahMetaInfo("مدنية • 200 آية", "نزل صدرها في وفد نجران وشطرها الثاني عقب غزوة أُحد.", "هي وسورة البقرة الزهراوان تحاجّان عن صاحبهما يوم القيامة.")
                      18 -> SurahMetaInfo("مكية • 110 آيات", "نزلت جواباً لأسئلة قريش عن فتية الكهف وذي القرنين والروح.", "نور ما بين الجمعتين، وعشر آيات منها عصمة من الدجال.")
                      else -> {
                          val isMadani = surahNumber in listOf(2,3,4,5,8,9,22,24,33,47,48,49,57,58,59,60,61,62,63,64,65,66,76,98,110)
                          SurahMetaInfo(
                              revelationTypeAr = "${if (isMadani) "مدنية" else "مكية"} • $ayahsCount آية",
                              reasonOfRevelation = if (isMadani) "نزلت بعد الهجرة لتنظيم شؤون المجتمع المسلم وتثبيت المؤمنين." else "نزلت قبل الهجرة لترسيخ العقيدة والتوحيد وتذكير النفوس بالآخرة.",
                              virtuesAndTheme = "سورة $surahName من سور القرآن العظيم التي تدعو لتدبر آيات الله والعمل بمحكمها."
                          )
                      }
                  }
              }

              val HADITH_LIST = listOf(
                  IslamicArticle(
                      "1. إنما الأعمال بالنيات", "رواه البخاري ومسلم",
                      "عَنْ أَمِيرِ الْمُؤْمِنِينَ أَبِي حَفْصٍ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ: «إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى...»",
                      "شرح الحديث: هذا الحديث يعد نصف الإسلام، لأن الأعمال تعتمد على القلوب والنيات إخلاصاً لله تعالى. وقد قيل إنه ثلث العلم. الفائدة: استحضار النية الصالحة يحول الأفعال المباحة إلى عبادات مثابة."
                  ),
                  IslamicArticle(
                      "2. فضل قراءة القرآن وتعلمه", "رواه البخاري",
                      "عَنْ عُثْمَانَ بْنِ عَفَّانَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: «خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ».",
                      "شرح الحديث: حضّ النبي ﷺ على العناية بكتاب الله حفظاً وتلاوة وتفسيراً وتعليماً للناس. الفائدة: أعظم شرف يناله المسلم هو ارتباطه الدائم بكتاب الله عز وجل."
                  ),
                  IslamicArticle(
                      "3. أحب الأعمال إلى الله", "متفق عليه",
                      "عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: سَأَلْتُ النَّبِيَّ ﷺ: أَيُّ الْعَمَلِ أَحَبُّ إِلَى اللَّهِ؟ قَالَ: «الصَّلَاةُ عَلَى وَقْتِهَا»...",
                      "شرح الحديث: بيان تفاضل الأعمال وقربها من رضا الله تعالى، وتقديم الصلاة في أول وقتها وبر الوالدين الجهادي والاجتماعي. الفائدة: حرص الصحابة رضي الله عنهم على سؤال النبي ﷺ عن أعظم القربات."
                  ),
                  IslamicArticle(
                      "4. فضل الصلاة على النبي ﷺ", "رواه مسلم",
                      "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ: «مَنْ صَلَّى عَلَيَّ وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ عَشْرًا».",
                      "شرح الحديث: بيان الأجر العظيم لمن يصلي على النبي ﷺ، فصلات الله ثناؤه على العبد في الملأ الأعلى. الفائدة: الإكثار من الصلاة والسلام على النبي ﷺ سبب لغفران الذنوب وقضاء الحوائج."
                  ),
                  IslamicArticle(
                      "5. الكلمتان الحبيبتان إلى الرحمن", "متفق عليه",
                      "قَالَ النَّبِيُّ ﷺ: «كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ».",
                      "شرح الحديث: ترغيب في ذكر الله بالكلمات اليسيرة التي تجمع التنزيه والحمد. الفائدة: الحرص على لزوم التسبيح والتحميد في كل وقت لثقلها العظيم يوم القيامة."
                  )
              )

              val PROPHETS_STORIES = listOf(
                  IslamicArticle("قصة سيدنا آدم أبو البشر عليه السلام", "أول الأنبياء وخلق الإنسان", "خلقه الله بيده وأسجد له ملائكته، وأسكنه الجنة ثم أهبطه إلى الأرض ليختبر طاعته، وعلّمه الأسماء كلها."),
                  IslamicArticle("قصة سيدنا إدريس عليه السلام", "النبي الصديق المرفع", "أول من خط بالقلم، وكان عابداً صابراً رفعه الله مكاناً علياً لما بلغ من درجات الإيمان والتقوى."),
                  IslamicArticle("قصة سيدنا نوح عليه السلام", "شيخ المرسلير وباني السفينة", "دعا قومه ألف سنة إلا خمسين عاماً فما آمن إلا قليل، فأمره الله ببناء السفينة ونجا المؤمنون والطوفان العظيم."),
                  IslamicArticle("قصة سيدنا هود عليه السلام", "نبي عاد الأشد قوة", "أرسل إلى قوم عاد الذين استكبروا في الأرض، فأنجاه الله ومن معه وأهلك عاداً بريح صرصر عاتية."),
