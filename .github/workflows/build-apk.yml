              Button(
                  onClick = onClick,
                  modifier = modifier,
                  colors = ButtonDefaults.buttonColors(containerColor = if (isSelected) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.primary.copy(alpha = 0.16f)),
                  shape = RoundedCornerShape(12.dp)
              ) {
                  Text(text, fontSize = 13.sp, fontWeight = FontWeight.Bold, color = if (isSelected) Color(0xFF06281E) else Color.White)
              }
          }

