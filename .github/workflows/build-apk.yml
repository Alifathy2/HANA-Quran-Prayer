          fun TvButton(text: String, icon: ImageVector, modifier: Modifier = Modifier, onClick: () -> Unit) {
              var focused by remember { mutableStateOf(false) }
              Button(
                  onClick = onClick,
                  modifier = modifier
                      .onFocusChanged { focused = it.isFocused }
                      .focus
