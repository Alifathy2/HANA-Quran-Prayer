          fun startMediaService(context: Context, url: String, title: String, subtitle: String) {
              val intent = Intent(context, MediaPlaybackService::class.java).apply {
                  action = "ACTION_PLAY"
                  putExtra("URL", url)
                  putExtra("TITLE", title)
                  putExtra("SUBTITLE", subtitle)
              }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(intent) else context.startService(intent)
          }

          fun toggleMediaService(context: Context) {
              context.startService(Intent(context, MediaPlaybackService::class.java).apply { action = "ACTION_TOGGLE" })
          }

          fun stopMediaService(context: Context) {
              context.startService(Intent(context, MediaPlaybackService::class.java).apply { action = "ACTION_STOP" })
          }

          fun installUpdateSeamlessly(context: Context, apkFile: File) {
              try {
                  val packageInstaller = context.packageManager.packageInstaller
                  val params = PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL).apply {
                      setAppPackageName(context.packageName)
                  }
                  val sessionId = packageInstaller.createSession(params)
                  val session = packageInstaller.openSession(sessionId)
                  session.openWrite("hana_update", 0, apkFile.length()).use { out ->
                      apkFile.inputStream().use { input -> input.copyTo(out) }
                      session.fsync(out)
                  }
                  val uri = FileProvider.getUriForFile(context, "${context.packageName}.provider", apkFile)
                  val installIntent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  val pi = PendingIntent.getActivity(
                      context, sessionId, installIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  session.commit(pi.intentSender)
                  session.close()
                  context.startActivity(installIntent)
              } catch (_: Exception) {
                  val uri = FileProvider.getUriForFile(context, "${context.packageName}.provider", apkFile)
                  val installIntent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(installIntent)
              }
          }

