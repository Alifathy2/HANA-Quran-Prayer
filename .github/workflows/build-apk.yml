          @Composable
          fun IslamicGeometricBackground(content: @Composable () -> Unit) {
              val patternColor = MaterialTheme.colorScheme.primary.copy(alpha = 0.045f)
              Box(modifier = Modifier.fillMaxSize()) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val step = 95.dp.toPx()
                      var y = 0f
                      while (y < size.height + step) {
                          var x = 0f
                          while (x < size.width + step) {
                              drawCircle(color = patternColor, radius = step * 0.36f, center = Offset(x, y), style = Stroke(width = 1.2.dp.toPx()))
                              drawCircle(color = patternColor, radius = step * 0.16f, center = Offset(x, y), style = Stroke(width = 1.dp.toPx()))
                              x += step
                          }
                          y += step
                      }
                  }
                  content()
              }
          }

          @Composable
          fun UniformButton(text: String, modifier: Modifier = Modifier, isSelected: Boolean = false, onClick: () -> Unit) {
              var focused by remember { mutableStateOf(false) }
              Button(
                  onClick = onClick,
                  modifier = modifier.onFocusChanged { focused = it.isFocused }.focusable().border(
                      width = if (focused || isSelected) 2.dp else 1.dp,
                      color = if (focused || isSelected) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.primary.copy(alpha = 0.4f),
                      shape = RoundedCornerShape(12.dp)
                  ),
                  colors = ButtonDefaults.buttonColors(
                      containerColor = if (isSelected) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.primary.copy(alpha = 0.16f),
                      contentColor = if (isSelected) Color(0xFF06281E) else Color.White
                  ),
                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 10.dp),
                  shape = RoundedCornerShape(12.dp)
              ) {
                  Text(text = text, fontSize = 13.sp, fontWeight = FontWeight.Bold, maxLines = 1, softWrap = false, textAlign = TextAlign.Center)
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun MainApp(theme: Int, onTheme: (Int) -> Unit, scale: Float, onScale: (Float) -> Unit) {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
              var tab by remember { mutableIntStateOf(0) }
              var prayers by remember { mutableStateOf(emptyList<PrayerItem>()) }
              var nextP by remember { mutableStateOf<PrayerItem?>(null) }
              var countdown by remember { mutableStateOf("00:00:00") }
              var locStatus by remember { mutableStateOf(PrayerCalculator.getSavedCityName(context)) }
              var availableUpdateName by remember { mutableStateOf<String?>(null) }
              var showUpdateBanner by remember { mutableStateOf(false) }

              val currentPlayingTitle by MediaPlaybackState.currentTitle
              val isPlayingAudio by MediaPlaybackState.isPlaying
              val isBufferingAudio by MediaPlaybackState.isBuffering

              fun refresh() {
                  val (lat, lng) = PrayerCalculator.getSavedLocation(context)
                  prayers = PrayerCalculator.getTodayPrayers(context, lat, lng)
                  nextP = PrayerCalculator.getNextPrayer(context, lat, lng)
                  locStatus = PrayerCalculator.getSavedCityName(context)
              }

              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { perms ->
                  if (prefs.getBoolean("auto_gps", true) && (perms[Manifest.permission.ACCESS_FINE_LOCATION] == true || perms[Manifest.permission.ACCESS_COARSE_LOCATION] == true)) {
                      LocationServices.getFusedLocationProviderClient(context).lastLocation.addOnSuccessListener { loc ->
                          if (loc != null) {
                              PrayerCalculator.saveLocation(context, loc.latitude, loc.longitude, "موقعك الحالي (GPS تلقائي)")
                              refresh(); AdhanScheduler.scheduleAllPrayers(context)
                          }
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  refresh()
                  val perms = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  permLauncher.launch(perms.toTypedArray())

                  while (true) {
                      withContext(Dispatchers.IO) {
                          try {
                              val conn = (URL("https://github.com/Alifathy2/HANA-Quran-Prayer/releases/latest/download/version.json?t=${System.currentTimeMillis()}").openConnection() as HttpURLConnection).apply {
                                  instanceFollowRedirects = true; useCaches = false; setRequestProperty("Cache-Control", "no-cache"); connectTimeout = 8000
                              }
                              val obj = JSONObject(conn.inputStream.bufferedReader().readText())
                              val remoteCode = obj.optInt("versionCode", CURRENT_VERSION_CODE)
                              val remoteName = obj.optString("versionName", CURRENT_APP_VERSION)
                              if ((remoteCode > CURRENT_VERSION_CODE || remoteName != CURRENT_APP_VERSION) && !showUpdateBanner) {
                                  withContext(Dispatchers.Main) { availableUpdateName = "الإصدار v$remoteName"; showUpdateBanner = true }
                              }
                          } catch (_: Exception) {}
                      }
                      delay(120_000L)
                  }
              }

              LaunchedEffect(nextP) {
                  while (true) {
                      nextP?.let {
                          val diff = it.timeInMillis - System.currentTimeMillis()
                          if (diff <= 0) refresh() else countdown = String.format(Locale.US, "%02d:%02d:%02d", diff / 3600000, (diff / 60000) % 60, (diff / 1000) % 60)
                      }
                      delay(1000)
                  }
              }

              if (availableUpdateName != null) {
                  AlertDialog(
                      onDismissRequest = { availableUpdateName = null },
                      title = {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("تحديث جديد متاح!", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                              IconButton(onClick = { availableUpdateName = null }) { Icon(Icons.Default.Close, null, tint = Color.White) }
                          }
                      },
                      text = { Text("إصدارك الحالي v$CURRENT_APP_VERSION، ويتوفر إصدار أحدث ($availableUpdateName). اضغط تحديث الآن.") },
                      confirmButton = {
                          UniformButton("تحديث الآن") {
                              val ver = availableUpdateName ?: "latest"
                              availableUpdateName = null
                              triggerDirectDownloadUpdate(context, ver)
                          }
                      },
                      dismissButton = { TextButton(onClick = { availableUpdateName = null }) { Text("إغلاق ✕", color = Color.LightGray) } },
                      containerColor = MaterialTheme.colorScheme.surface, titleContentColor = Color.White, textContentColor = Color.White
                  )
              }

              val navItems = listOf(Triple(0, "الصلاة", Icons.Default.Mosque), Triple(1, "القرآن", Icons.Default.MenuBook), Triple(2, "الأذكار", Icons.Default.Favorite), Triple(3, "المزيد", Icons.Default.Apps))

              Scaffold(
                  containerColor = Color.Transparent,
                  topBar = {
                      Column {
                          Row(modifier = Modifier.fillMaxWidth().background(MaterialTheme.colorScheme.surface.copy(alpha = 0.95f)).border(0.5.dp, MaterialTheme.colorScheme.primary.copy(alpha = 0.35f)).padding(horizontal = 16.dp, vertical = 10.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(modifier = Modifier.size(40.dp).background(MaterialTheme.colorScheme.primary, RoundedCornerShape(10.dp)), contentAlignment = Alignment.Center) { Icon(Icons.Default.MenuBook, null, tint = Color(0xFF06281E)) }
                                  Spacer(Modifier.width(10.dp))
                                  Column {
                                      Text("هَنَا القُرآن - HANA EL Quran", fontSize = 17.sp, fontWeight = FontWeight.Bold, color = Color.White)
                                      Text("v$CURRENT_APP_VERSION • ${PrayerCalculator.getHijriDateString()}", fontSize = 11.sp, color = MaterialTheme.colorScheme.primary)
                                  }
                              }
                          }
                          if (showUpdateBanner) {
                              Row(modifier = Modifier.fillMaxWidth().background(MaterialTheme.colorScheme.primary).padding(horizontal = 12.dp, vertical = 6.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Text("🔔 يتوفر إصدار جديد ($availableUpdateName)! اضغط للتحديث", color = Color(0xFF06281E), fontWeight = FontWeight.Bold, fontSize = 13.sp, modifier = Modifier.weight(1f).clickable { triggerDirectDownloadUpdate(context, availableUpdateName ?: "latest") })
                                  IconButton(onClick = { showUpdateBanner = false }, modifier = Modifier.size(26.dp)) { Icon(Icons.Default.Close, null, tint = Color(0xFF06281E)) }
                              }
                          }
                      }
                  },
                  bottomBar = {
                      Column {
                          if (currentPlayingTitle != null) {
                              Row(modifier = Modifier.fillMaxWidth().background(Color(0xFF041B14)).border(1.dp, MaterialTheme.colorScheme.primary.copy(alpha = 0.6f)).padding(horizontal = 14.dp, vertical = 8.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(currentPlayingTitle ?: "", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold, fontSize = 14.sp, maxLines = 1)
                                      Text(if (isBufferingAudio) "جاري التحميل..." else if (isPlayingAudio) "يعمل الآن داخل التطبيق" else "متوقف مؤقتاً", color = Color.LightGray, fontSize = 11.sp)
                                  }
                                  Row(horizontalArrangement = Arrangement.spacedBy(6.dp), verticalAlignment = Alignment.CenterVertically) {
                                      UniformButton(if (isPlayingAudio) "إيقاف مؤقت" else "استئناف") { toggleMediaService(context) }
                                      IconButton(onClick = { stopMediaService(context) }, modifier = Modifier.size(36.dp).background(Color(0xFFC62828), CircleShape)) { Icon(Icons.Default.Close, null, tint = Color.White, modifier = Modifier.size(18.dp)) }
                                  }
                              }
                          }
                          NavigationBar(containerColor = MaterialTheme.colorScheme.surface, tonalElevation = 10.dp) {
                              navItems.forEach { (idx, title, icon) ->
                                  val isSelected = tab == idx
                                  val animScale by animateFloatAsState(targetValue = if (isSelected) 1.18f else 1.0f, animationSpec = spring(dampingRatio = Spring.DampingRatioMediumBouncy, stiffness = Spring.StiffnessLow), label = "navScale")
                                  NavigationBarItem(
                                      selected = isSelected, onClick = { tab = idx },
                                      icon = { Icon(icon, title, modifier = Modifier.scale(animScale), tint = if (isSelected) MaterialTheme.colorScheme.primary else Color.LightGray) },
                                      label = { Text(title, fontSize = if (isSelected) 13.sp else 11.sp, fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal, color = if (isSelected) MaterialTheme.colorScheme.primary else Color.LightGray, maxLines = 1, softWrap = false) },
                                      colors = NavigationBarItemDefaults.colors(indicatorColor = MaterialTheme.colorScheme.primary.copy(alpha = 0.18f))
                                  )
                              }
                          }
                      }
                  }
              ) { pad ->
                  Box(modifier = Modifier.fillMaxSize().padding(pad).padding(12.dp)) {
                      AnimatedContent(targetState = tab, transitionSpec = { (fadeIn(animationSpec = tween(260)) + scaleIn(initialScale = 0.95f)) togetherWith (fadeOut(animationSpec = tween(200))) }, label = "tabTransition") { targetTab ->
                          when (targetTab) {
                              0 -> PrayerDashboard(prayers, nextP, countdown, locStatus)
                              1 -> QuranScreen(scale)
                              2 -> AzkarOnlyScreen(scale)
                              3 -> MoreSectionScreen(theme, onTheme, scale, onScale) { refresh() }
                          }
                      }
                  }
              }
          }

