          EOF

          cat << 'EOF' > app/src/main/java/com/hona/alquran/PrayerCalculator.kt
          package com.hona.alquran
          import android.content.Context
          import com.batoulapps.adhan.*
          import com.batoulapps.adhan.data.DateComponents
          import java.text.SimpleDateFormat
          import java.util.*
          data class PrayerItem(val key: String, val name: String, val timeInMillis: Long, val formattedTime: String)
          object PrayerCalculator {
              fun saveLocation(context: Context, lat: Double, lng: Double, cityName: String = "GPS") {
                  context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE).edit().putFloat("lat", lat.toFloat()).putFloat("lng", lng.toFloat()).putString("city_name", cityName).apply()
              }
              fun getSavedLocation(context: Context): Pair<Double, Double> {
                  val p = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                  return Pair(p.getFloat("lat", 30.0444f).toDouble(), p.getFloat("lng", 31.2357f).toDouble())
              }
              fun getSavedCityName(context: Context): String {
                  return context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE).getString("city_name", "القاهرة - مصر") ?: "القاهرة - مصر"
              }
              fun getQiblaAngle(context: Context): Float {
                  val (lat, lng) = getSavedLocation(context)
                  return Qibla(Coordinates(lat, lng)).direction.toFloat()
              }
              fun getTodayPrayers(context: Context, lat: Double, lng: Double, date: Date = Date()): List<PrayerItem> {
                  val pt = PrayerTimes(Coordinates(lat, lng), DateComponents.from(date), CalculationMethod.EGYPTIAN.parameters)
                  val sdf = SimpleDateFormat("hh:mm a", Locale("ar"))
                  return listOf(
                      PrayerItem("fajr", "الفجر", pt.fajr.time, sdf.format(pt.fajr)),
                      PrayerItem("dhuhr", "الظهر", pt.dhuhr.time, sdf.format(pt.dhuhr)),
                      PrayerItem("asr", "العصر", pt.asr.time, sdf.format(pt.asr)),
                      PrayerItem("maghrib", "المغرب", pt.maghrib.time, sdf.format(pt.maghrib)),
                      PrayerItem("isha", "العشاء", pt.isha.time, sdf.format(pt.isha))
                  )
              }
              fun getNextPrayer(context: Context, lat: Double, lng: Double): PrayerItem {
                  val now = System.currentTimeMillis()
                  val today = getTodayPrayers(context, lat, lng)
                  today.firstOrNull { it.timeInMillis > now }?.let { return it }
                  return getTodayPrayers(context, lat, lng, Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR, 1) }.time).first()
              }
              fun getHijriDateString(): String = "1447 هـ"
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/AudioEngine.kt
          package com.hona.alquran.service
          import android.content.Context
          import android.media.MediaPlayer
          import androidx.compose.runtime.*
          object MediaPlaybackState {
              val currentTitle = mutableStateOf<String?>(null)
              val currentUrl = mutableStateOf<String?>(null)
              val isPlaying = mutableStateOf(false)
              val isBuffering = mutableStateOf(false)
          }
          object AudioEngine {
              private var mp: MediaPlayer? = null
              fun play(context: Context, url: String, title: String, subtitle: String) {
                  MediaPlaybackState.currentTitle.value = title
                  MediaPlaybackState.currentUrl.value = url
                  MediaPlaybackState.isPlaying.value = true
                  try {
                      mp?.release()
                      mp = MediaPlayer().apply {
                          setDataSource(url)
                          prepareAsync()
                          setOnPreparedListener { it.start() }
                      }
                  } catch (_: Exception) {}
              }
              fun toggle(context: Context) {
                  mp?.let {
                      if (it.isPlaying) { it.pause(); MediaPlaybackState.isPlaying.value = false }
                      else { it.start(); MediaPlaybackState.isPlaying.value = true }
                  }
              }
              fun stop(context: Context) {
                  try { mp?.stop(); mp?.release() } catch (_: Exception) {}
                  mp = null
                  MediaPlaybackState.isPlaying.value = false
                  MediaPlaybackState.currentTitle.value = null
              }
          }
          class MediaActionReceiver : android.content.BroadcastReceiver() {
              override fun onReceive(context: Context, intent: android.content.Intent) {
                  if (intent.action == "ACTION_TOGGLE") AudioEngine.toggle(context)
                  else if (intent.action == "ACTION_STOP") AudioEngine.stop(context)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/AdhanScheduler.kt
