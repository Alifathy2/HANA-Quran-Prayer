                  IslamicArticle("1. إنما الأعمال بالنيات", "البخاري ومسلم", "عن عمر رضي الله عنه قال: سمعت رسول الله ﷺ يقول: «إنما الأعمال بالنيات...»", "الحديث أساس الأعمال القلبية والإخلاص لله تعالى.")
