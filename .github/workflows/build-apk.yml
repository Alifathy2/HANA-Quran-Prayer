                  items(prayers) { prayer ->
                      val isNext = prayer.name == nextPrayer?.name
                      var focused by remember { mutableStateOf(false) }
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(
                                  if (isNext) MaterialTheme.colorScheme.primary.copy(alpha = 0.2f) else MaterialTheme.colorScheme.surface,
                                  RoundedCornerShape(16.dp)
                              )
