                          item { Button(onClick = { section = "COMPASS" }, modifier = Modifier.fillMaxWidth()) { Text("بوصلة القبلة (بكعبة المنتصف)") } }
                      }
                      "PROPHETS" -> ArticlesListView(IslamicRepository.PROPHETS_STORIES, scale)
                      "GHAZAWAT" -> ArticlesListView(IslamicRepository.GHAZAWAT_LIST + IslamicRepository.SARAYA_LIST, scale)
                      "COMPASS" -> CompassView()
                  }
              }
          }

          @Composable
          fun ArticlesListView(articles: List<IslamicArticle>, scale: Float) {
              LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxSize()) {
                  items(articles) { art ->
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), shape = RoundedCornerShape(12.dp)) {
                          Column(modifier = Modifier.padding(14.dp).fillMaxWidth()) {
                              Text(art.title, fontSize = (17 * scale).sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text(art.subtitle, fontSize = 12.sp, color = Color.LightGray)
                              Spacer(Modifier.height(6.dp))
                              Text(art.content, fontSize = (15 * scale).sp, lineHeight = (24 * scale).sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun CompassView() {
              Column(modifier = Modifier.fillMaxSize(), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Alignment.Center) {
                  Text("بوصلة اتجاه القبلة", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                  Spacer(Modifier.height(20.dp))
                  Box(modifier = Modifier.size(200.dp).background(MaterialTheme.colorScheme.surface, CircleShape).border(4.dp, MaterialTheme.colorScheme.primary, CircleShape), contentAlignment = Alignment.Center) {
                      Box(modifier = Modifier.size(28.dp).background(Color(0xFF111111))) {
                          Box(modifier = Modifier.fillMaxWidth().height(6.dp).background(Color(0xFFD4AF37)))
                      }
                  }
                  Spacer(Modifier.height(16.dp))
                  Text("تم تحديد الكعبة المشرفة بدقة في المنتصف ✓", fontSize = 13.sp, color = Color(0xFFD4AF37), fontWeight = FontWeight.Bold)
              }
          }
          EOF

      - name: Verify or Generate Persistent Keystore
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'AlHana2026Secure' }}
        run: |
          if [ ! -f "alhana.jks" ]; then
            keytool -genkey -v -keystore alhana.jks -keyalg RSA -keysize 2048 -validity 10000 -alias alhana_key -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=Al-Hana, OU=App, O=Hana, L=Cairo, S=Cairo, C=EG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alhana.jks
            git commit -m "Persist release keystore for seamless updates" || true
            git push || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK & Play Store AAB + Version JSON
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'AlHana2026Secure' }}
        run: |
          gradle assembleRelease bundleRelease -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/alhana.quran.apk
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/apk/release/alhana.aab || true
          cat << 'EOF' > app/build/outputs/apk/release/version.json
          {"versionCode": 24, "versionName": "8.0"}
          EOF

      - name: Upload Signed APK & Play Store Bundle to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hona-AlQuran-APK
          path: |
            app/build/outputs/apk/release/alhana.quran.apk
            app/build/outputs/apk/release/alhana.aab
            app/build/outputs/apk/release/version.json

      - name: Publish Direct OTA Release on GitHub
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "هَنَا القُرآن - HANA EL Quran (v8.0)"
          files: |
            app/build/outputs/apk/release/alhana.quran.apk
            app/build/outputs/apk/release/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
