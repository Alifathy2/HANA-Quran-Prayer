              ZikrItem("بعد الصلاة", "أَسْتَغْفِرُ اللهَ (ثَلاَثاً) اللَّهُمَّ أَنْتَ السَّلاَمُ، وَمِنْكَ السَّلاَمُ، تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالإِكْرَامِ.", "سنة عقب كل صلاة", 1),
              ZikrItem("بعد الصلاة", "سُبْحَانَ اللهِ (33) • الْحَمْدُ لِلَّهِ (33) • اللهُ أَكْبَرُ (33)", "غُفرت خطاياه وإن كانت مثل زبد البحر", 33)
          )

          fun startMediaService(context: Context, url: String, title: String, subtitle: String) {
              AudioEngine.play(context, url, title, subtitle)
          }

          fun toggleMediaService(context: Context) {
              AudioEngine.toggle(context)
          }

          fun stopMediaService(context: Context) {
              AudioEngine.stop(context)
          }

          fun triggerSalawatNow(context: Context) {
              val si = Intent(context, AdhanService::class.java).apply { action = "PLAY_SALAWAT" }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(si) else context.startService(si)
          }

          fun installApkFile(context: Context, file: java.io.File) {
              try {
                  val uri = androidx.core.content.FileProvider.getUriForFile(
                      context,
                      "${context.packageName}.provider",
                      file
                  )
                  val installIntent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(installIntent)
              } catch (_: Exception) {
                  Toast.makeText(context, "افتح مجلد التنزيلات (Downloads) واضغط على ${file.name}", Toast.LENGTH_LONG).show()
              }
          }

          fun triggerDirectDownloadUpdate(context: Context, targetVersion: String = "latest") {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !context.packageManager.canRequestPackageInstalls()) {
                  Toast.makeText(context, "فعّل إذن (تثبيت التطبيقات غير المعروفة) ثم ارجع واضغط تحديث", Toast.LENGTH_LONG).show()
                  val intent = Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${context.packageName}"))
                  context.startActivity(intent)
                  return
              }

              val cleanVer = targetVersion.replace(Regex("[^a-zA-Z0-9._-]"), "").ifEmpty { "latest" }
              val fileName = "alhana-quran-$cleanVer.apk"
              val downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
              val existingFile = java.io.File(downloadsDir, fileName)

              // 1. إذا كان نفس الإصدار محمّل مسبقاً وحجمه سليم -> افتح التثبيت فوراً دون إعادة التحميل
              if (existingFile.exists() && existingFile.length() > 1_000_000L) {
                  Toast.makeText(context, "التحديث محمّل بالفعل! جاري فتح شاشة التثبيت مباشرة...", Toast.LENGTH_SHORT).show()
                  installApkFile(context, existingFile)
                  return
              }

              val ts = System.currentTimeMillis()
              val apkUrl = "https://github.com/Alifathy2/HANA-Quran-Prayer/releases/latest/download/alhana.quran.apk?t=$ts"

              try {
                  val dm = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                  val req = DownloadManager.Request(Uri.parse(apkUrl))
                      .setTitle("تحديث هَنَا القُرآن ($cleanVer)")
                      .setDescription("جاري تنزيل التحديث...")
                      .setMimeType("application/vnd.android.package-archive")
                      .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                      .setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName)
                      .setAllowedOverMetered(true)

                  val downloadId = dm.enqueue(req)
                  Toast.makeText(context, "بدأ تحميل التحديث لأول مرة... سيفتح التثبيت تلقائياً فور الانتهاء", Toast.LENGTH_LONG).show()

                  // مراقبة التحميل عبر Coroutine لضمان فتح التثبيت تلقائياً على هواتف سامسونج
                  CoroutineScope(Dispatchers.IO).launch {
                      var downloading = true
                      while (downloading) {
                          val q = DownloadManager.Query().setFilterById(downloadId)
                          val cursor = dm.query(q)
                          if (cursor != null && cursor.moveToFirst()) {
                              val statusIdx = cursor.getColumnIndex(DownloadManager.COLUMN_STATUS)
                              val status = if (statusIdx >= 0) cursor.getInt(statusIdx) else -1
                              if (status == DownloadManager.STATUS_SUCCESSFUL) {
                                  downloading = false
                                  withContext(Dispatchers.Main) {
                                      installApkFile(context, existingFile)
                                  }
                              } else if (status == DownloadManager.STATUS_FAILED) {
                                  downloading = false
                              }
                          }
                          cursor?.close()
                          delay(1000L)
                      }
                  }
              } catch (_: Exception) {
                  context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(apkUrl)))
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // ربط أزرار الصوت (رفع/خفض) بالتحكم في مستوى صوت الوسائط والأذان
                  volumeControlStream = AudioManager.STREAM_MUSIC
                  AdhanScheduler.scheduleAllPrayers(this)
                  setContent {
                      val prefs = remember { getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
                      var theme by remember { mutableIntStateOf(prefs.getInt("theme", 0)) }
                      var scale by remember { mutableFloatStateOf(prefs.getFloat("scale", 1.0f)) }

                      val cs = when (theme) {
                          1 -> darkColorScheme(primary = Color(0xFFFFD166), background = Color(0xFF0B132B), surface = Color(0xFF1C2541), onPrimary = Color.Black, onBackground = Color.White, onSurface = Color.White)
                          2 -> darkColorScheme(primary = Color(0xFFE6B86A), background = Color(0xFF1A120B), surface = Color(0xFF3C2A21), onPrimary = Color.Black, onBackground = Color.White, onSurface = Color.White)
                          else -> darkColorScheme(primary = Color(0xFFE5A93B), background = Color(0xFF06281E), surface = Color(0xFF0B3B2D), onPrimary = Color(0xFF052219), onBackground = Color.White, onSurface = Color.White)
                      }

                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme(colorScheme = cs) {
                              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                                  IslamicGeometricBackground {
                                      MainApp(
                                          theme = theme,
                                          onTheme = { theme = it; prefs.edit().putInt("theme", it).apply() },
                                          scale = scale,
                                          onScale = { scale = it; prefs.edit().putFloat("scale", it).apply() }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun IslamicGeometricBackground(content: @Composable () -> Unit) {
              val patternColor = MaterialTheme.colorScheme.primary.copy(alpha = 0.045f)
              Box(modifier = Modifier.fillMaxSize()) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val step = 95.dp.toPx()
                      var y = 0f
                      while (y < size.height + step) {
                          var x = 0f
                          while (x < size.width + step) {
                              drawCircle(color = patternColor, radius = step * 0.36f, center = Offset(x, y), style = Stroke(width = 1.2.dp.toPx()))
                              drawCircle(color = patternColor, radius = step * 0.16f, center = Offset(x, y), style = Stroke(width = 1.dp.toPx()))
                              x += step
                          }
                          y += step
                      }
                  }
                  content()
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun MainApp(theme: Int, onTheme: (Int) -> Unit, scale: Float, onScale: (Float) -> Unit) {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }

              var tab by remember { mutableIntStateOf(0) }
              var prayers by remember { mutableStateOf(emptyList<PrayerItem>()) }
              var nextP by remember { mutableStateOf<PrayerItem?>(null) }
              var countdown by remember { mutableStateOf("00:00:00") }
              var locStatus by remember { mutableStateOf(PrayerCalculator.getSavedCityName(context)) }
              var availableUpdateName by remember { mutableStateOf<String?>(null) }
              var showUpdateBanner by remember { mutableStateOf(false) }

              val currentPlayingTitle by MediaPlaybackState.currentTitle
              val isPlayingAudio by MediaPlaybackState.isPlaying
              val isBufferingAudio by MediaPlaybackState.isBuffering

              fun refresh() {
                  val (lat, lng) = PrayerCalculator.getSavedLocation(context)
                  prayers = PrayerCalculator.getTodayPrayers(context, lat, lng)
                  nextP = PrayerCalculator.getNextPrayer(context, lat, lng)
                  locStatus = PrayerCalculator.getSavedCityName(context)
              }

              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { perms ->
                  val autoGps = prefs.getBoolean("auto_gps", true)
                  if (autoGps && (perms[Manifest.permission.ACCESS_FINE_LOCATION] == true || perms[Manifest.permission.ACCESS_COARSE_LOCATION] == true)) {
                      LocationServices.getFusedLocationProviderClient(context).lastLocation.addOnSuccessListener { loc ->
                          if (loc != null) {
                              PrayerCalculator.saveLocation(context, loc.latitude, loc.longitude, "موقعك الحالي (GPS تلقائي)")
                              refresh()
                              AdhanScheduler.scheduleAllPrayers(context)
                          }
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  refresh()
                  val perms = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  permLauncher.launch(perms.toTypedArray())

                  while (true) {
                      withContext(Dispatchers.IO) {
                          try {
                              var detectedNewVersion: String? = null
                              val ts = System.currentTimeMillis()
                              try {
                                  val conn = (URL("https://github.com/Alifathy2/HANA-Quran-Prayer/releases/latest/download/version.json?t=$ts").openConnection() as HttpURLConnection).apply {
                                      instanceFollowRedirects = true
                                      useCaches = false
                                      setRequestProperty("Cache-Control", "no-cache")
                                      connectTimeout = 8000
                                  }
                                  val vJson = conn.inputStream.bufferedReader().readText()
                                  val obj = JSONObject(vJson)
                                  val remoteCode = obj.optInt("versionCode", CURRENT_VERSION_CODE)
                                  val remoteName = obj.optString("versionName", CURRENT_APP_VERSION)
                                  if (remoteCode > CURRENT_VERSION_CODE || remoteName != CURRENT_APP_VERSION) {
                                      detectedNewVersion = "الإصدار v$remoteName"
                                  }
                              } catch (_: Exception) {}

                              if (detectedNewVersion != null && !showUpdateBanner) {
                                  withContext(Dispatchers.Main) {
                                      availableUpdateName = detectedNewVersion
                                      showUpdateBanner = true
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                          val nm = context.getSystemService(NotificationManager::class.java)
                                          nm.createNotificationChannel(NotificationChannel("upd_ch", "تحديثات التطبيق", NotificationManager.IMPORTANCE_HIGH))
                                          val notif = NotificationCompat.Builder(context, "upd_ch")
                                              .setContentTitle("تحديث جديد متاح لتطبيق هَنَا القُرآن")
                                              .setContentText("يتوفر الآن $detectedNewVersion - اضغط للتحديث")
                                              .setSmallIcon(android.R.drawable.stat_sys_download_done)
                                              .setAutoCancel(true)
                                              .build()
                                          nm.notify(3003, notif)
                                      }
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      delay(120_000L)
                  }
              }

              LaunchedEffect(nextP) {
                  while (true) {
                      nextP?.let {
                          val diff = it.timeInMillis - System.currentTimeMillis()
                          if (diff <= 0) refresh()
                          else countdown = String.format(Locale.US, "%02d:%02d:%02d", diff / 3600000, (diff / 60000) % 60, (diff / 1000) % 60)
                      }
                      delay(1000)
                  }
              }

              if (availableUpdateName != null) {
                  AlertDialog(
                      onDismissRequest = { availableUpdateName = null },
                      title = {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("تحديث جديد متاح!", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                              IconButton(onClick = { availableUpdateName = null }) {
                                  Icon(Icons.Default.Close, contentDescription = "إغلاق", tint = Color.White)
                              }
                          }
                      },
                      text = {
                          Text("إصدارك الحالي هو v$CURRENT_APP_VERSION، ويتوفر إصدار أحدث ($availableUpdateName). اضغط تحديث الآن لتنزيله.")
                      },
                      confirmButton = {
                          UniformButton("تحديث الآن") {
                              availableUpdateName = null
                              triggerDirectDownloadUpdate(context, availableUpdateName ?: "latest")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { availableUpdateName = null }) { Text("إغلاق ✕", color = Color.LightGray) }
                      },
                      containerColor = MaterialTheme.colorScheme.surface,
                      titleContentColor = Color.White,
                      textContentColor = Color.White
                  )
              }

              val navItems = listOf(
                  Triple(0, "الصلاة", Icons.Default.Mosque),
                  Triple(1, "القرآن", Icons.Default.MenuBook),
                  Triple(2, "الأذكار", Icons.Default.Favorite),
                  Triple(3, "المزيد", Icons.Default.Apps)
              )

              Scaffold(
                  containerColor = Color.Transparent,
                  topBar = {
                      Column {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .background(MaterialTheme.colorScheme.surface.copy(alpha = 0.95f))
                                  .border(0.5.dp, MaterialTheme.colorScheme.primary.copy(alpha = 0.35f))
                                  .padding(horizontal = 16.dp, vertical = 10.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(
                                      modifier = Modifier
                                          .size(40.dp)
                                          .background(MaterialTheme.colorScheme.primary, RoundedCornerShape(10.dp)),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Icon(Icons.Default.MenuBook, contentDescription = null, tint = Color(0xFF06281E))
                                  }
                                  Spacer(Modifier.width(10.dp))
                                  Column {
                                      Text("هَنَا القُرآن - HANA EL Quran", fontSize = 17.sp, fontWeight = FontWeight.Bold, color = Color.White)
                                      Text("v$CURRENT_APP_VERSION • ${PrayerCalculator.getHijriDateString()}", fontSize = 11.sp, color = MaterialTheme.colorScheme.primary)
                                  }
                              }
                          }

                          if (showUpdateBanner) {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .background(MaterialTheme.colorScheme.primary)
                                      .padding(horizontal = 12.dp, vertical = 6.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = "🔔 يتوفر إصدار جديد ($availableUpdateName)! اضغط للتحديث",
                                      color = Color(0xFF06281E),
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 13.sp,
                                      modifier = Modifier.weight(1f).clickable { triggerDirectDownloadUpdate(context, availableUpdateName ?: "latest") }
                                  )
                                  IconButton(onClick = { showUpdateBanner = false }, modifier = Modifier.size(26.dp)) {
                                      Icon(Icons.Default.Close, contentDescription = "إغلاق", tint = Color(0xFF06281E))
                                  }
                              }
                          }
                      }
                  },
                  bottomBar = {
                      Column {
                          if (currentPlayingTitle != null) {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .background(Color(0xFF041B14))
                                      .border(1.dp, MaterialTheme.colorScheme.primary.copy(alpha = 0.6f))
                                      .padding(horizontal = 14.dp, vertical = 8.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(
                                          text = currentPlayingTitle ?: "",
                                          color = MaterialTheme.colorScheme.primary,
                                          fontWeight = FontWeight.Bold,
                                          fontSize = 14.sp,
                                          maxLines = 1
                                      )
                                      Text(
                                          text = if (isBufferingAudio) "جاري التحميل..." else if (isPlayingAudio) "يعمل الآن داخل التطبيق" else "متوقف مؤقتاً",
                                          color = Color.LightGray,
                                          fontSize = 11.sp
                                      )
                                  }
                                  Row(horizontalArrangement = Arrangement.spacedBy(6.dp), verticalAlignment = Alignment.CenterVertically) {
                                      UniformButton(if (isPlayingAudio) "إيقاف مؤقت" else "استئناف") {
                                          toggleMediaService(context)
                                      }
                                      IconButton(
                                          onClick = { stopMediaService(context) },
                                          modifier = Modifier.size(36.dp).background(Color(0xFFC62828), CircleShape)
                                      ) {
                                          Icon(Icons.Default.Close, contentDescription = "إيقاف", tint = Color.White, modifier = Modifier.size(18.dp))
                                      }
                                  }
                              }
                          }

                          NavigationBar(
                              containerColor = MaterialTheme.colorScheme.surface,
                              tonalElevation = 10.dp
                          ) {
                              navItems.forEach { (idx, title, icon) ->
                                  val isSelected = tab == idx
                                  val animScale by animateFloatAsState(
                                      targetValue = if (isSelected) 1.18f else 1.0f,
                                      animationSpec = spring(dampingRatio = Spring.DampingRatioMediumBouncy, stiffness = Spring.StiffnessLow),
                                      label = "navScale"
                                  )
                                  NavigationBarItem(
                                      selected = isSelected,
                                      onClick = { tab = idx },
                                      icon = {
                                          Icon(
                                              imageVector = icon,
                                              contentDescription = title,
                                              modifier = Modifier.scale(animScale),
                                              tint = if (isSelected) MaterialTheme.colorScheme.primary else Color.LightGray
                                          )
                                      },
                                      label = {
                                          Text(
                                              text = title,
                                              fontSize = if (isSelected) 13.sp else 11.sp,
                                              fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal,
                                              color = if (isSelected) MaterialTheme.colorScheme.primary else Color.LightGray,
                                              maxLines = 1,
                                              softWrap = false
                                          )
                                      },
                                      colors = NavigationBarItemDefaults.colors(indicatorColor = MaterialTheme.colorScheme.primary.copy(alpha = 0.18f))
                                  )
                              }
                          }
                      }
                  }
              ) { pad ->
                  Box(modifier = Modifier.fillMaxSize().padding(pad).padding(12.dp)) {
                      AnimatedContent(
                          targetState = tab,
                          transitionSpec = {
                              (fadeIn(animationSpec = tween(260)) + scaleIn(initialScale = 0.95f)) togetherWith
                                      (fadeOut(animationSpec = tween(200)))
                          },
                          label = "tabTransition"
                      ) { targetTab ->
                          when (targetTab) {
                              0 -> PrayerDashboard(prayers, nextP, countdown, locStatus)
                              1 -> QuranScreen(scale)
                              2 -> AzkarOnlyScreen(scale)
                              3 -> MoreSectionScreen(theme, onTheme, scale, onScale) { refresh() }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Verify or Generate Persistent Keystore
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'AlHana2026Secure' }}
        run: |
          if [ ! -f "alhana.jks" ]; then
            keytool -genkey -v -keystore alhana.jks -keyalg RSA -keysize 2048 -validity 10000 -alias alhana_key -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=Al-Hana, OU=App, O=Hana, L=Cairo, S=Cairo, C=EG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alhana.jks
            git commit -m "Persist release keystore for seamless updates" || true
            git push || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK & Play Store AAB + Version JSON
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'AlHana2026Secure' }}
        run: |
          gradle assembleRelease bundleRelease -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/alhana.quran.apk
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/apk/release/alhana.aab || true
          cat << 'EOF' > app/build/outputs/apk/release/version.json
          {"versionCode": 25, "versionName": "7.5"}
          EOF

      - name: Upload Signed APK & Play Store Bundle to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hona-AlQuran-APK
          path: |
            app/build/outputs/apk/release/alhana.quran.apk
            app/build/outputs/apk/release/alhana.aab
            app/build/outputs/apk/release/version.json

      - name: Publish Direct OTA Release on GitHub
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "هَنَا القُرآن - HANA EL Quran (v7.5)"
          files: |
            app/build/outputs/apk/release/alhana.quran.apk
            app/build/outputs/apk/release/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
