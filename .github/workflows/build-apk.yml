          @Composable
          fun CompassView() {
              val context = LocalContext.current
              val qiblaAngle = remember { PrayerCalculator.getQiblaAngle(context) }
              var azimuth by remember { mutableFloatStateOf(0f) }

              DisposableEffect(Unit) {
                  val sm = context.getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  val sensor = sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR) ?: sm.getDefaultSensor(Sensor.TYPE_ORIENTATION)
                  val listener = object : SensorEventListener {
                      override fun onSensorChanged(e: SensorEvent?) {
                          if (e == null) return
                          if (e.sensor.type == Sensor.TYPE_ROTATION_VECTOR) {
                              val rm = FloatArray(9)
                              SensorManager.getRotationMatrixFromVector(rm, e.values)
                              val ori = FloatArray(3)
                              SensorManager.getOrientation(rm, ori)
                              azimuth = ((Math.toDegrees(ori[0].toDouble()) + 360) % 360).toFloat()
                          } else azimuth = e.values[0]
                      }
                      override fun onAccuracyChanged(s: Sensor?, a: Int) {}
                  }
                  if (sensor != null) sm.registerListener(listener, sensor, SensorManager.SENSOR_DELAY_UI)
                  onDispose { sm.unregisterListener(listener) }
              }

              val rot = (qiblaAngle - azimuth + 360f) % 360f
              val primary = MaterialTheme.colorScheme.primary
              val surface = MaterialTheme.colorScheme.surface

              Column(modifier = Modifier.fillMaxSize().padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                  Text("بوصلة اتجاه القبلة", fontSize = 21.sp, fontWeight = FontWeight.Bold, color = primary)
                  Text("زاوية القبلة من موقعك: ${qiblaAngle.toInt()}° من الشمال", fontSize = 14.sp, color = Color.LightGray)
                  Spacer(Modifier.height(20.dp))
                  Box(modifier = Modifier.size(220.dp), contentAlignment = Alignment.Center) {
                      Canvas(modifier = Modifier.fillMaxSize()) {
                          drawCircle(color = surface)
                          drawCircle(color = primary, style = Stroke(width = 5.dp.toPx()))
                          rotate(degrees = rot) {
                              drawLine(color = primary, start = center, end = Offset(center.x, 24.dp.toPx()), strokeWidth = 7.dp.toPx())
                              drawCircle(color = Color(0xFF4CAF50), radius = 10.dp.toPx(), center = Offset(center.x, 24.dp.toPx()))
                          }
                          drawCircle(color = Color.White, radius = 7.dp.toPx(), center = center)
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(theme: Int, onTheme: (Int) -> Unit, scale: Float, onScale: (Float) -> Unit, onCalc: () -> Unit) {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
              val scope = rememberCoroutineScope()

              var updateProgress by remember { mutableFloatStateOf(-1f) }
              var stat by remember { mutableStateOf("الإصدار الحالي: v$CURRENT_APP_VERSION") }
              var adhanUrl by remember { mutableStateOf(prefs.getString("adhan_url", ADHANS.first().second)!!) }
              var calcMethod by remember { mutableIntStateOf(prefs.getInt("calc_method", 0)) }

              LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxSize()) {
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), shape = RoundedCornerShape(16.dp)) {
                          Column(modifier = Modifier.fillMaxWidth().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("تحديث التطبيق", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text(stat, fontSize = 13.sp, color = Color.LightGray)
                              if (updateProgress >= 0f) {
                                  LinearProgressIndicator(progress = { updateProgress }, modifier = Modifier.fillMaxWidth(), color = MaterialTheme.colorScheme.primary)
                              }
                              UniformButton("تحديث التطبيق الآن", Modifier.fillMaxWidth()) {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !context.packageManager.canRequestPackageInstalls()) {
                                      Toast.makeText(context, "يرجى السماح بتثبيت التحديثات مرة واحدة فقط", Toast.LENGTH_LONG).show()
                                      context.startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${context.packageName}")))
                                      return@UniformButton
                                  }
                                  stat = "جاري تحميل التحديث..."
                                  updateProgress = 0.05f
                                  scope.launch(Dispatchers.IO) {
                                      try {
                                          val url = URL("https://github.com/Alifathy2/HANA-Quran-Prayer/releases/latest/download/alhana.quran.apk")
                                          val conn = (url.openConnection() as HttpURLConnection).apply {
                                              instanceFollowRedirects = true
                                              connectTimeout = 15000
                                              connect()
                                          }
                                          val total = conn.contentLength.coerceAtLeast(1)
                                          val apkFile = File(context.filesDir, "update.apk")
                                          conn.inputStream.use { input ->
                                              apkFile.outputStream().use { output ->
                                                  val buf = ByteArray(8192)
                                                  var downloaded = 0
                                                  var read: Int
                                                  while (input.read(buf).also { read = it } != -1) {
                                                      output.write(buf, 0, read)
                                                      downloaded += read
                                                      updateProgress = (downloaded.toFloat() / total).coerceIn(0f, 1f)
                                                  }
                                              }
                                          }
                                          withContext(Dispatchers.Main) {
                                              updateProgress = -1f
                                              stat = "الإصدار الحالي: v$CURRENT_APP_VERSION"
                                              val uri = FileProvider.getUriForFile(context, "${context.packageName}.provider", apkFile)
                                              val installIntent = Intent(Intent.ACTION_VIEW).apply {
                                                  setDataAndType(uri, "application/vnd.android.package-archive")
                                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                                              }
                                              context.startActivity(installIntent)
                                          }
                                      } catch (e: Exception) {
                                          withContext(Dispatchers.Main) {
                                              updateProgress = -1f
                                              stat = "تعذر الاتصال، تأكد من وجود الإنترنت."
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }

                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), shape = RoundedCornerShape(16.dp)) {
                          Column(modifier = Modifier.fillMaxWidth().padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("اختيار صوت المؤذن وتجربته", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              ADHANS.forEach { (name, u) ->
                                  Row(
                                      modifier = Modifier.fillMaxWidth().clickable {
                                          adhanUrl = u
                                          prefs.edit().putString("adhan_url", u).apply()
                                          File(context.filesDir, "custom_adhan.mp3").delete()
                                          Toast.makeText(context, "تم اختيار: $name", Toast.LENGTH_SHORT).show()
                                      }.padding(vertical = 6.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      RadioButton(selected = adhanUrl == u, onClick = null)
                                      Spacer(Modifier.width(8.dp))
                                      Text(name, fontSize = 14.sp, fontWeight = FontWeight.Medium)
                                  }
                              }
                              Row(
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  UniformButton("تجربة الأذان", Modifier.weight(1f)) {
                                      val i = Intent(context, AdhanService::class.java).apply { putExtra("PRAYER_NAME", "التجربة") }
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(i) else context.startService(i)
                                  }
                                  Button(
                                      onClick = { context.startService(Intent(context, AdhanService::class.java).apply { action = "STOP_ADHAN" }) },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD32F2F), contentColor = Color.White),
                                      shape = RoundedCornerShape(12.dp),
                                      modifier = Modifier.weight(1f)
                                  ) {
                                      Icon(Icons.Default.StopCircle, contentDescription = null, modifier = Modifier.size(18.dp))
                                      Spacer(Modifier.width(6.dp))
                                      Text("إيقاف الأذان", fontSize = 13.sp, fontWeight = FontWeight.Bold, maxLines = 1, softWrap = false)
                                  }
                              }
                          }
                      }
                  }

                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), shape = RoundedCornerShape(16.dp)) {
                          Column(modifier = Modifier.fillMaxWidth().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("إعدادات الشكل والألوان والخط", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text("لون مظهر التطبيق:", fontSize = 14.sp, color = Color.LightGray)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                                  UniformButton("زمردي", Modifier.weight(1f), isSelected = theme == 0) { onTheme(0) }
                                  UniformButton("كحلي", Modifier.weight(1f), isSelected = theme == 1) { onTheme(1) }
                                  UniformButton("أندلسي", Modifier.weight(1f), isSelected = theme == 2) { onTheme(2) }
                              }
                              Spacer(Modifier.height(4.dp))
                              Text("حجم خط القرآن والأذكار:", fontSize = 14.sp, color = Color.LightGray)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                                  UniformButton("عادي", Modifier.weight(1f), isSelected = scale == 1.0f) { onScale(1.0f) }
                                  UniformButton("كبير", Modifier.weight(1f), isSelected = scale == 1.2f) { onScale(1.2f) }
                                  UniformButton("ضخم", Modifier.weight(1f), isSelected = scale == 1.4f) { onScale(1.4f) }
                              }
                          }
                      }
                  }

                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), shape = RoundedCornerShape(16.dp)) {
                          Column(modifier = Modifier.fillMaxWidth().padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("إعدادات المواقيت والخلفية", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              listOf(0 to "الهيئة المصرية العامة للمساحة", 1 to "تقويم أم القرى (مكة المكرمة)", 2 to "رابطة العالم الإسلامي").forEach { (idx, title) ->
                                  Row(
                                      modifier = Modifier.fillMaxWidth().clickable {
                                          calcMethod = idx
                                          prefs.edit().putInt("calc_method", idx).apply()
                                          onCalc()
                                          AdhanScheduler.scheduleAllPrayers(context)
                                      }.padding(vertical = 4.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      RadioButton(selected = calcMethod == idx, onClick = null)
                                      Spacer(Modifier.width(8.dp))
                                      Text(title, fontSize = 14.sp)
                                  }
                              }
                              HorizontalDivider(modifier = Modifier.padding(vertical = 6.dp), color = Color.Gray.copy(alpha = 0.25f))
                              UniformButton("تفعيل حماية الأذان في الخلفية", Modifier.fillMaxWidth()) {
                                  val pm = context.getSystemService(PowerManager::class.java)
                                  if (!pm.isIgnoringBatteryOptimizations(context.packageName)) {
                                      context.startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:${context.packageName}")))
                                  } else {
                                      Toast.makeText(context, "التطبيق محمي ويعمل في الخلفية بالفعل!", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate and Persist Keystore
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'AlHana2026Secure' }}
        run: |
          if [ ! -f "alhana.jks" ]; then
            keytool -genkey -v -keystore alhana.jks -keyalg RSA -keysize 2048 -validity 10000 -alias alhana_key -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=Al-Hana, OU=App, O=Hana, L=Cairo, S=Cairo, C=EG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alhana.jks
            git commit -m "Persist release keystore for seamless in-app updates" || true
            git push || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'AlHana2026Secure' }}
        run: |
          gradle assembleRelease -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/alhana.quran.apk

      - name: Upload Signed APK to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hona-AlQuran-APK
          path: app/build/outputs/apk/release/alhana.quran.apk

      - name: Publish Direct OTA Release on GitHub
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "هَنَا القُرآن - HANA EL Quran (v5.1)"
          files: app/build/outputs/apk/release/alhana.quran.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
