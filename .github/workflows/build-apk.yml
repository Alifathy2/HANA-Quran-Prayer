          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.focus.onFocusChanged
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.rotate
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.*
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.*
          import com.google.android.gms.location.LocationServices
          import com.hona.alquran.service.*
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.io.File
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.*

          data class SurahInfo(val number: Int, val name: String, val ayahsCount: Int)
          data class AyahWithTafsir(val numberInSurah: Int, val text: String, val tafsir: String)
          data class ZikrItem(val category: String, val text: String, val benefit: String, val targetCount: Int)
          data class Reciter(val name: String, val serverUrl: String)
          data class RadioStation(val name: String, val subtitle: String, val streamUrl: String)

          val RECITERS = listOf(
              Reciter("مشاري راشد العفاسي", "https://server8.mp3quran.net/afs"),
              Reciter("محمود خليل الحصري", "https://server13.mp3quran.net/husr"),
              Reciter("عبد الباسط عبد الصمد", "https://server7.mp3quran.net/basit"),
              Reciter("محمد صديق المنشاوي", "https://server10.mp3quran.net/minsh")
          )
          val STATIONS = listOf(
              RadioStation("إذاعة القرآن الكريم من القاهرة", "البث المباشر الرسمي", "https://stream.radiojar.com/8s5u5tpdtwzuv"),
              RadioStation("إذاعة تلاوات الشيخ عبد الباسط", "تلاوات خاشعة", "https://backup.qurango.net/radio/abdulbasit_abdulsamad_mojawwad"),
              RadioStation("إذاعة الشيخ المنشاوي", "تلاوات مرتلة", "https://backup.qurango.net/radio/mohammed_siddiq_alminshawi_mojawwad"),
              RadioStation("إذاعة الشيخ الحصري", "المصحف المرتل", "https://backup.qurango.net/radio/mahmoud_khalil_alhussary")
          )
          val ADHANS = listOf(
              "أذان المحور - الشيخ نصر الدين طوبار" to "https://archive.org/download/AzanNasrElDinTobar/Azan_Nasr_ElDin_Tobar.mp3",
              "أذان الحرم المكي" to "https://www.islamcan.com/audio/adhan/azan1.mp3",
              "أذان المسجد النبوي" to "https://www.islamcan.com/audio/adhan/azan2.mp3"
          )
          val AZKAR = listOf(
              ZikrItem("أذكار الصباح", "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لاَ إِلَـهَ إِلاَّ اللهُ وَحْدَهُ لاَ شَرِيكَ لَهُ.", "بركة وسعة", 1),
              ZikrItem("أذكار الصباح", "رَضِيتُ بِاللَّهِ رَبَّاً، وَبِالإِسْلاَمِ دِيناً، وَبِمُحَمَّدٍ ﷺ نَبِيّاً.", "حق على الله أن يرضيه", 3),
              ZikrItem("أذكار المساء", "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لاَ إِلَـهَ إِلاَّ اللهُ.", "حفظ طوال الليل", 1),
              ZikrItem("أذكار المساء", "أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", "حماية تامة", 3),
              ZikrItem("بعد الصلاة", "أَسْتَغْفِرُ اللهَ (ثَلاَثاً) اللَّهُمَّ أَنْتَ السَّلاَمُ وَمِنْكَ السَّلاَمُ.", "سنة مباركة", 1),
              ZikrItem("بعد الصلاة", "سُبْحَانَ اللهِ (33) الْحَمْدُ لِلَّهِ (33) اللهُ أَكْبَرُ (33)", "غفرت خطيائتُه", 33)
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  AdhanScheduler.scheduleAllPrayers(this)
                  setContent {
                      val prefs = remember { getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
                      var theme by remember { mutableIntStateOf(prefs.getInt("theme", 0)) }
                      var scale by remember { mutableFloatStateOf(prefs.getFloat("scale", 1.0f)) }
                      val cs = when(theme) {
                          1 -> darkColorScheme(primary = Color(0xFFFFD166), background = Color(0xFF0B132B), surface = Color(0xFF1C2541))
                          2 -> darkColorScheme(primary = Color(0xFFE6B86A), background = Color(0xFF1A120B), surface = Color(0xFF3C2A21))
                          else -> darkColorScheme(primary = Color(0xFFE5C158), background = Color(0xFF071A1E), surface = Color(0xFF112D32))
                      }
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme(colorScheme = cs) {
                              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                                  MainApp(theme, { theme = it; prefs.edit().putInt("theme", it).apply() }, scale, { scale = it; prefs.edit().putFloat("scale", it).apply() })
                              }
                          }
                      }
                  }
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun MainApp(theme: Int, onTheme: (Int) -> Unit, scale: Float, onScale: (Float) -> Unit) {
              val context = LocalContext.current
              var tab by remember { mutableIntStateOf(0) }
              var prayers by remember { mutableStateOf(emptyList<PrayerItem>()) }
              var nextP by remember { mutableStateOf<PrayerItem?>(null) }
              var countdown by remember { mutableStateOf("00:00:00") }
              var locStatus by remember { mutableStateOf("تم تحديد الموقع تلقائياً") }

              fun refresh() {
                  val (lat, lng) = PrayerCalculator.getSavedLocation(context)
                  prayers = PrayerCalculator.getTodayPrayers(context, lat, lng)
                  nextP = PrayerCalculator.getNextPrayer(context, lat, lng)
              }

              LaunchedEffect(Unit) {
                  refresh()
                  LocationServices.getFusedLocationProviderClient(context).lastLocation.addOnSuccessListener { loc ->
                      if (loc != null) { PrayerCalculator.saveLocation(context, loc.latitude, loc.longitude); refresh(); AdhanScheduler.scheduleAllPrayers(context) }
                  }
              }

              LaunchedEffect(nextP) {
                  while(true) {
                      nextP?.let {
                          val diff = it.timeInMillis - System.currentTimeMillis()
                          if (diff <= 0) refresh()
                          else countdown = String.format(Locale.US, "%02d:%02d:%02d", diff/3600000, (diff/60000)%60, (diff/1000)%60)
                      }
                      delay(1000)
                  }
              }

              Scaffold(
                  topBar = {
                      Row(
                          modifier = Modifier.fillMaxWidth().background(MaterialTheme.colorScheme.surface).padding(16.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text("هَنَا القُرآن", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text(PrayerCalculator.getHijriDateString(), fontSize = 12.sp, color = Color.LightGray)
                          }
                          Row(horizontalAlignment = Alignment.spacedBy(8.dp)) {
                              Button(onClick = {
                                  val i = Intent(context, AdhanService::class.java).apply { putExtra("PRAYER_NAME", "التجربة") }
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(i) else context.startService(i)
                              }, colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary.copy(alpha = 0.2f))) {
                                  Text("تجربة الأذان", fontSize = 12.sp, color = Color.White)
                              }
                              IconButton(onClick = { context.startService(Intent(context, AdhanService::class.java).apply { action = "STOP_ADHAN" }) }) {
                                  Icon(Icons.Default.StopCircle, null, tint = Color(0xFFFF6B6B))
                              }
                          }
                      }
                  },
                  bottomBar = {
                      NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {
                          NavigationBarItem(selected = tab == 0, onClick = { tab = 0 }, icon = { Icon(Icons.Default.AccessTime, null) }, label = { Text("الصلاة", fontSize = 11.sp) })
                          NavigationBarItem(selected = tab == 1, onClick = { tab = 1 }, icon = { Icon(Icons.Default.MenuBook, null) }, label = { Text("القرآن", fontSize = 11.sp) })
                          NavigationBarItem(selected = tab == 2, onClick = { tab = 2 }, icon = { Icon(Icons.Default.Radio, null) }, label = { Text("الراديو", fontSize = 11.sp) })
                          NavigationBarItem(selected = tab == 3, onClick = { tab = 3 }, icon = { Icon(Icons.Default.Explore, null) }, label = { Text("الأذكار", fontSize = 11.sp) })
                          NavigationBarItem(selected = tab == 4, onClick = { tab = 4 }, icon = { Icon(Icons.Default.Settings, null) }, label = { Text("الإعدادات", fontSize = 11.sp) })
                      }
                  }
              ) { pad ->
                  Box(modifier = Modifier.fillMaxSize().padding(pad).padding(12.dp)) {
                      when(tab) {
                          0 -> PrayerDashboard(prayers, nextP, countdown, locStatus)
                          1 -> QuranScreen(scale)
                          2 -> RadioScreen()
                          3 -> AzkarScreen(scale)
                          4 -> SettingsScreen(theme, onTheme, scale, onScale) { refresh() }
                      }
                  }
              }
          }

          @Composable
          fun PrayerDashboard(prayers: List<PrayerItem>, next: PrayerItem?, cd: String, stat: String) {
              LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), shape = RoundedCornerShape(18.dp)) {
                          Column(modifier = Modifier.fillMaxWidth().padding(18.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("الصلاة القادمة: ${next?.name ?: ""}", fontSize = 16.sp, color = Color.LightGray)
                              Text(cd, fontSize = 36.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Spacer(Modifier.height(4.dp))
                              Text(stat, fontSize = 12.sp, color = MaterialTheme.colorScheme.primary)
                          }
                      }
                  }
                  items(prayers) { p ->
                      val isN = p.name == next?.name
                      Row(
                          modifier = Modifier.fillMaxWidth().background(if (isN) MaterialTheme.colorScheme.primary.copy(alpha = 0.2f) else MaterialTheme.colorScheme.surface, RoundedCornerShape(14.dp)).padding(16.dp),
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Text(p.name, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                          Text(p.formattedTime, fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                      }
                  }
              }
          }

          @Composable
          fun RadioScreen() {
              val context = LocalContext.current
              var playing by remember { mutableStateOf<RadioStation?>(null) }
              val player = remember { MediaPlayer() }
              DisposableEffect(Unit) { onDispose { try { player.stop(); player.release() } catch (_: Exception) {} } }
              LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  items(STATIONS) { st ->
                      val isP = playing == st
                      Card(
                          modifier = Modifier.fillMaxWidth().clickable {
                              if (isP) { try { player.stop() } catch (_: Exception) {}; playing = null }
                              else {
                                  playing = st
                                  try { player.reset(); player.setDataSource(st.streamUrl); player.prepareAsync(); player.setOnPreparedListener { it.start() } } catch (_: Exception) { playing = null }
                              }
                          },
                          colors = CardDefaults.cardColors(containerColor = if (isP) MaterialTheme.colorScheme.primary.copy(alpha = 0.2f) else MaterialTheme.colorScheme.surface)
                      ) {
                          Row(modifier = Modifier.padding(16.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(st.name, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                  Text(st.subtitle, fontSize = 12.sp, color = Color.LightGray)
                              }
                              Icon(if (isP) Icons.Default.PauseCircleFilled else Icons.Default.PlayCircleFilled, null, tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(32.dp))
                          }
                      }
                  }
              }
          }

          @Composable
          fun QuranScreen(scale: Float) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var surahs by remember { mutableStateOf(emptyList<SurahInfo>()) }
              var selSurah by remember { mutableStateOf<SurahInfo?>(null) }
              var ayahs by remember { mutableStateOf(emptyList<AyahWithTafsir>()) }
              var loading by remember { mutableStateOf(true) }
              var tafsir by remember { mutableStateOf(true) }
              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      try {
                          val json = URL("https://api.alquran.cloud/v1/surah").readText()
                          val data = JSONObject(json).getJSONArray("data")
                          val list = mutableListOf<SurahInfo>()
                          for (i in 0 until data.length()) {
                              val it = data.getJSONObject(i)
                              list.add(SurahInfo(it.getInt("number"), it.getString("name"), it.getInt("numberOfAyahs")))
                          }
                          surahs = list
                      } catch (_: Exception) {} finally { loading = false }
                  }
              }
              if (selSurah == null) {
                  if (loading) Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }
                  else LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(surahs) { s ->
                          Card(modifier = Modifier.fillMaxWidth().clickable {
                              selSurah = s; loading = true
                              scope.launch(Dispatchers.IO) {
                                  try {
                                      val res = URL("https://api.alquran.cloud/v1/surah/${s.number}/editions/quran-uthmani,ar.muyassar").readText()
                                      val ed = JSONObject(res).getJSONArray("data")
                                      val qa = ed.getJSONObject(0).getJSONArray("ayahs")
                                      val ta = ed.getJSONObject(1).getJSONArray("ayahs")
                                      val list = mutableListOf<AyahWithTafsir>()
                                      for (i in 0 until qa.length()) list.add(AyahWithTafsir(qa.getJSONObject(i).getInt("numberInSurah"), qa.getJSONObject(i).getString("text"), ta.getJSONObject(i).getString("text")))
                                      ayahs = list
                                  } catch (_: Exception) {} finally { loading = false }
                              }
                          }, colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                              Row(modifier = Modifier.padding(16.dp).fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("${s.number}. ${s.name}", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                  Text("${s.ayahsCount} آية", color = MaterialTheme.colorScheme.primary)
                              }
                          }
                      }
                  }
              } else {
                  Column(modifier = Modifier.fillMaxSize()) {
                      Row(modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                          Button(onClick = { selSurah = null }) { Text("الفهرس") }
                          Text(selSurah!!.name, fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                          Button(onClick = { tafsir = !tafsir }) { Text(if (tafsir) "إخفاء التفسير" else "التفسير") }
                      }
                      if (loading) Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }
                      else LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          items(ayahs) { a ->
                              Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                                  Column(modifier = Modifier.padding(14.dp)) {
                                      Text("${a.text} ﴿${a.numberInSurah}﴾", fontSize = (21 * scale).sp, lineHeight = (36 * scale).sp, textAlign = TextAlign.Right, modifier = Modifier.fillMaxWidth())
                                      if (tafsir) {
                                          HorizontalDivider(modifier = Modifier.padding(vertical = 8.dp))
                                          Text("التفسير: ${a.tafsir}", fontSize = (14 * scale).sp, color = Color.LightGray)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun AzkarScreen(scale: Float) {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
              var tasbeeh by remember { mutableIntStateOf(prefs.getInt("tasbeeh", 0)) }
              val tabs = listOf("أذكار الصباح", "أذكار المساء", "بعد الصلاة", "السبحة", "القبلة")
              var tabIdx by remember { mutableIntStateOf(0) }
              Column(modifier = Modifier.fillMaxSize()) {
                  ScrollableTabRow(selectedTabIndex = tabIdx, containerColor = MaterialTheme.colorScheme.surface, contentColor = MaterialTheme.colorScheme.primary) {
                      tabs.forEachIndexed { i, t -> Tab(selected = tabIdx == i, onClick = { tabIdx = i }, text = { Text(t, fontSize = 14.sp) }) }
                  }
                  Spacer(Modifier.height(10.dp))
                  when(tabs[tabIdx]) {
                      "السبحة" -> Column(modifier = Modifier.fillMaxSize(), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                          Box(modifier = Modifier.size(180.dp).background(MaterialTheme.colorScheme.surface, CircleShape).border(3.dp, MaterialTheme.colorScheme.primary, CircleShape).clickable {
                              tasbeeh++; prefs.edit().putInt("tasbeeh", tasbeeh).apply()
                          }, contentAlignment = Alignment.Center) {
                              Text("$tasbeeh", fontSize = 42.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                          }
                          Spacer(Modifier.height(16.dp))
                          Button(onClick = { tasbeeh = 0; prefs.edit().putInt("tasbeeh", 0).apply() }) { Text("تصفير العداد") }
                      }
                      "القبلة" -> {
                          val angle = PrayerCalculator.getQiblaAngle(context)
                          Column(modifier = Modifier.fillMaxSize(), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                              Text("اتجاه القبلة", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text("الزاوية: ${angle.toInt()}° من الشمال", fontSize = 16.sp, color = Color.White)
                          }
                      }
                      else -> {
                          val list = AZKAR.filter { it.category == tabs[tabIdx] }
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              items(list) { z ->
                                  var c by remember(z) { mutableIntStateOf(z.targetCount) }
                                  Card(modifier = Modifier.fillMaxWidth().clickable { if (c > 0) c-- }, colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                                      Column(modifier = Modifier.padding(16.dp)) {
                                          Text(z.text, fontSize = (18 * scale).sp, lineHeight = (30 * scale).sp, textAlign = TextAlign.Right, modifier = Modifier.fillMaxWidth())
                                          Spacer(Modifier.height(8.dp))
                                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                              Text(z.benefit, fontSize = 12.sp, color = Color.LightGray)
                                              Text(if (c > 0) "المتبقي: $c" else "تمت القراءة ✓", color = if (c > 0) MaterialTheme.colorScheme.primary else Color(0xFF4CAF50), fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(theme: Int, onTheme: (Int) -> Unit, scale: Float, onScale: (Float) -> Unit, onCalc: () -> Unit) {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
              val scope = rememberCoroutineScope()
              var stat by remember { mutableStateOf("الإصدار الحالي: v4.0") }
              var adhanUrl by remember { mutableStateOf(prefs.getString("adhan_url", ADHANS.first().second)!!) }

              LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxSize()) {
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                          Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("تحديث التطبيق", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text(stat, fontSize = 13.sp, color = Color.LightGray)
                              Button(onClick = {
                                  stat = "جاري التحديث..."
                                  scope.launch(Dispatchers.IO) {
                                      try {
                                          val url = "https://github.com/Alifathy2/HANA-Quran-Prayer/releases/latest/download/alhana.quran.apk"
                                          val dm = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                                          dm.enqueue(DownloadManager.Request(Uri.parse(url)).setTitle("هَنَا القُرآن").setDescription("جاري التحديث...").setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "alhana.apk").setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED))
                                          withContext(Dispatchers.Main) { stat = "تم بدء تحميل التحديث في الإشعارات" }
                                      } catch (_: Exception) { withContext(Dispatchers.Main) { stat = "فشل التحديث التلقائي" } }
                                  }
                              }, modifier = Modifier.fillMaxWidth()) { Text("تحديث التطبيق الآن") }
                          }
                      }
                  }
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                          Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("اختيار صوت المؤذن", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              ADHANS.forEach { (name, u) ->
                                  Row(modifier = Modifier.fillMaxWidth().clickable { adhanUrl = u; prefs.edit().putString("adhan_url", u).apply(); File(context.filesDir, "adhan.mp3").delete(); Toast.makeText(context, name, Toast.LENGTH_SHORT).show() }.padding(6.dp), verticalAlignment = Alignment.CenterVertically) {
                                      RadioButton(selected = adhanUrl == u, onClick = null)
                                      Spacer(Modifier.width(8.dp))
                                      Text(name, fontSize = 14.sp)
                                  }
                              }
                          }
                      }
                  }
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                          Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("المظهر والألوان", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp), modifier = Modifier.fillMaxWidth()) {
                                  Button(onClick = { onTheme(0) }, modifier = Modifier.weight(1f)) { Text("زمردي", fontSize = 12.sp) }
                                  Button(onClick = { onTheme(1) }, modifier = Modifier.weight(1f)) { Text("كحلي", fontSize = 12.sp) }
                                  Button(onClick = { onTheme(2) }, modifier = Modifier.weight(1f)) { Text("أندلسي", fontSize = 12.sp) }
                              }
                              Spacer(Modifier.height(4.dp))
                              Text("حجم الخط", fontSize = 14.sp)
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp), modifier = Modifier.fillMaxWidth()) {
                                  Button(onClick = { onScale(1.0f) }, modifier = Modifier.weight(1f)) { Text("عادي", fontSize = 12.sp) }
                                  Button(onClick = { onScale(1.2f) }, modifier = Modifier.weight(1f)) { Text("كبير", fontSize = 12.sp) }
                                  Button(onClick = { onScale(1.35f) }, modifier = Modifier.weight(1f)) { Text("واسع", fontSize = 12.sp) }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate Keystore
        run: |
          if [ ! -f "alhana.jks" ]; then
            keytool -genkey -v -keystore alhana.jks -keyalg RSA -keysize 2048 -validity 10000 -alias alhana_key -storepass "AlHana2026Secure" -keypass "AlHana2026Secure" -dname "CN=Al-Hana, OU=App, O=Hana, L=Cairo, S=Cairo, C=EG"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/alhana.quran.apk

      - name: Publish Direct OTA Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "هَنَا القُرآن: أذان، أذكار، قبلة (v4.0)"
          files: app/build/outputs/apk/release/alhana.quran.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
