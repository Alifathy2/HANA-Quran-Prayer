          package com.hona.alquran.service

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.media.RingtoneManager
          import android.os.Build
          import androidx.core.app.NotificationCompat

          class AdhanReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val scheduledTime = intent.getLongExtra("SCHEDULED_TIME", 0L)
                  val now = System.currentTimeMillis()

                  if (scheduledTime > 0L && kotlin.math.abs(now - scheduledTime) > 150_000L) {
                      AdhanScheduler.scheduleAllPrayers(context)
                      return
                  }

                  val name = intent.getStringExtra("PRAYER_NAME") ?: "الصلاة"
                  val prayerKey = intent.getStringExtra("PRAYER_KEY") ?: "fajr"

                  try {
                      val si = Intent(context, AdhanService::class.java).apply {
                          putExtra("PRAYER_NAME", name)
                          putExtra("PRAYER_KEY", prayerKey)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(si) else context.startService(si)
                  } catch (_: Exception) {}

                  AdhanScheduler.scheduleAllPrayers(context)
              }
          }

          class AdhkarReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val nm = context.getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(NotificationChannel("adhkar_periodic_ch", "تذكير الأذكار اليومية", NotificationManager.IMPORTANCE_DEFAULT))
                  }
                  val notif = NotificationCompat.Builder(context, "adhkar_periodic_ch")
                      .setContentTitle("ذكر الله نور وطمأنينة 📿")
                      .setContentText("ألا بذكر الله تطمئن القلوب.. اذكر الله الآن (سبحان الله وبحمده، سبحان الله العظيم)")
                      .setSmallIcon(android.R.drawable.ic_popup_reminder)
                      .setAutoCancel(true)
                      .build()
                  nm.notify(888, notif)
                  AdhanScheduler.scheduleAdhkarReminders(context)
              }
          }
