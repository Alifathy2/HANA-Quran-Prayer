          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/SalawatKeepAliveService.kt
          package com.hona.alquran.service

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.PowerManager
          import com.hona.alquran.MainActivity

          class SalawatKeepAliveService : BroadcastReceiver() {
              companion object {
                  fun syncState(context: Context) {
                      val prefs = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                      val enabled = prefs.getBoolean("salawat_enabled", false)
                      val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val intent = Intent(context, SalawatKeepAliveService::class.java)
                      val pi = PendingIntent.getBroadcast(context, 888, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                      am.cancel(pi)
                      if (enabled) {
                          val intervalMins = prefs.getInt("salawat_interval", 15).coerceAtLeast(1)
                          val triggerAt = System.currentTimeMillis() + (intervalMins * 60 * 1000L)
                          try {
                              val showIntent = PendingIntent.getActivity(context, 0, Intent(context, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                              val clockInfo = AlarmManager.AlarmClockInfo(triggerAt, showIntent)
                              am.setAlarmClock(clockInfo, pi)
                          } catch (_: Exception) {
                              try {
                                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pi)
                              } catch (_: Exception) {
                                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pi)
                              }
                          }
                      }
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  val prefs = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                  val enabled = prefs.getBoolean("salawat_enabled", false)
                  if (enabled) {
                      try {
                          val pm = context.getSystemService(Context.POWER_SERVICE) as PowerManager
                          val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Hana::SalawatSilentLock")
                          wl.acquire(15000L)
                      } catch (_: Exception) {}

                      try {
                          val si = Intent(context, AdhanService::class.java).apply { action = "PLAY_SALAWAT" }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(si)
                          } else {
                              context.startService(si)
                          }
                      } catch (_: Exception) {}

                      syncState(context)
                  }
              }
          }
