              val tabs = listOf("أذكار الصباح", "أذكار المساء", "بعد الصلاة")
              var tabIdx by remember { mutableIntStateOf(0) }

              Column(modifier = Modifier.fillMaxSize()) {
                  ScrollableTabRow(selectedTabIndex = tabIdx, containerColor = MaterialTheme.colorScheme.surface, contentColor = MaterialTheme.colorScheme.primary, edgePadding = 8.dp) {
                      tabs.forEachIndexed { i, t ->
