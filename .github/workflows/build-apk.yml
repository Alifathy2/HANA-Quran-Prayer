                  context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(apkUrl)))
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  AdhanScheduler.scheduleAllPrayers(this)
                  setContent {
                      val prefs = remember { getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
                      var theme by remember { mutableIntStateOf(prefs.getInt("theme", 0)) }
                      var scale by remember { mutableFloatStateOf(prefs.getFloat("scale", 1.0f)) }

                      val cs = when (theme) {
                          1 -> darkColorScheme(primary = Color(0xFFFFD166), background = Color(0xFF0B132B), surface = Color(0xFF1C2541), onPrimary = Color.Black, onBackground = Color.White, onSurface = Color.White)
                          2 -> darkColorScheme(primary = Color(0xFFE6B86A), background = Color(0xFF1A120B), surface = Color(0xFF3C2A21), onPrimary = Color.Black, onBackground = Color.White, onSurface = Color.White)
                          else -> darkColorScheme(primary = Color(0xFFE5A93B), background = Color(0xFF06281E), surface = Color(0xFF0B3B2D), onPrimary = Color(0xFF052219), onBackground = Color.White, onSurface = Color.White)
                      }

                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme(colorScheme = cs) {
                              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                                  IslamicGeometricBackground {
                                      MainApp(
                                          theme = theme,
                                          onTheme = { theme = it; prefs.edit().putInt("theme", it).apply() },
                                          scale = scale,
                                          onScale = { scale = it; prefs.edit().putFloat("scale", it).apply() }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }

              // زر الصوت يخفض الصوت، وزر الباور يلغي صوت الأذان
              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Int {
                  when (keyCode) {
                      KeyEvent.KEYCODE_VOLUME_UP, KeyEvent.KEYCODE_VOLUME_DOWN -> {
                          val am = getSystemService(Context.AUDIO_SERVICE) as android.media.AudioManager
                          am.adjustStreamVolume(android.media.AudioManager.STREAM_ALARM, android.media.AudioManager.ADJUST_LOWER, 0)
                          am.adjustStreamVolume(android.media.AudioManager.STREAM_MUSIC, android.media.AudioManager.ADJUST_LOWER, 0)
                          Toast.makeText(this, "تم تخفيض الصوت ✓", Toast.LENGTH_SHORT).show()
                          return true
                      }
                      KeyEvent.KEYCODE_POWER -> {
                          stopService(Intent(this, AdhanService::class.java).apply { action = "STOP_ADHAN" })
                          Toast.makeText(this, "تم إيقاف صوت الأذان والتنبيهات ✓", Toast.LENGTH_SHORT).show()
                          return true
                      }
                  }
                  return super.onKeyDown(keyCode, event)
              }
          }

          @Composable
          fun IslamicGeometricBackground(content: @Composable () -> Unit) {
              val patternColor = MaterialTheme.colorScheme.primary.copy(alpha = 0.045f)
              Box(modifier = Modifier.fillMaxSize()) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val step = 95.dp.toPx()
                      var y = 0f
                      while (y < size.height + step) {
                          var x = 0f
                          while (x < size.width + step) {
                              drawCircle(color = patternColor, radius = step * 0.36f, center = Offset(x, y), style = Stroke(width = 1.2.dp.toPx()))
                              drawCircle(color = patternColor, radius = step * 0.16f, center = Offset(x, y), style = Stroke(width = 1.dp.toPx()))
                              x += step
                          }
                          y += step
                      }
                  }
                  content()
              }
          }

