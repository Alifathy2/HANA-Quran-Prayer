          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK & Play Store AAB + Version JSON
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'AlHana2026Secure' }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace
          mkdir -p app/build/outputs/apk/release
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then echo "::error::No APK generated"; exit 1; fi
          if [ "$APK_FILE" != "app/build/outputs/apk/release/alhana.quran.apk" ]; then
            cp "$APK_FILE" app/build/outputs/apk/release/alhana.quran.apk
          fi
          AAB_FILE=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then cp "$AAB_FILE" app/build/outputs/apk/release/alhana.aab; fi
          echo '{"versionCode": 30, "versionName": "8.0"}' > app/build/outputs/apk/release/version.json

      - name: Upload Signed APK & Play Store Bundle to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hona-AlQuran-APK
          path: |
            app/build/outputs/apk/release/alhana.quran.apk
            app/build/outputs/apk/release/alhana.aab
            app/build/outputs/apk/release/version.json

      - name: Publish Direct OTA Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "هَنَا القُرآن - HANA EL Quran (v8.0)"
          files: |
            app/build/outputs/apk/release/alhana.quran.apk
            app/build/outputs/apk/release/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
