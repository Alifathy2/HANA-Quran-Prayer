          # 16. خدمة الأذان والصلاة على النبي مع اختيار الصوتين ومستوى الصوت
          # بالإضافة لإيقاف الأذان عند الضغط على زر الباور (ACTION_SCREEN_OFF)
          # =====================================================================
          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/AdhanService.kt
          package com.hona.alquran.service

          import android.app.*
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.speech.tts.TextToSpeech
          import androidx.core.app.NotificationCompat
          import com.hona.alquran.MainActivity
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.Locale

          class AdhanService : Service() {
              private var mp: MediaPlayer? = null
              private var wl: PowerManager.WakeLock? = null
              private var tts: TextToSpeech? = null
              private val mainHandler = Handler(Looper.getMainLooper())
              private var screenOffReceiver: BroadcastReceiver? = null
              private var isCurrentlyPlayingAdhan = false

              override fun onCreate() {
                  super.onCreate()
                  // مراقبة زر الباور (إغلاق الشاشة) لإلغاء صوت الأذان فوراً
                  screenOffReceiver = object : BroadcastReceiver() {
                      override fun onReceive(context: Context?, intent: Intent?) {
                          if (intent?.action == Intent.ACTION_SCREEN_OFF && isCurrentlyPlayingAdhan) {
                              stopSelf()
                          }
                      }
                  }
                  registerReceiver(screenOffReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP_ADHAN") {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  try {
                      if (wl == null) {
                          wl = (getSystemService(Context.POWER_SERVICE) as PowerManager).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Hana::Wl").apply {
                              setReferenceCounted(false)
                              acquire(300000L)
                          }
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel("ch", "تنبيهات الأذان والصلاة على النبي", NotificationManager.IMPORTANCE_HIGH))
                      }

                      val stopPi = PendingIntent.getService(this, 0, Intent(this, AdhanService::class.java).apply { action = "STOP_ADHAN" }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val openPi = PendingIntent.getActivity(this, 1, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)

                      if (intent?.action == "PLAY_SALAWAT") {
                          isCurrentlyPlayingAdhan = false
                          val salawatNotif = NotificationCompat.Builder(this, "ch")
                              .setContentTitle("صلِّ على محمد ﷺ")
                              .setContentText("اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ")
                              .setSmallIcon(android.R.drawable.ic_popup_reminder)
                              .setContentIntent(openPi)
                              .addAction(android.R.drawable.ic_media_pause, "إيقاف", stopPi)
                              .setAutoCancel(true)
                              .build()

                          startForeground(1001, salawatNotif)
                          playSalawatAudio()
                          return START_NOT_STICKY
                      }

                      isCurrentlyPlayingAdhan = true
                      val name = intent?.getStringExtra("PRAYER_NAME") ?: "الصلاة"
                      val prayerKey = intent?.getStringExtra("PRAYER_KEY") ?: "fajr"

                      val notif = NotificationCompat.Builder(this, "ch")
                          .setContentTitle("هَنَا القُرآن - حان الآن موعد أذان $name")
                          .setContentText("اضغط زر الباور لإلغاء الصوت أو أزرار الصوت للتحكم")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentIntent(openPi)
                          .addAction(android.R.drawable.ic_media_pause, "إيقاف الأذان", stopPi)
                          .setOngoing(true)
                          .build()

                      startForeground(1001, notif)

                      val prefs = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                      val playInSilent = prefs.getBoolean("silent_$prayerKey", true)
                      val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val isDeviceSilent = audioManager.ringerMode != AudioManager.RINGER_MODE_NORMAL

                      if (isDeviceSilent && !playInSilent && prayerKey != "test") {
                          stopSelf()
                          return START_NOT_STICKY
                      }

                      playAdhan()
                  } catch (_: Exception) {}
                  return START_NOT_STICKY
              }

              private fun playSalawatAudio() {
                  Thread {
                      try {
                          mp?.release()
                          val prefs = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                          val voiceChoice = prefs.getInt("salawat_voice_choice", 1) // 1 = salawat.mp3, 2 = salawt2.mp3
                          val vol1 = prefs.getFloat("salawat_vol_1", 1.0f).coerceIn(0.05f, 1.0f)
                          val vol2 = prefs.getFloat("salawat_vol_2", 1.0f).coerceIn(0.05f, 1.0f)
                          val targetVolume = if (voiceChoice == 2) vol2 else vol1

                          // استخدام USAGE_MEDIA حتى يستجيب لزر الصوت (رفع/خفض) ومستوى الصوت بدقة
                          val attrs = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()

                          val resName = if (voiceChoice == 2) "salawt2" else "salawat"
                          var salawatResId = resources.getIdentifier(resName, "raw", packageName)
                          if (salawatResId == 0) salawatResId = resources.getIdentifier("salawat", "raw", packageName)

                          if (salawatResId != 0) {
                              val afd = resources.openRawResourceFd(salawatResId)
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                              afd.close()
                              player.prepare()
                              player.setVolume(targetVolume, targetVolume)
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                              return@Thread
                          }

                          val cachedSalawat = File(filesDir, "salawat_voice_$voiceChoice.mp3")
                          if (!cachedSalawat.exists() || cachedSalawat.length() < 3000) {
                              try {
                                  val text = if (voiceChoice == 2) "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّد" else "صَلِّ عَلَى مُحَمَّد، اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّد"
                                  val phrase = URLEncoder.encode(text, "UTF-8")
                                  val ttsUrl = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=$phrase"
                                  val conn = (URL(ttsUrl).openConnection() as HttpURLConnection).apply {
                                      instanceFollowRedirects = true
                                      setRequestProperty("User-Agent", "Mozilla/5.0")
                                      connectTimeout = 8000
                                  }
                                  conn.inputStream.use { i -> cachedSalawat.outputStream().use { o -> i.copyTo(o) } }
                              } catch (_: Exception) {}
                          }

                          if (cachedSalawat.exists() && cachedSalawat.length() > 3000) {
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(cachedSalawat.absolutePath)
                              player.prepare()
                              player.setVolume(targetVolume, targetVolume)
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                              return@Thread
                          }

                          mainHandler.post {
                              tts = TextToSpeech(applicationContext) { status ->
                                  if (status == TextToSpeech.SUCCESS) {
                                      tts?.language = Locale("ar")
                                      tts?.speak("صَلِّ عَلَى مُحَمَّد، اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّد", TextToSpeech.QUEUE_FLUSH, null, "salawat_tts")
                                      mainHandler.postDelayed({ stopSelf() }, 6000L)
                                  } else {
                                      playDefaultNotificationSound()
                                  }
                              }
                          }
                      } catch (_: Exception) {
                          playDefaultNotificationSound()
                      }
                  }.start()
              }

              private fun playDefaultNotificationSound() {
                  try {
                      val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                      val player = MediaPlayer()
                      player.setDataSource(applicationContext, uri)
                      player.prepare()
                      player.setOnCompletionListener { stopSelf() }
                      player.start()
                      mp = player
                  } catch (_: Exception) {
                      stopSelf()
                  }
              }

              private fun playAdhan() {
                  Thread {
                      try {
                          mp?.release()
                          val prefs = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                          val selectedUrl = prefs.getString("adhan_url", "RAW_BUILTIN") ?: "RAW_BUILTIN"

                          // استخدام USAGE_MEDIA لكي يتحكم زر الصوت الجانبي في تعلية وتوطية صوت الأذان بحرية
                          // بينما زر الباور يوقف الأذان نهائياً عبر ACTION_SCREEN_OFF
                          val attrs = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()

                          val resId = resources.getIdentifier("adhan", "raw", packageName)

                          if (selectedUrl == "RAW_BUILTIN" && resId != 0) {
                              val afd = resources.openRawResourceFd(resId)
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                              afd.close()
                              player.prepare()
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                              return@Thread
                          }

                          val cached = File(filesDir, "custom_adhan.mp3")
                          if (!cached.exists() || cached.length() < 20000) {
                              try {
                                  val conn = URL(selectedUrl).openConnection() as HttpURLConnection
                                  conn.instanceFollowRedirects = true
                                  conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                                  conn.connectTimeout = 10000
                                  conn.inputStream.use { i -> cached.outputStream().use { o -> i.copyTo(o) } }
                              } catch (_: Exception) {}
                          }

                          if (cached.exists() && cached.length() > 20000) {
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(cached.absolutePath)
                              player.prepare()
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                          } else if (resId != 0) {
                              val afd = resources.openRawResourceFd(resId)
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                              afd.close()
                              player.prepare()
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                          } else {
                              val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(applicationContext, uri)
                              player.prepare()
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                          }
                      } catch (_: Exception) {
                          stopSelf()
                      }
                  }.start()
              }

              override fun onDestroy() {
                  isCurrentlyPlayingAdhan = false
                  try { screenOffReceiver?.let { unregisterReceiver(it) } } catch (_: Exception) {}
                  try { mp?.stop(); mp?.release() } catch (_: Exception) {}
                  mp = null
                  try { tts?.stop(); tts?.shutdown() } catch (_: Exception) {}
                  tts = null
                  if (wl?.isHeld == true) wl?.release()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
