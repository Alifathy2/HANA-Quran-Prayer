              LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxSize()) {
                  item {
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(
                                  Brush.linearGradient(
                                      listOf(MaterialTheme.colorScheme.surface, MaterialTheme.colorScheme.primary.copy(alpha = 0.25f))
                                  ),
                                  RoundedCornerShape(22.dp)
                              )
                              .border(1.dp, MaterialTheme.colorScheme.primary.copy(alpha = 0.5f), RoundedCornerShape(22.dp))
                              .padding(20.dp)
                      ) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {
                              Text("الصلاة القادمة: ${nextPrayer?.name ?: ""}", fontSize = 18.sp, color = Color(0xFFE0E0E0))
                              Spacer(Modifier.height(4.dp))
