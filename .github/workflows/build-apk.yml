name: Build Signed Release APK (HANA EL Quran v8.0)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Official Signing Key (alhana.jks)
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'AlHana2026Secure' }}
        run: |
          if [ ! -f "alhana.jks" ]; then
            find . -maxdepth 3 -name "alhana.jks" -exec cp {} ./alhana.jks \; || true
          fi
          if [ ! -f "alhana.jks" ]; then
            echo "::error::ملف alhana.jks غير موجود! ارفعه في الصفحة الرئيسية للمستودع لكي ينزل التحديث فوق النسخة القديمة."
            exit 1
          fi
          keytool -list -v -keystore alhana.jks -storepass "$KEYSTORE_PASS" -alias alhana_key > /tmp/ks.txt
          FP=$(grep 'SHA256:' /tmp/ks.txt | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Verified Keystore SHA-256: $FP"

      - name: Clean Old Source & Generate v8.0 Project
        run: |
          rm -rf app/src/main/java app/src/main/res/layout app/build
          mkdir -p app/src/main/res/{values,drawable,mipmap-anydpi-v26,raw,xml} app/src/main/java/com/hona/alquran

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HonaAlQuran"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # جلب صوت الأذان المرفق (azan_012.mp3)
          find . -maxdepth 3 \( -name "azan_012*.mp3" -o -name "adhan.mp3" \) ! -path "./app/src/main/res/raw/adhan.mp3" -exec cp {} app/src/main/res/raw/adhan.mp3 \; || true
          if [ ! -s app/src/main/res/raw/adhan.mp3 ] || [ $(stat -c%s "app/src/main/res/raw/adhan.mp3" 2>/dev/null || echo 0) -lt 20000 ]; then
            curl -L -A "Mozilla/5.0" -s "https://ia801900.us.archive.org/28/items/90-azan/012.mp3" -o app/src/main/res/raw/adhan.mp3 || true
          fi
          if [ -f app/src/main/res/raw/adhan.mp3 ] && [ $(stat -c%s "app/src/main/res/raw/adhan.mp3" 2>/dev/null || echo 0) -lt 20000 ]; then
            rm -f app/src/main/res/raw/adhan.mp3
          fi

          # جلب صوتي الصلاة على النبي (salawat.mp3 و salawt2.mp3)
          find . -maxdepth 3 -name "salawat.mp3" ! -path "./app/src/main/res/raw/salawat.mp3" -exec cp {} app/src/main/res/raw/salawat.mp3 \; || true
          if [ ! -s app/src/main/res/raw/salawat.mp3 ]; then
            python3 -c 'import urllib.request, urllib.parse; text = "صَلِّ عَلَى مُحَمَّد، اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّد"; url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=" + urllib.parse.quote(text); req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}); open("app/src/main/res/raw/salawat.mp3", "wb").write(urllib.request.urlopen(req, timeout=15).read())' || true
          fi

          find . -maxdepth 3 \( -name "salawt2.mp3" -o -name "salawat2.mp3" \) ! -path "./app/src/main/res/raw/*" -exec cp {} app/src/main/res/raw/salawt2.mp3 \; || true
          if [ ! -s app/src/main/res/raw/salawt2.mp3 ]; then
            python3 -c 'import urllib.request, urllib.parse; text = "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيد"; url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=" + urllib.parse.quote(text); req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}); open("app/src/main/res/raw/salawt2.mp3", "wb").write(urllib.request.urlopen(req, timeout=15).read())' || true
          fi

          # أيقونة التطبيق
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#06281E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0B3B2D" android:pathData="M54,54m-45,0a45,45 0,1 1,90 0a45,45 0,1 1,-90 0"/>
              <path android:strokeColor="#E5A93B" android:strokeWidth="2.2" android:fillColor="#00000000" android:pathData="M54,54m-41,0a41,41 0,1 1,82 0a41,41 0,1 1,-82 0"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#E5A93B" android:pathData="M54,22A22,22 0,1 0,76 44A18,18 0,1 1,54 22Z"/>
              <path android:fillColor="#FFD700" android:pathData="M65,28L66.8,32.2L71.2,32.5L67.8,35.4L68.9,39.8L65,37.4L61.1,39.8L62.2,35.4L58.8,32.5L63.2,32.2Z"/>
              <path android:fillColor="#E5A93B" android:pathData="M34,60 L52,64 L52,78 L34,74 Z"/>
              <path android:fillColor="#C58B20" android:pathData="M74,60 L56,64 L56,78 L74,74 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # إعداد app/build.gradle.kts (نفس الحزمة alhana.quran + رقم إصدار أعلى 30 + توقيع alhana.jks الرسمي)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.hona.alquran"
              compileSdk = 34
              defaultConfig {
                  applicationId = "alhana.quran"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 30
                  versionName = "8.0"
                  resourceConfigurations += setOf("ar", "en")
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("../alhana.jks")
                      storePassword = System.getenv("KEYSTORE_PASS") ?: "AlHana2026Secure"
                      keyAlias = "alhana_key"
                      keyPassword = System.getenv("KEYSTORE_PASS") ?: "AlHana2026Secure"
                      enableV1Signing = true; enableV2Signing = true; enableV3Signing = true; enableV4Signing = true
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug { signingConfig = signingConfigs.getByName("release") }
              }
              packaging { resources { excludes += setOf("/META-INF/{AL2.0,LGPL2.1}", "META-INF/*.kotlin_module") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("com.batoulapps.adhan:adhan:1.2.1")
              implementation("com.google.android.gms:play-services-location:21.3.0")
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keep class com.hona.alquran.** { *; }
          -dontwarn com.batoulapps.adhan.**
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="Theme.HonaAlQuran" parent="android:Theme.Material.NoActionBar" /></resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths><external-path name="external_files" path="." /><files-path name="internal_files" path="." /></paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="هَنَا القُرآن - HANA EL Quran"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.HonaAlQuran"
                  tools:targetApi="33">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden" android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AdhanReceiver" android:enabled="true" android:exported="false" />
                  <receiver android:name=".SalawatReceiver" android:enabled="true" android:exported="false" />
                  <receiver android:name=".MediaActionReceiver" android:enabled="true" android:exported="false" />
                  <receiver android:name=".SalawatKeepAliveReceiver" android:enabled="true" android:exported="true" />
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
                  <service android:name=".AdhanService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaPlayback" />
                  <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.provider" android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # 1. ModelsAndRepo.kt
          cat << 'EOF' > app/src/main/java/com/hona/alquran/ModelsAndRepo.kt
          package com.hona.alquran

          data class CityLocation(val name: String, val lat: Double, val lng: Double)
          data class HadithItem(val title: String, val narrator: String, val source: String, val text: String, val explanation: String, val lessons: String)
          data class IslamicArticle(val title: String, val subtitle: String, val content: String)
          data class SurahMetaInfo(val revelationTypeAr: String, val reasonOfRevelation: String, val virtuesAndTheme: String)
          data class SurahInfo(val number: Int, val name: String, val ayahsCount: Int)
          data class AyahWithTafsir(val numberInSurah: Int, val text: String, val tafsir: String)
          data class ZikrItem(val category: String, val text: String, val benefit: String, val targetCount: Int)
          data class Reciter(val name: String, val serverUrl: String)
          data class RadioStation(val name: String, val subtitle: String, val streamUrl: String)
          data class PrayerItem(val key: String, val name: String, val timeInMillis: Long, val formattedTime: String)

          object IslamicRepository {
              val EGYPT_AND_ARAB_CITIES = listOf(
                  CityLocation("القاهرة - مصر", 30.0444, 31.2357), CityLocation("الإسكندرية - مصر", 31.2001, 29.9187),
                  CityLocation("دمنهور (البحيرة) - مصر", 31.0341, 30.4682), CityLocation("طنطا (الغربية) - مصر", 30.7865, 31.0004),
                  CityLocation("المنصورة (الدقهلية) - مصر", 31.0409, 31.3785), CityLocation("الزقازيق (الشرقية) - مصر", 30.5877, 31.5020),
                  CityLocation("أسيوط - مصر", 27.1810, 31.1837), CityLocation("أسوان - مصر", 24.0889, 32.8998),
                  CityLocation("مكة المكرمة - السعودية", 21.4225, 39.8262), CityLocation("المدينة المنورة - السعودية", 24.4672, 39.6112),
                  CityLocation("الرياض - السعودية", 24.7136, 46.6753), CityLocation("القدس الشريف - فلسطين", 31.7683, 35.2137),
                  CityLocation("عمّان - الأردن", 31.9454, 35.9284)
              )

              fun getSurahDetails(surahNumber: Int, surahName: String, ayahsCount: Int): SurahMetaInfo = when (surahNumber) {
                  1 -> SurahMetaInfo("مكية • 7 آيات", "نزلت بمكة المكرمة في بداية البعثة لتعليم المسلمين كيفية الثناء على الله ودعائه في كل ركعة.", "تُسمى أم الكتاب والسبع المثاني والشافية، ولا تصح الصلاة إلا بقراءتها.")
                  2 -> SurahMetaInfo("مدنية • 286 آية", "نزلت في المدينة المنورة على مراحل لتأسيس التشريعات الإسلامية وبناء المجتمع المسلم.", "سنام القرآن الكريم، وفيها أعظم آية في كتاب الله (آية الكرسي).")
                  3 -> SurahMetaInfo("مدنية • 200 آية", "نزل صدرها في وفد نجران، ونزل شطرها الثاني عقب غزوة أُحد.", "هي وسورة البقرة الزهراوان اللتان تحاجّان عن صاحبهما يوم القيامة.")
                  18 -> SurahMetaInfo("مكية • 110 آيات", "نزلت جواباً لأسئلة قريش الثلاثة عن فتية الكهف وذي القرنين والروح.", "نور ما بين الجمعتين لمن قرأها يوم الجمعة، والعشر الأوائل عصمة من الدجال.")
                  36 -> SurahMetaInfo("مكية • 83 آية", "نزلت لتثبيت فؤاد النبي ﷺ وتذكير قريش ببعث الخلائق.", "تُعرف بقلب القرآن، وتشتمل على أدلة البعث والنشور.")
                  67 -> SurahMetaInfo("مكية • 30 آية", "نزلت لبيان عظمة الملك الإلهي وإتقان خلق السماوات والأرض.", "هي المانعة والمنجية من عذاب القبر، شفعت لصاحبها حتى غُفر له.")
                  112 -> SurahMetaInfo("مكية • 4 آيات", "نزلت لما قال المشركون للنبي ﷺ: (انسب لنا ربك).", "تعدل ثلث القرآن الكريم لأنها أخلصت التوحيد الخالص لله عز وجل.")
                  113, 114 -> SurahMetaInfo("مكية • من المعوذتين", "نزلت للتحصين والاستعاذة بالله من شرور المخلوقات والحسد والوسواس.", "قال النبي ﷺ: (ما تعوّذ متعوّذ بمثلهما).")
                  else -> {
                      val isMadani = surahNumber in listOf(2,3,4,5,8,9,22,24,33,47,48,49,57,58,59,60,61,62,63,64,65,66,76,98,110)
                      SurahMetaInfo(
                          revelationTypeAr = "${if (isMadani) "مدنية" else "مكية"} • $ayahsCount آية",
                          reasonOfRevelation = if (isMadani) "نزلت بعد الهجرة النبوية في المدينة المنورة لتنظيم شؤون المجتمع المسلم وبيان الأحكام." else "نزلت قبل الهجرة في مكة المكرمة لترسيخ العقيدة والتوحيد والتذكير باليوم الآخر.",
                          virtuesAndTheme = "سورة $surahName من سور القرآن العظيم التي تهدي للتي هي أقوم وتدعو للتدبر."
                      )
                  }
              }

              val HADITH_LIST = listOf(
                  HadithItem("1. إنما الأعمال بالنيات", "عمر بن الخطاب رضي الله عنه", "صحيح البخاري (1) وصحيح مسلم (1907)", "عَنْ أَمِيرِ الْمُؤْمِنِينَ أَبِي حَفْصٍ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ: «إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى...».", "هذا الحديث قاعدة عظيمة من قواعد الإسلام وعليه مدار قبول الأعمال.", "• وجوب إخلاص النية لله في كل قول وعمل.\n• العادات المباحة تصبح عبادات بالنية الصالحة."),
                  HadithItem("2. فضل قراءة القرآن وتعلمه", "عثمان بن عفان رضي الله عنه", "صحيح البخاري (5027)", "عَنْ عُثْمَانَ بْنِ عَفَّانَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولَ اللَّهِ ﷺ: «خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ».", "يبين النبي ﷺ أن أفضل الناس منزلة هم أهل القرآن.", "• الحرص على ورد يومي لتعلم القرآن وتدبره."),
                  HadithItem("3. أحب الأعمال إلى الله", "عبد الله بن مسعود رضي الله عنه", "متفق عليه", "عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: سَأَلْتُ النَّبِيَّ ﷺ: أَيُّ الْعَمَلِ أَحَبُّ إِلَى اللَّهِ؟ قَالَ: «الصَّلَاةُ عَلَى وَقْتِهَا»...", "رتّب النبي ﷺ أحب الأعمال إلى الله فبدأ بالصلاة على وقتها.", "• المبادرة للصلاة فور سماع الأذان."),
                  HadithItem("4. فضل الصلاة على النبي ﷺ", "أبو هريرة رضي الله عنه", "صحيح مسلم (408)", "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ: «مَنْ صَلَّى عَلَيَّ وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ عَشْرًا».", "صلاة الله على عبده ثناؤه عليه في الملأ الأعلى.", "• الإكثار من الصلاة على النبي ﷺ طوال اليوم."),
