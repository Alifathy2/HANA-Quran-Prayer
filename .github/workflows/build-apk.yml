                  prayers = PrayerCalculator.getTodayPrayers(context, lat, lng)
                  nextP = PrayerCalculator.getNextPrayer(context, lat, lng)
                  locStatus = PrayerCalculator.getSavedCityName(context)
              }

              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { perms ->
                  val autoGps = prefs.getBoolean("auto_gps", true)
                  if (autoGps && (perms[Manifest.permission.ACCESS_FINE_LOCATION] == true || perms[Manifest.permission.ACCESS_COARSE_LOCATION] == true)) {
                      LocationServices.getFusedLocationProviderClient(context).lastLocation.addOnSuccessListener { loc ->
                          if (loc != null) {
