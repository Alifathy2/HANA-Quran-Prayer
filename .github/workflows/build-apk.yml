                          }
                      }
                  }

                  // بطاقة متابعة صلواتك اليوم (ميزة مستوحاة من تطبيق المصلي)
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.9f)),
                          shape = RoundedCornerShape(16.dp),
                          modifier = Modifier.fillMaxWidth().border(1.dp, MaterialTheme.colorScheme.primary.copy(alpha = 0.35f), RoundedCornerShape(16.dp))
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("✓ متابعة صلواتك اليوم (اضغط لتسجيل صلاتك)", fontSize = 13.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Spacer(Modifier.height(8.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp), modifier = Modifier.fillMaxWidth()) {
                                  listOf(
                                      Triple("الفجر", fajrDone) { v: Boolean -> fajrDone = v; prefs.edit().putBoolean("track_${todayKey}_fajr", v).apply() },
                                      Triple("الظهر", dhuhrDone) { v: Boolean -> dhuhrDone = v; prefs.edit().putBoolean("track_${todayKey}_dhuhr", v).apply() },
                                      Triple("العصر", asrDone) { v: Boolean -> asrDone = v; prefs.edit().putBoolean("track_${todayKey}_asr", v).apply() },
                                      Triple("المغرب", maghribDone) { v: Boolean -> maghribDone = v; prefs.edit().putBoolean("track_${todayKey}_maghrib", v).apply() },
                                      Triple("العشاء", ishaDone) { v: Boolean -> ishaDone = v; prefs.edit().putBoolean("track_${todayKey}_isha", v).apply() }
