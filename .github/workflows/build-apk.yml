          @Composable
          fun MoreSectionScreen(theme: Int, onTheme: (Int) -> Unit, scale: Float, onScale: (Float) -> Unit, onCalc: () -> Unit) {
              var currentPage by remember { mutableStateOf("MENU") }

              val menuItems = listOf(
                  Triple("RADIO", "إذاعات القرآن والراديو", Icons.Default.Radio),
                  Triple("HUSARY_KIDS", "مرتل الحصري للأطفال", Icons.Default.ChildCare),
                  Triple("COMPASS", "بوصلة اتجاه القبلة", Icons.Default.Explore),
                  Triple("TASBEEH", "السبحة الإلكترونية", Icons.Default.TouchApp),
                  Triple("HADITH", "أحاديث نبوية شريفة", Icons.Default.AutoStories),
                  Triple("PROPHETS", "قصص الأنبياء الكاملة", Icons.Default.HistoryEdu),
                  Triple("GHAZAWAT", "قسم الغزوات النبوية", Icons.Default.Shield),
                  Triple("SARAYA", "قسم السرايا الإسلامية", Icons.Default.MilitaryTech),
                  Triple("QURAN_STORIES", "قصص القرآن الكريم", Icons.Default.MenuBook),
                  Triple("QURAN_RULES", "أحكام التجويد", Icons.Default.FactCheck),
                  Triple("SETTINGS", "الإعدادات والموقع والصوتيات", Icons.Default.Settings)
              )

              Column(modifier = Modifier.fillMaxSize()) {
                  if (currentPage != "MENU") {
                      Row(modifier = Modifier.fillMaxWidth().padding(bottom = 10.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          UniformButton("رجوع للقائمة") { currentPage = "MENU" }
                          Text(menuItems.firstOrNull { it.first == currentPage }?.second ?: "", fontSize = 17.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                      }
                  }

                  when (currentPage) {
                      "MENU" -> {
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                              item { Text("أقسام إسلامية ومزايا متقدمة", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary, modifier = Modifier.padding(bottom = 4.dp)) }
                              items(menuItems.chunked(2)) { rowItems ->
                                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxWidth()) {
                                      rowItems.forEach { (key, title, icon) ->
                                          Card(
                                              modifier = Modifier.weight(1f).height(100.dp).border(1.dp, MaterialTheme.colorScheme.primary.copy(alpha = 0.4f), RoundedCornerShape(16.dp)).clickable { currentPage = key },
                                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.92f)),
                                              shape = RoundedCornerShape(16.dp)
                                          ) {
                                              Column(modifier = Modifier.fillMaxSize().padding(10.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                                                  Icon(icon, null, tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(28.dp))
                                                  Spacer(Modifier.height(6.dp))
                                                  Text(title, fontSize = 13.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center, maxLines = 1, softWrap = false)
                                              }
                                          }
                                      }
                                      if (rowItems.size == 1) Spacer(Modifier.weight(1f))
                                  }
                              }
                          }
                      }
                      "RADIO" -> RadioScreen()
                      "HUSARY_KIDS" -> HusaryKidsMuallimScreen()
                      "COMPASS" -> CompassView()
                      "TASBEEH" -> TasbeehView()
                      "HADITH" -> HadithListView(IslamicRepository.HADITH_LIST, scale)
                      "PROPHETS" -> ArticlesListView(IslamicRepository.PROPHETS_STORIES, scale)
                      "GHAZAWAT" -> ArticlesListView(IslamicRepository.GHAZAWAT_LIST, scale)
                      "SARAYA" -> ArticlesListView(IslamicRepository.SARAYA_LIST, scale)
                      "QURAN_STORIES" -> ArticlesListView(IslamicRepository.QURAN_STORIES, scale)
                      "QURAN_RULES" -> ArticlesListView(IslamicRepository.QURAN_RULES, scale)
                      "SETTINGS" -> SettingsScreen(theme, onTheme, scale, onScale, onCalc)
                  }
              }
          }

