          @Composable
          fun KhatmahPlannerScreen() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
              var targetDays by remember { mutableIntStateOf(prefs.getInt("khatmah_days", 30)) }
              var completedJuz by remember { mutableIntStateOf(prefs.getInt("khatmah_juz", 0)) }
              val dailyPages = (604.0 / targetDays).toInt().coerceAtLeast(1)

              LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxSize()) {
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), shape = RoundedCornerShape(16.dp)) {
                          Column(modifier = Modifier.fillMaxWidth().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("مخطط ختمة القرآن الكريم (ميزة المصلي)", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text("اختر مدة الختمة المطلوبة لحساب وردك اليومي بدقة:", fontSize = 13.sp, color = Color.LightGray)
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp), modifier = Modifier.fillMaxWidth()) {
                                  listOf(7 to "أسبوع", 15 to "15 يوم", 30 to "شهر", 60 to "شهران").forEach { (days, label) ->
                                      UniformButton(label, Modifier.weight(1f), isSelected = targetDays == days) { targetDays = days; prefs.edit().putInt("khatmah_days", days).apply() }
                                  }
                              }
                              HorizontalDivider(color = Color.Gray.copy(alpha = 0.3f))
                              Text("📖 وردك اليومي المطلوب: $dailyPages صفحة يومياً", fontSize = 15.sp, fontWeight = FontWeight.Bold, color = Color.White)
                              Text("نسبة الإنجاز: $completedJuz من 30 جزء (${(completedJuz * 100) / 30}%)", fontSize = 14.sp, color = MaterialTheme.colorScheme.primary)
                              LinearProgressIndicator(progress = { completedJuz / 30f }, modifier = Modifier.fillMaxWidth().height(10.dp), color = MaterialTheme.colorScheme.primary)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                                  UniformButton("أتممت جزءاً (+1)", Modifier.weight(1f)) { if (completedJuz < 30) { completedJuz++; prefs.edit().putInt("khatmah_juz", completedJuz).apply() } }
                                  UniformButton("تصفير الختمة", Modifier.weight(1f)) { completedJuz = 0; prefs.edit().putInt("khatmah_juz", 0).apply() }
                              }
                          }
                      }
                  }
              }
          }

