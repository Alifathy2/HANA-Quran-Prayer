name: Build Signed Release APK (HANA EL Quran v6.0)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean Old Files & Generate v6.0 Project
        run: |
          rm -rf app/src/main/java
          rm -rf app/src/main/res/layout
          rm -rf app/build

          # 1. إعداد gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 2. إعداد settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HonaAlQuran"
          include(":app")
          EOF

          # 3. إعداد build.gradle.kts الرئيسي
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 4. إنشاء هيكل المجلدات
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/java/com/hona/alquran/service

          # 5. جلب ملف صوت أذان المحور المرفق (azan_012.mp3)
          find . -maxdepth 3 -name "azan_012.mp3" -exec cp {} app/src/main/res/raw/adhan.mp3 \; || true
          find . -maxdepth 3 -name "adhan.mp3" ! -path "./app/src/main/res/raw/adhan.mp3" -exec cp {} app/src/main/res/raw/adhan.mp3 \; || true

          if [ ! -s app/src/main/res/raw/adhan.mp3 ]; then
            curl -L -A "Mozilla/5.0" -s "https://ia801900.us.archive.org/28/items/90-azan/012.mp3" -o app/src/main/res/raw/adhan.mp3 || true
          fi
          if [ -f app/src/main/res/raw/adhan.mp3 ]; then
            FILE_SIZE=$(stat -c%s "app/src/main/res/raw/adhan.mp3" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -lt 20000 ]; then
              curl -L -A "Mozilla/5.0" -s "https://www.islamcan.com/audio/adhan/azan1.mp3" -o app/src/main/res/raw/adhan.mp3 || true
            fi
          fi
          if [ -f app/src/main/res/raw/adhan.mp3 ]; then
            FILE_SIZE=$(stat -c%s "app/src/main/res/raw/adhan.mp3" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -lt 20000 ]; then
              rm -f app/src/main/res/raw/adhan.mp3
            fi
          fi

          # 6. تصميم إشعار مخصص لهواتف شاومي (Xiaomi MIUI) يضمن ظهور كلمات "إيقاف مؤقت / استئناف" و "إيقاف" بوضوح
          cat << 'EOF' > app/src/main/res/layout/notif_xiaomi_player.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="#083024"
              android:padding="12dp">

              <TextView
                  android:id="@+id/notif_title"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#E5A93B"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:gravity="right"
                  android:text="هَنَا القُرآن - المشغل الصوتي" />

              <TextView
                  android:id="@+id/notif_sub"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#FFFFFF"
                  android:textSize="13sp"
                  android:gravity="right"
                  android:layout_marginTop="2dp"
                  android:text="يعمل في الخلفية" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center"
                  android:layout_marginTop="8dp">

                  <Button
                      android:id="@+id/btn_notif_toggle"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:backgroundTint="#E5A93B"
                      android:textColor="#052219"
                      android:textStyle="bold"
                      android:textSize="13sp"
                      android:text="إيقاف مؤقت" />

                  <Space
                      android:layout_width="10dp"
                      android:layout_height="1dp" />

                  <Button
                      android:id="@+id/btn_notif_stop"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:backgroundTint="#C62828"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold"
                      android:textSize="13sp"
                      android:text="إيقاف نهائي" />
              </LinearLayout>
          </LinearLayout>
          EOF

          # 7. إعداد FileProvider للتحديث الداخلي
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <files-path name="updates" path="." />
              <cache-path name="cache_updates" path="." />
              <external-files-path name="ext_updates" path="." />
          </paths>
          EOF

          # 8. أيقونة التطبيق الإسلامية (مطابقة للهوية البصرية الذهبية والزمردية في الصورة المرفقة)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#06281E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0B3B2D" android:pathData="M54,54m-45,0a45,45 0,1 1,90 0a45,45 0,1 1,-90 0"/>
              <path android:strokeColor="#E5A93B" android:strokeWidth="2.2" android:fillColor="#00000000" android:pathData="M54,54m-41,0a41,41 0,1 1,82 0a41,41 0,1 1,-82 0"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#E5A93B" android:pathData="M54,22A22,22 0,1 0,76 44A18,18 0,1 1,54 22Z"/>
              <path android:fillColor="#FFD700" android:pathData="M65,28L66.8,32.2L71.2,32.5L67.8,35.4L68.9,39.8L65,37.4L61.1,39.8L62.2,35.4L58.8,32.5L63.2,32.2Z"/>
              <path android:fillColor="#E5A93B" android:pathData="M34,60 L52,64 L52,78 L34,74 Z"/>
              <path android:fillColor="#C58B20" android:pathData="M74,60 L56,64 L56,78 L74,74 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 9. قواعد ProGuard
          cat << 'EOF' > app/proguard-rules.pro
          -keep class com.hona.alquran.** { *; }
          -keep class com.batoulapps.adhan.** { *; }
          -dontwarn **
          EOF

          # 10. إعداد app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hona.alquran"
              compileSdk = 34

              defaultConfig {
                  applicationId = "alhana.quran"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 10
                  versionName = "6.0"
                  resourceConfigurations += setOf("ar", "en")
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("../alhana.jks")
                      storePassword = System.getenv("KEYSTORE_PASS") ?: "AlHana2026Secure"
                      keyAlias = "alhana_key"
                      keyPassword = System.getenv("KEYSTORE_PASS") ?: "AlHana2026Secure"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("com.batoulapps.adhan:adhan:1.2.1")
              implementation("com.google.android.gms:play-services-location:21.3.0")
          }
          EOF

          # 11. إعداد themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.HonaAlQuran" parent="android:Theme.Material.NoActionBar" />
          </resources>
          EOF

          # 12. إعداد AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="هَنَا القُرآن - HANA EL Quran"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.HonaAlQuran"
                  tools:targetApi="34">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".service.AdhanReceiver" android:enabled="true" android:exported="false" />
                  <receiver android:name=".service.SalawatReceiver" android:enabled="true" android:exported="false" />
                  <receiver android:name=".service.BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".service.AdhanService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />

                  <service
                      android:name=".service.MediaPlaybackService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          # 13. كود المحتوى الديني ومعلومات السور والمدن (IslamicRepository.kt)
          cat << 'EOF' > app/src/main/java/com/hona/alquran/IslamicRepository.kt
          package com.hona.alquran

          data class CityLocation(val name: String, val lat: Double, val lng: Double)
          data class IslamicArticle(val title: String, val subtitle: String, val content: String)
          data class SurahMetaInfo(val revelationTypeAr: String, val reasonOfRevelation: String, val virtuesAndTheme: String)

          object IslamicRepository {
              val EGYPT_AND_ARAB_CITIES = listOf(
                  CityLocation("القاهرة - مصر", 30.0444, 31.2357),
                  CityLocation("الإسكندرية - مصر", 31.2001, 29.9187),
                  CityLocation("دمنهور (البحيرة) - مصر", 31.0341, 30.4682),
                  CityLocation("طنطا (الغربية) - مصر", 30.7865, 31.0004),
                  CityLocation("المنصورة (الدقهلية) - مصر", 31.0409, 31.3785),
                  CityLocation("الزقازيق (الشرقية) - مصر", 30.5877, 31.5020),
                  CityLocation("أسيوط - مصر", 27.1810, 31.1837),
                  CityLocation("أسوان - مصر", 24.0889, 32.8998),
                  CityLocation("مكة المكرمة - السعودية", 21.4225, 39.8262),
                  CityLocation("المدينة المنورة - السعودية", 24.4672, 39.6112),
                  CityLocation("الرياض - السعودية", 24.7136, 46.6753),
                  CityLocation("القدس الشريف - فلسطين", 31.7683, 35.2137),
                  CityLocation("عمّان - الأردن", 31.9454, 35.9284)
              )

              fun getSurahDetails(surahNumber: Int, surahName: String, ayahsCount: Int): SurahMetaInfo {
                  return when (surahNumber) {
                      1 -> SurahMetaInfo(
                          "مكية • 7 آيات",
                          "نزلت بمكة المكرمة في بداية البعثة لتعليم المسلمين كيفية الثناء على الله ودعائه في كل ركعة.",
                          "تُسمى أم الكتاب والسبع المثاني والشافية، ولا تصح الصلاة إلا بقراءتها، وتجمع مقاصد القرآن من توحيد وعبادة وهداية."
                      )
                      2 -> SurahMetaInfo(
                          "مدنية • 286 آية",
                          "نزلت في المدينة المنورة على مراحل لتأسيس التشريعات الإسلامية وبناء المجتمع المسلم.",
                          "سنام القرآن الكريم، وفيها أعظم آية في كتاب الله (آية الكرسي)، وقال النبي ﷺ: (اقرؤوا سورة البقرة فإن أخذها بركة وتركها حسرة ولا تستطيعها البطلة)."
                      )
                      3 -> SurahMetaInfo(
                          "مدنية • 200 آية",
                          "نزل صدرها في وفد نجران حين جادلوا في شأن عيسى عليه السلام، ونزل شطرها الثاني عقب غزوة أُحد.",
                          "هي وسورة البقرة الزهراوان اللتان تحاجّان عن صاحبهما يوم القيامة، وتثبت المؤمنين على الحق."
                      )
                      18 -> SurahMetaInfo(
                          "مكية • 110 آيات",
                          "نزلت جواباً لأسئلة قريش الثلاثة عن فتية الكهف، والرجل الطواف (ذي القرنين)، وحقيقة الروح.",
                          "نور ما بين الجمعتين لمن قرأها يوم الجمعة، والعشر آيات الأوائل منها عصمة من فتنة المسيح الدجال."
                      )
                      36 -> SurahMetaInfo(
                          "مكية • 83 آية",
                          "نزلت لتثبيت فؤاد النبي ﷺ وتذكير قريش ببعث الخلائق وقدرة الله الباهرة في الكون.",
                          "تُعرف بقلب القرآن، وتشتمل على أدلة البعث والنشور وقصة أصحاب القرية ونعيم أهل الجنة."
                      )
                      67 -> SurahMetaInfo(
                          "مكية • 30 آية",
                          "نزلت لبيان عظمة الملك الإلهي وإتقان خلق السماوات والأرض.",
                          "هي المانعة والمنجية من عذاب القبر، شفعت لصاحبها حتى غُفر له."
                      )
                      112 -> SurahMetaInfo(
                          "مكية • 4 آيات",
                          "نزلت لما قال المشركون للنبي ﷺ: (انسب لنا ربك)، فأنزل الله: قل هو الله أحد الله الصمد.",
                          "تعدل ثلث القرآن الكريم لأنها أخلصت التوحيد الخالص لله عز وجل ونزهته عن الشبيه والولد."
                      )
                      113, 114 -> SurahMetaInfo(
                          "مكية • من المعوذتين",
                          "نزلت للتحصين والاستعاذة بالله من شرور المخلوقات والحسد والوسواس الخناس.",
                          "قال النبي ﷺ: (ما تعوّذ متعوّذ بمثلهما)، وتُقرأ دبر كل صلاة وفي أذكار الصباح والمساء والنوم."
                      )
                      else -> {
                          val isMadani = surahNumber in listOf(2,3,4,5,8,9,22,24,33,47,48,49,57,58,59,60,61,62,63,64,65,66,76,98,110)
                          SurahMetaInfo(
                              revelationTypeAr = "${if (isMadani) "مدنية" else "مكية"} • $ayahsCount آية",
                              reasonOfRevelation = if (isMadani) "نزلت بعد الهجرة النبوية في المدينة المنورة لتنظيم شؤون المجتمع المسلم، وبيان الأحكام، وتثبيت المؤمنين." else "نزلت قبل الهجرة في مكة المكرمة لترسيخ العقيدة والتوحيد، وتذكير النفوس باليوم الآخر، وضرب الأمثال للأمم السابقة.",
                              virtuesAndTheme = "سورة $surahName من سور القرآن العظيم التي تهدي للتي هي أقوم، وتدعو إلى تدبر آيات الله والعمل بمحكمها."
                          )
                      }
                  }
              }

              val HADITH_LIST = listOf(
                  IslamicArticle("1. إنما الأعمال بالنيات", "رواه البخاري ومسلم", "عَنْ أَمِيرِ الْمُؤْمِنِينَ أَبِي حَفْصٍ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ: «إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ».\n\nالفائدة: النية الصالحة تحول العادات اليومية إلى عبادات عظيمة الأجر."),
                  IslamicArticle("2. فضل قراءة القرآن وتعلمه", "رواه البخاري", "عَنْ عُثْمَانَ بْنِ عَفَّانَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: «خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ».\n\nالفائدة: أعظم شرف يناله المسلم هو الارتباط بكتاب الله تلاوةً وتعلماً وتعليماً."),
