name: Build Signed Release APK (HANA v7.9)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check the signing key matches the installed app
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then echo "::error::Secret KEYSTORE_PASSWORD is not set in the repository settings."; exit 1; fi
          if [ ! -f alhana.jks ]; then echo "::error::alhana.jks is missing from the repository root."; exit 1; fi
          keytool -list -v -keystore alhana.jks -storepass "$KEYSTORE_PASS" -alias alhana_key > /tmp/ks.txt || { echo "::error::Cannot open alhana.jks with the KEYSTORE_PASSWORD secret (or alias alhana_key is wrong)."; exit 1; }
          FP=$(grep 'SHA256:' /tmp/ks.txt | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Keystore certificate SHA-256: $FP"
          grep -E 'Owner:' /tmp/ks.txt | head -1
          echo "Compare this fingerprint with the installed app's certificate. If they differ, the update will NOT install over the old app."
          echo "Published APK fingerprint at the time of writing: da9fcf773da58fd8bb0392cac7b70ad4ae40c99ddd93cd590977b0f52c068c47"
          if [ "$FP" != "da9fcf773da58fd8bb0392cac7b70ad4ae40c99ddd93cd590977b0f52c068c47" ]; then
            echo "::warning::The keystore fingerprint differs from the currently published APK. Do not roll this out to users before testing on one phone."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK + Version JSON
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease -Pandroid.useAndroidX=true --stacktrace
          OUT=app/build/outputs/apk/release
          ls -la "$OUT"
          APK=$(ls "$OUT"/*.apk | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then echo "::error::No signed APK was produced (only unsigned or none). Signing did not apply."; ls -R app/build/outputs; exit 1; fi
          cp "$APK" "$OUT/alhana.quran.apk"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$OUT/alhana.quran.apk" | head -3
          echo '{"versionCode": 29, "versionName": "7.9"}' > "$OUT/version.json"

      - name: Upload Signed APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hona-AlQuran-APK
          path: |
            app/build/outputs/apk/release/alhana.quran.apk
            app/build/outputs/apk/release/version.json

      - name: Publish Direct OTA Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "هَنَا القُرآن - Hana (v7.9)"
          files: |
            app/build/outputs/apk/release/alhana.quran.apk
            app/build/outputs/apk/release/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
