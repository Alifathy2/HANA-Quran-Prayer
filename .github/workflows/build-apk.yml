          # 12. محرك الصوت المباشر (AudioEngine.kt) مع فحص البث الحي للراديو لضمان عدم وجود قنوات معطلة
          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/AudioEngine.kt
          package com.hona.alquran.service

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.widget.Toast
          import androidx.compose.runtime.MutableState
          import androidx.compose.runtime.mutableStateOf
          import androidx.core.app.NotificationCompat
          import com.hona.alquran.MainActivity
          import java.net.HttpURLConnection
          import java.net.URL

          object MediaPlaybackState {
              val currentTitle: MutableState<String?> = mutableStateOf(null)
              val currentUrl: MutableState<String?> = mutableStateOf(null)
              val isPlaying: MutableState<Boolean> = mutableStateOf(false)
              val isBuffering: MutableState<Boolean> = mutableStateOf(false)
          }

          object AudioEngine {
              private var mp: MediaPlayer? = null
              private var wl: PowerManager.WakeLock? = null
              private val mainHandler = Handler(Looper.getMainLooper())
              private var lastTitle: String = ""
              private var lastSubtitle: String = ""
              private const val CHANNEL_ID = "hana_direct_audio_ch"

              private fun resolveRedirectUrl(originalUrl: String): String {
                  if (!originalUrl.startsWith("http")) return originalUrl
                  return try {
                      var current = originalUrl
                      for (i in 0..4) {
                          val conn = (URL(current).openConnection() as HttpURLConnection).apply {
                              instanceFollowRedirects = false
                              requestMethod = "GET"
                              setRequestProperty("User-Agent", "Mozilla/5.0")
                              connectTimeout = 5000
                              readTimeout = 5000
                          }
                          val code = conn.responseCode
                          if (code in 300..399) {
                              val loc = conn.getHeaderField("Location")
                              conn.disconnect()
                              if (!loc.isNullOrEmpty()) current = loc else break
                          } else {
                              conn.disconnect()
                              break
                          }
                      }
                      current
                  } catch (_: Exception) {
                      originalUrl
                  }
              }

              fun play(context: Context, url: String, title: String, subtitle: String) {
                  val appCtx = context.applicationContext
                  lastTitle = title
                  lastSubtitle = subtitle
                  MediaPlaybackState.currentTitle.value = title
                  MediaPlaybackState.currentUrl.value = url
                  MediaPlaybackState.isBuffering.value = true
                  MediaPlaybackState.isPlaying.value = false

                  try {
                      if (wl == null) {
                          val pm = appCtx.getSystemService(Context.POWER_SERVICE) as PowerManager
                          wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Hana::DirectAudioLock").apply {
                              setReferenceCounted(false)
                              acquire(3 * 60 * 60 * 1000L)
                          }
                      }
                  } catch (_: Exception) {}

                  showControlNotification(appCtx, "جاري الاتصال والبث...")

                  Thread {
                      try {
                          mp?.reset()
                          mp?.release()
                          val finalUrl = resolveRedirectUrl(url)
                          val player = MediaPlayer()
                          player.setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build()
                          )
                          player.setDataSource(finalUrl)
                          player.setOnPreparedListener { p ->
                              mainHandler.post {
                                  MediaPlaybackState.isBuffering.value = false
                                  MediaPlaybackState.isPlaying.value = true
                                  p.start()
                                  showControlNotification(appCtx, lastSubtitle)
                              }
                          }
                          player.setOnCompletionListener {
                              mainHandler.post { stop(appCtx) }
                          }
                          player.setOnErrorListener { _, _, _ ->
                              mainHandler.post {
                                  Toast.makeText(appCtx, "عذراً، البث متوقف مؤقتاً أو لا يوجد إنترنت", Toast.LENGTH_SHORT).show()
                                  stop(appCtx)
                              }
                              true
                          }
                          player.prepareAsync()
                          mp = player
                      } catch (_: Exception) {
                          mainHandler.post {
                              Toast.makeText(appCtx, "تعذر تشغيل الراديو، تحقق من الاتصال", Toast.LENGTH_SHORT).show()
                              stop(appCtx)
                          }
                      }
                  }.start()
              }

              fun toggle(context: Context) {
                  val appCtx = context.applicationContext
                  try {
                      val player = mp ?: return
                      if (player.isPlaying) {
                          player.pause()
                          MediaPlaybackState.isPlaying.value = false
                          showControlNotification(appCtx, "متوقف مؤقتاً")
                      } else {
                          player.start()
                          MediaPlaybackState.isPlaying.value = true
                          showControlNotification(appCtx, lastSubtitle)
                      }
                  } catch (_: Exception) {}
              }

              fun stop(context: Context) {
                  val appCtx = context.applicationContext
                  MediaPlaybackState.isPlaying.value = false
                  MediaPlaybackState.isBuffering.value = false
                  MediaPlaybackState.currentTitle.value = null
                  MediaPlaybackState.currentUrl.value = null
                  try {
                      mp?.stop()
                      mp?.release()
                  } catch (_: Exception) {}
                  mp = null
                  try {
                      if (wl?.isHeld == true) wl?.release()
                  } catch (_: Exception) {}
                  wl = null
                  try {
                      val nm = appCtx.getSystemService(NotificationManager::class.java)
                      nm.cancel(2002)
                  } catch (_: Exception) {}
              }

              private fun showControlNotification(context: Context, statusText: String) {
                  try {
                      val nm = context.getSystemService(NotificationManager::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          nm.createNotificationChannel(NotificationChannel(CHANNEL_ID, "مشغل القرآن والراديو", NotificationManager.IMPORTANCE_LOW))
                      }
                      val openPi = PendingIntent.getActivity(
                          context, 10,
                          Intent(context, MainActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_SINGLE_TOP },
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val togglePi = PendingIntent.getBroadcast(
                          context, 11,
                          Intent(context, MediaActionReceiver::class.java).apply { action = "ACTION_TOGGLE" },
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val stopPi = PendingIntent.getBroadcast(
                          context, 12,
                          Intent(context, MediaActionReceiver::class.java).apply { action = "ACTION_STOP" },
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val playing = MediaPlaybackState.isPlaying.value
                      val buffering = MediaPlaybackState.isBuffering.value
                      val actionLabel = if (playing) "إيقاف مؤقت" else "استئناف"
                      val actionIcon = if (playing) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play

                      val notif = NotificationCompat.Builder(context, CHANNEL_ID)
                          .setContentTitle(lastTitle)
                          .setContentText(statusText)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentIntent(openPi)
                          .addAction(actionIcon, actionLabel, togglePi)
                          .addAction(android.R.drawable.ic_delete, "إيقاف نهائي", stopPi)
                          .setOngoing(playing || buffering)
                          .build()

                      nm.notify(2002, notif)
                  } catch (_: Exception) {}
              }
          }

          class MediaActionReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.action) {
                      "ACTION_TOGGLE" -> AudioEngine.toggle(context)
                      "ACTION_STOP" -> AudioEngine.stop(context)
                  }
              }
          }
          EOF

          # 13. جدولة الأذان والتنبيهات الموقعة (AdhanScheduler.kt)
          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/AdhanScheduler.kt
          package com.hona.alquran.service

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import com.hona.alquran.MainActivity
          import com.hona.alquran.PrayerCalculator
          import java.util.Calendar

          object AdhanScheduler {
              fun scheduleAllPrayers(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val prefs = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                  val (lat, lng) = PrayerCalculator.getSavedLocation(context)
                  val now = System.currentTimeMillis()

                  val prayers = PrayerCalculator.getTodayPrayers(context, lat, lng).filter { it.key != "sunrise" } +
                                PrayerCalculator.getTodayPrayers(context, lat, lng, Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR, 1) }.time).filter { it.key != "sunrise" }

                  for (i in 0..25) {
                      val cancelPi = PendingIntent.getBroadcast(context, 100 + i, Intent(context, AdhanReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      am.cancel(cancelPi)
                      val cancelPrePi = PendingIntent.getBroadcast(context, 200 + i, Intent(context, AdhanReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      am.cancel(cancelPrePi)
                  }

                  val futurePrayers = prayers.filter { it.timeInMillis > now + 5000L }

                  futurePrayers.forEachIndexed { i, p ->
                      val isEnabled = prefs.getBoolean("enable_${p.key}", true)
                      if (isEnabled) {
                          val intent = Intent(context, AdhanReceiver::class.java).apply {
                              putExtra("PRAYER_KEY", p.key)
                              putExtra("PRAYER_NAME", p.name)
                              putExtra("SCHEDULED_TIME", p.timeInMillis)
                              putExtra("IS_PRE_REMINDER", false)
                          }
                          val pi = PendingIntent.getBroadcast(context, 100 + i, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                          scheduleExact(context, am, p.timeInMillis, pi)
                      }
                  }

                  scheduleSalawatReminder(context)
                  scheduleAdhkarReminders(context)
              }

              private fun scheduleExact(context: Context, am: AlarmManager, triggerAtMillis: Long, operation: PendingIntent) {
                  try {
                      val showIntent = PendingIntent.getActivity(context, 0, Intent(context, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                      val clockInfo = AlarmManager.AlarmClockInfo(triggerAtMillis, showIntent)
                      am.setAlarmClock(clockInfo, operation)
                  } catch (_: Exception) {
                      try {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMillis, operation)
                      } catch (_: Exception) {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMillis, operation)
                      }
                  }
              }

              fun scheduleSalawatReminder(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val prefs = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                  val enabled = prefs.getBoolean("salawat_enabled", false)
                  val intervalMins = prefs.getInt("salawat_interval", 15).coerceAtLeast(5)

                  val intent = Intent(context, SalawatReceiver::class.java)
                  val pi = PendingIntent.getBroadcast(context, 555, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  am.cancel(pi)

                  if (enabled) {
                      val triggerAt = System.currentTimeMillis() + (intervalMins * 60 * 1000L)
                      scheduleExact(context, am, triggerAt, pi)
                  }
              }

              fun scheduleAdhkarReminders(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val prefs = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                  val enabled = prefs.getBoolean("adhkar_notif_enabled", true)

                  val intent = Intent(context, AdhkarReceiver::class.java)
                  val pi = PendingIntent.getBroadcast(context, 777, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  am.cancel(pi)

                  if (enabled) {
                      // Schedule every 3 hours
                      val triggerAt = System.currentTimeMillis() + (3 * 3600 * 1000L)
                      scheduleExact(context, am, triggerAt, pi)
                  }
              }
          }
