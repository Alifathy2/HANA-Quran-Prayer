                                  tint = if (isN) Color(0xFFB07219) else MaterialTheme.colorScheme.primary
                              )
                              Spacer(Modifier.width(10.dp))
                              Text(
                                  text = p.name,
                                  fontSize = 19.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = if (isN) Color(0xFF7A4900) else Color.White
