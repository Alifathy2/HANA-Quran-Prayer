                      .onFocusChanged { focused = it.isFocused }
                      .focusable()
                      .border(if (focused) 2.dp else 0.dp, MaterialTheme.colorScheme.primary, RoundedCornerShape(12.dp))
                      .clickable { onClick() }
                      .padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(icon, null, tint = if (isSelected) MaterialTheme.colorScheme.primary else Color.White)
                  Spacer(Modifier.width(10.dp))
                  Text(title, fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal, color = if (isSelected) MaterialTheme.colorScheme.primary else Color.White)
              }
