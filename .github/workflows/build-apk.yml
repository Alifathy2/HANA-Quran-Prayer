                                  RoundedCornerShape(14.dp)
                              )
                              .border(
                                  width = if (isN) 2.dp else 1.dp,
                                  color = if (isN) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.primary.copy(alpha = 0.25f),
                                  shape = RoundedCornerShape(14.dp)
                              )
                              .padding(horizontal = 20.dp, vertical = 15.dp),
