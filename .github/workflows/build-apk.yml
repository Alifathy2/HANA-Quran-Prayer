                                      Row(horizontalArrangement = Arrangement.spacedBy(4.dp), modifier = Modifier.fillMaxWidth()) {
                                          listOf(0 to "إيقاف", 5 to "5 د", 10 to "10 د", 15 to "15 د", 30 to "30 د").forEach { (m, label) ->
                                              UniformButton(label, Modifier.weight(1f), isSelected = preMins == m) {
