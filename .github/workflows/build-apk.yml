          @Composable
          fun QiblaCompassView() {
              val context = LocalContext.current
              val qiblaAngle = remember { PrayerCalculator.getQiblaAngle(context) }
              var deviceAzimuth by remember { mutableFloatStateOf(0f) }
              var hasSensor by remember { mutableStateOf(true) }

              DisposableEffect(Unit) {
                  val sensorManager = context.getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  val rotationSensor = sensorManager.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR)
                      ?: sensorManager.getDefaultSensor(Sensor.TYPE_ORIENTATION)

                  if (rotationSensor == null) {
                      hasSensor = false
                  }

                  val listener = object : SensorEventListener {
                      override fun onSensorChanged(event: SensorEvent?) {
                          if (event == null) return
                          if (event.sensor.type == Sensor.TYPE_ROTATION_VECTOR) {
                              val rotationMatrix = FloatArray(9)
                              SensorManager.getRotationMatrixFromVector(rotationMatrix, event.values)
                              val orientation = FloatArray(3)
                              SensorManager.getOrientation(rotationMatrix, orientation)
                              val azimuthInDegrees = (Math.toDegrees(orientation[0].toDouble()) + 360).toFloat() % 360f
                              deviceAzimuth = azimuthInDegrees
                          } else {
                              deviceAzimuth = event.values[0]
                          }
                      }
                      override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
                  }

                  if (rotationSensor != null) {
                      sensorManager.registerListener(listener, rotationSensor, SensorManager.SENSOR_DELAY_UI)
                  }

                  onDispose {
                      sensorManager.unregisterListener(listener)
                  }
              }

              val needleRotation = (qiblaAngle - deviceAzimuth + 360f) % 360f
              val primaryColor = MaterialTheme.colorScheme.primary
              val surfaceColor = MaterialTheme.colorScheme.surface

              Column(
                  modifier = Modifier.fillMaxSize().padding(16.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text("بوصلة اتجاه القبلة", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = primaryColor)
                  Spacer(Modifier.height(6.dp))
                  Text(
                      text = "زاوية القبلة من موقعك: ${qiblaAngle.toInt()}° من الشمال",
                      fontSize = 15.sp,
                      color = Color.LightGray
                  )
                  Spacer(Modifier.height(24.dp))

                  Box(modifier = Modifier.size(240.dp), contentAlignment = Alignment.Center) {
                      Canvas(modifier = Modifier.fillMaxSize()) {
                          drawCircle(color = surfaceColor)
                          drawCircle(color = primaryColor, style = Stroke(width = 6.dp.toPx()))

                          rotate(degrees = needleRotation) {
                              drawLine(
                                  color = primaryColor,
                                  start = center,
                                  end = Offset(center.x, 28.dp.toPx()),
                                  strokeWidth = 8.dp.toPx()
                              )
                              drawCircle(
                                  color = Color(0xFF4CAF50),
                                  radius = 12.dp.toPx(),
                                  center = Offset(center.x, 28.dp.toPx())
                              )
                          }
                          drawCircle(color = Color.White, radius = 8.dp.toPx(), center = center)
                      }
                  }

                  Spacer(Modifier.height(20.dp))
                  Text(
                      text = if (hasSensor) "وجّه الهاتف بشكل مسطح حتى يشير المؤشر الذهبي للأعلى نحو الكعبة المشرفة"
                      else "هذا الجهاز (أو التليفزيون) لا يحتوي على حساس بوصلة مغناطيسي، اعتمد على زاوية القبلة الموضحة أعلاه (${qiblaAngle.toInt()}°).",
                      fontSize = 14.sp,
                      color = Color.LightGray,
                      textAlign = TextAlign.Center
                  )
              }
          }

