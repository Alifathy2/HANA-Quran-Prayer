              ZikrItem("أذكار الصباح", "بِسْمِ اللهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلاَ فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.", 3),
              ZikrItem("أذكار المساء", "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لاَ إِلَـهَ إِلاَّ اللهُ وَحْدَهُ لاَ شَرِيكَ لَهُ.", 1),
              ZikrItem("أذكار المساء", "أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", 3),
              ZikrItem("أذكار المساء", "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ.", 1),
              ZikrItem("بعد الصلاة", "أَسْتَغْفِرُ اللهَ (ثَلاَثاً) اللَّهُمَّ أَنْتَ السَّلاَمُ، وَمِنْكَ السَّلاَمُ، تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالإِكْرَامِ.", 1),
              ZikrItem("بعد الصلاة", "سُبْحَانَ اللهِ (33) الْحَمْدُ لِلَّهِ (33) اللهُ أَكْبَرُ (33)", 33)
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  AdhanScheduler.scheduleAllPrayers(this)
                  setContent {
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme(
                              colorScheme = darkColorScheme(
                                  primary = Color(0xFFD4AF37),
                                  background = Color(0xFF0A1619),
                                  surface = Color(0xFF13272C),
                                  onPrimary = Color.Black,
                                  onBackground = Color.White,
                                  onSurface = Color.White
                              )
                          ) {
                              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                                  HonaAlQuranMain()
                              }
                          }
                      }
                  }
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun HonaAlQuranMain() {
              val context = LocalContext.current
              val configuration = LocalConfiguration.current
              val isWideScreen = configuration.screenWidthDp >= 640

              var selectedTab by remember { mutableIntStateOf(0) }
              var prayers by remember { mutableStateOf(emptyList<PrayerItem>()) }
              var nextPrayer by remember { mutableStateOf<PrayerItem?>(null) }
              var countdownText by remember { mutableStateOf("00:00:00") }
              var locationStatus by remember { mutableStateOf("القاهرة (اضغط لتحديث GPS)") }

              fun refreshPrayers() {
                  val (lat, lng) = PrayerCalculator.getSavedLocation(context)
                  prayers = PrayerCalculator.getTodayPrayers(lat, lng)
                  nextPrayer = PrayerCalculator.getNextPrayer(lat, lng)
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { perms ->
                  if (perms[Manifest.permission.ACCESS_FINE_LOCATION] == true ||
                      perms[Manifest.permission.ACCESS_COARSE_LOCATION] == true
                  ) {
                      LocationServices.getFusedLocationProviderClient(context).lastLocation.addOnSuccessListener { loc ->
                          if (loc != null) {
                              PrayerCalculator.saveLocation(context, loc.latitude, loc.longitude)
                              refreshPrayers()
                              locationStatus = "مُحدّث تلقائياً عبر GPS"
                              AdhanScheduler.scheduleAllPrayers(context)
                          }
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  refreshPrayers()
                  val perms = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  permissionLauncher.launch(perms.toTypedArray())
              }

              LaunchedEffect(nextPrayer) {
                  while (true) {
                      val np = nextPrayer
                      if (np != null) {
                          val diff = np.timeInMillis - System.currentTimeMillis()
                          if (diff <= 0) {
                              refreshPrayers()
                          } else {
                              val h = diff / (1000 * 60 * 60)
                              val m = (diff / (1000 * 60)) % 60
                              val s = (diff / 1000) % 60
                              countdownText = String.format(Locale.US, "%02d:%02d:%02d", h, m, s)
                          }
                      }
                      delay(1000)
                  }
              }

              if (isWideScreen) {
                  Row(modifier = Modifier.fillMaxSize().padding(16.dp), horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                      Card(
                          modifier = Modifier.width(230.dp).fillMaxHeight(),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          shape = RoundedCornerShape(18.dp)
                      ) {
                          Column(
                              modifier = Modifier.fillMaxSize().padding(14.dp),
                              verticalArrangement = Arrangement.SpaceBetween
                          ) {
                              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Text("هنا القرآن", fontSize = 26.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                                  Text(PrayerCalculator.getHijriDateString(), fontSize = 13.sp, color = Color.LightGray)
                                  HorizontalDivider(modifier = Modifier.padding(vertical = 6.dp), color = Color.Gray.copy(alpha = 0.3f))

                                  SideNavButton("مواقيت الصلاة", Icons.Default.AccessTime, selectedTab == 0) { selectedTab = 0 }
                                  SideNavButton("القرآن والتفسير", Icons.Default.MenuBook, selectedTab == 1) { selectedTab = 1 }
                                  SideNavButton("الأذكار والسبحة", Icons.Default.Favorite, selectedTab == 2) { selectedTab = 2 }
                                  SideNavButton("الإعدادات والتحديث", Icons.Default.Settings, selectedTab == 3) { selectedTab = 3 }
                              }
                              TvButton("إيقاف صوت الأذان", Icons.Default.NotificationsOff, Modifier.fillMaxWidth()) {
                                  context.startService(Intent(context, AdhanService::class.java).apply { action = "STOP_ADHAN" })
                              }
                          }
                      }

                      Box(modifier = Modifier.weight(1f).fillMaxHeight()) {
                          when (selectedTab) {
                              0 -> PrayerDashboard(prayers, nextPrayer, countdownText, locationStatus)
                              1 -> QuranScreen()
                              2 -> AzkarAndTasbeehScreen()
                              3 -> SettingsAndUpdateScreen()
                          }
                      }
                  }
              } else {
                  Scaffold(
                      topBar = {
                          Row(
                              modifier = Modifier.fillMaxWidth().background(MaterialTheme.colorScheme.surface).padding(horizontal = 16.dp, vertical = 10.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column {
                                  Text("هنا القرآن", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                                  Text(PrayerCalculator.getHijriDateString(), fontSize = 12.sp, color = Color.LightGray)
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  TvButton("تجربة الأذان", Icons.Default.VolumeUp) {
                                      val i = Intent(context, AdhanService::class.java).apply { putExtra("PRAYER_NAME", "التجربة") }
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(i) else context.startService(i)
                                  }
                                  IconButton(onClick = {
                                      context.startService(Intent(context, AdhanService::class.java).apply { action = "STOP_ADHAN" })
                                  }) {
                                      Icon(Icons.Default.StopCircle, contentDescription = "إيقاف", tint = Color(0xFFFF6B6B))
                                  }
                              }
                          }
                      },
                      bottomBar = {
                          NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {
                              NavigationBarItem(selected = selectedTab == 0, onClick = { selectedTab = 0 }, icon = { Icon(Icons.Default.AccessTime, null) }, label = { Text("الصلاة") })
                              NavigationBarItem(selected = selectedTab == 1, onClick = { selectedTab = 1 }, icon = { Icon(Icons.Default.MenuBook, null) }, label = { Text("القرآن") })
                              NavigationBarItem(selected = selectedTab == 2, onClick = { selectedTab = 2 }, icon = { Icon(Icons.Default.Favorite, null) }, label = { Text("الأذكار") })
                              NavigationBarItem(selected = selectedTab == 3, onClick = { selectedTab = 3 }, icon = { Icon(Icons.Default.SystemUpdate, null) }, label = { Text("التحديث") })
                          }
                      }
                  ) { innerPadding ->
                      Box(modifier = Modifier.fillMaxSize().padding(innerPadding).padding(12.dp)) {
                          when (selectedTab) {
                              0 -> PrayerDashboard(prayers, nextPrayer, countdownText, locationStatus)
                              1 -> QuranScreen()
                              2 -> AzkarAndTasbeehScreen()
                              3 -> SettingsAndUpdateScreen()
                          }
                      }
                  }
              }
          }

          @Composable
          fun SideNavButton(title: String, icon: ImageVector, isSelected: Boolean, onClick: () -> Unit) {
              var focused by remember { mutableStateOf(false) }
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(if (isSelected) MaterialTheme.colorScheme.primary.copy(alpha = 0.2f) else Color.Transparent, RoundedCornerShape(12.dp))
                      .onFocusChanged { focused = it.isFocused }
                      .focusable()
                      .border(if (focused) 2.dp else 0.dp, MaterialTheme.colorScheme.primary, RoundedCornerShape(12.dp))
                      .clickable { onClick() }
                      .padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(icon, null, tint = if (isSelected) MaterialTheme.colorScheme.primary else Color.White)
                  Spacer(Modifier.width(10.dp))
                  Text(title, fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal, color = if (isSelected) MaterialTheme.colorScheme.primary else Color.White)
              }
          }

          @Composable
          fun TvButton(text: String, icon: ImageVector, modifier: Modifier = Modifier, onClick: () -> Unit) {
              var focused by remember { mutableStateOf(false) }
              Button(
                  onClick = onClick,
                  modifier = modifier
                      .onFocusChanged { focused = it.isFocused }
                      .focusable()
                      .border(if (focused) 2.dp else 0.dp, Color.White, RoundedCornerShape(12.dp)),
                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1F3A40), contentColor = Color.White),
                  shape = RoundedCornerShape(12.dp)
              ) {
                  Icon(icon, null, modifier = Modifier.size(18.dp), tint = MaterialTheme.colorScheme.primary)
                  Spacer(Modifier.width(6.dp))
                  Text(text, fontSize = 13.sp)
              }
          }

          @Composable
          fun PrayerDashboard(prayers: List<PrayerItem>, nextPrayer: PrayerItem?, countdown: String, locationStatus: String) {
              val todayGregorian = remember { SimpleDateFormat("EEEE، d MMMM yyyy", Locale("ar")).format(Date()) }
              LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxSize()) {
                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF1B3B42)),
                          shape = RoundedCornerShape(18.dp)
                      ) {
                          Column(modifier = Modifier.padding(18.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("الصلاة القادمة: ${nextPrayer?.name ?: ""}", fontSize = 18.sp, color = Color.LightGray)
                              Text(countdown, fontSize = 38.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Spacer(Modifier.height(6.dp))
                              Text("$todayGregorian  |  ${PrayerCalculator.getHijriDateString()}", fontSize = 13.sp, color = Color.White)
                              Text(locationStatus, fontSize = 12.sp, color = Color(0xFFA8DADC))
                          }
                      }
                  }

                  items(prayers) { prayer ->
                      val isNext = prayer.name == nextPrayer?.name
                      var focused by remember { mutableStateOf(false) }
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(if (isNext) Color(0xFF264E56) else MaterialTheme.colorScheme.surface, RoundedCornerShape(14.dp))
                              .onFocusChanged { focused = it.isFocused }
                              .focusable()
                              .border(if (focused || isNext) 2.dp else 0.dp, MaterialTheme.colorScheme.primary, RoundedCornerShape(14.dp))
                              .padding(horizontal = 20.dp, vertical = 16.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Icon(
                                  if (prayer.name == "الشروق") Icons.Default.WbSunny else Icons.Default.AccessTime,
                                  contentDescription = null,
                                  tint = if (isNext) MaterialTheme.colorScheme.primary else Color.LightGray
                              )
                              Spacer(Modifier.width(12.dp))
                              Text(prayer.name, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                          }
                          Text(prayer.formattedTime, fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                      }
                  }
              }
          }

          @Composable
          fun QuranScreen() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
              val scope = rememberCoroutineScope()

              var surahs by remember { mutableStateOf(emptyList<SurahInfo>()) }
              var searchQuery by remember { mutableStateOf("") }
              var selectedSurah by remember { mutableStateOf<SurahInfo?>(null) }
              var ayahs by remember { mutableStateOf(emptyList<AyahWithTafsir>()) }
              var isLoading by remember { mutableStateOf(true) }
              var showTafsir by remember { mutableStateOf(true) }
              var selectedReciter by remember { mutableStateOf(QURAN_RECITERS.first()) }
              var isPlayingAudio by remember { mutableStateOf(false) }
              val audioPlayer = remember { MediaPlayer() }
              var savedBookmarkSurah by remember { mutableIntStateOf(prefs.getInt("bookmark_surah", 1)) }

              DisposableEffect(Unit) {
                  onDispose {
                      try { audioPlayer.stop(); audioPlayer.release() } catch (_: Exception) {}
                  }
              }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      try {
                          val cacheFile = File(context.filesDir, "surahs_cache.json")
                          val json = if (cacheFile.exists()) cacheFile.readText() else URL("https://api.alquran.cloud/v1/surah").readText().also { cacheFile.writeText(it) }
                          val data = JSONObject(json).getJSONArray("data")
                          val list = mutableListOf<SurahInfo>()
                          for (i in 0 until data.length()) {
                              val item = data.getJSONObject(i)
                              list.add(SurahInfo(item.getInt("number"), item.getString("name"), item.getInt("numberOfAyahs")))
                          }
                          surahs = list
                      } catch (_: Exception) {} finally { isLoading = false }
                  }
              }

              fun openSurah(surah: SurahInfo) {
                  selectedSurah = surah
                  isLoading = true
                  prefs.edit().putInt("bookmark_surah", surah.number).apply()
                  savedBookmarkSurah = surah.number
                  scope.launch(Dispatchers.IO) {
                      try {
                          val cacheFile = File(context.filesDir, "surah_${surah.number}.json")
                          val res = if (cacheFile.exists()) cacheFile.readText() else URL("https://api.alquran.cloud/v1/surah/${surah.number}/editions/quran-uthmani,ar.muyassar").readText().also { cacheFile.writeText(it) }
                          val editions = JSONObject(res).getJSONArray("data")
                          val quranAyahs = editions.getJSONObject(0).getJSONArray("ayahs")
                          val tafsirAyahs = editions.getJSONObject(1).getJSONArray("ayahs")
                          val combined = mutableListOf<AyahWithTafsir>()
                          for (i in 0 until quranAyahs.length()) {
                              combined.add(
                                  AyahWithTafsir(
                                      quranAyahs.getJSONObject(i).getInt("numberInSurah"),
                                      quranAyahs.getJSONObject(i).getString("text"),
                                      tafsirAyahs.getJSONObject(i).getString("text")
                                  )
                              )
                          }
                          ayahs = combined
                      } catch (_: Exception) {} finally { isLoading = false }
                  }
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  if (selectedSurah == null) {
                      OutlinedTextField(
                          value = searchQuery,
                          onValueChange = { searchQuery = it },
                          placeholder = { Text("ابحث عن اسم السورة...") },
                          leadingIcon = { Icon(Icons.Default.Search, null) },
                          modifier = Modifier.fillMaxWidth().padding(bottom = 10.dp),
                          singleLine = true
                      )

                      val bookmarked = surahs.firstOrNull { it.number == savedBookmarkSurah }
                      if (bookmarked != null) {
                          TvButton("استكمال القراءة: ${bookmarked.name}", Icons.Default.Bookmark, Modifier.fillMaxWidth().padding(bottom = 10.dp)) {
                              openSurah(bookmarked)
                          }
                      }

                      if (isLoading) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }
                      } else {
                          val filtered = surahs.filter { it.name.contains(searchQuery) || it.number.toString() == searchQuery }
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              items(filtered) { surah ->
                                  var focused by remember { mutableStateOf(false) }
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .background(MaterialTheme.colorScheme.surface, RoundedCornerShape(12.dp))
                                          .onFocusChanged { focused = it.isFocused }
                                          .focusable()
                                          .border(if (focused) 2.dp else 0.dp, MaterialTheme.colorScheme.primary, RoundedCornerShape(12.dp))
                                          .clickable { openSurah(surah) }
                                          .padding(16.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Text("${surah.number}. ${surah.name}", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                                      Text("${surah.ayahsCount} آية", color = MaterialTheme.colorScheme.primary)
                                  }
                              }
                          }
                      }
                  } else {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(bottom = 10.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          TvButton("الفهرس", Icons.Default.ArrowBack) {
                              try { audioPlayer.stop() } catch (_: Exception) {}
                              isPlayingAudio = false
                              selectedSurah = null
                          }
                          Text(selectedSurah!!.name, fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              TvButton(if (isPlayingAudio) "إيقاف التلاوة" else "استماع للسورة", if (isPlayingAudio) Icons.Default.Stop else Icons.Default.PlayArrow) {
                                  if (isPlayingAudio) {
                                      try { audioPlayer.stop() } catch (_: Exception) {}
                                      isPlayingAudio = false
                                  } else {
                                      val formattedNum = String.format(Locale.US, "%03d", selectedSurah!!.number)
                                      val audioUrl = "${selectedReciter.serverUrl}/$formattedNum.mp3"
                                      Toast.makeText(context, "جاري تشغيل تلاوة ${selectedReciter.name}...", Toast.LENGTH_SHORT).show()
                                      Thread {
                                          try {
                                              audioPlayer.reset()
                                              audioPlayer.setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                                              audioPlayer.setDataSource(audioUrl)
                                              audioPlayer.prepare()
                                              audioPlayer.start()
                                              isPlayingAudio = true
                                              audioPlayer.setOnCompletionListener { isPlayingAudio = false }
                                          } catch (_: Exception) {}
                                      }.start()
                                  }
                              }
                              TvButton(if (showTafsir) "إخفاء التفسير" else "التفسير", Icons.Default.Description) { showTafsir = !showTafsir }
                          }
                      }

                      if (isLoading) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }
                      } else {
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              items(ayahs) { ayah ->
                                  var focused by remember { mutableStateOf(false) }
                                  Column(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .background(MaterialTheme.colorScheme.surface, RoundedCornerShape(14.dp))
                                          .onFocusChanged { focused = it.isFocused }
                                          .focusable()
                                          .border(if (focused) 2.dp else 0.dp, MaterialTheme.colorScheme.primary, RoundedCornerShape(14.dp))
                                          .padding(16.dp)
                                  ) {
                                      Text(
                                          text = "${ayah.text} ﴿${ayah.numberInSurah}﴾",
                                          fontSize = 23.sp,
                                          lineHeight = 38.sp,
                                          textAlign = TextAlign.Right,
                                          modifier = Modifier.fillMaxWidth()
                                      )
                                      if (showTafsir) {
                                          HorizontalDivider(modifier = Modifier.padding(vertical = 8.dp), color = Color.Gray.copy(alpha = 0.3f))
                                          Text("التفسير الميسر: ${ayah.tafsir}", fontSize = 15.sp, color = Color(0xFFE0E0E0), lineHeight = 25.sp)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun AzkarAndTasbeehScreen() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
              var tasbeehCount by remember { mutableIntStateOf(prefs.getInt("tasbeeh_count", 0)) }
              var selectedCategory by remember { mutableStateOf("أذكار الصباح") }
              val categories = listOf("أذكار الصباح", "أذكار المساء", "بعد الصلاة", "السبحة الإلكترونية")

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      categories.forEach { cat ->
                          TvButton(cat, Icons.Default.Star, Modifier.weight(1f)) { selectedCategory = cat }
                      }
                  }

                  if (selectedCategory == "السبحة الإلكترونية") {
                      Column(
                          modifier = Modifier.fillMaxSize(),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.Center
                      ) {
                          Text("سبحان الله وبحمده • سبحان الله العظيم", fontSize = 20.sp, color = MaterialTheme.colorScheme.primary)
                          Spacer(Modifier.height(24.dp))
                          Box(
                              modifier = Modifier
                                  .size(190.dp)
                                  .background(Color(0xFF1F3A40), CircleShape)
                                  .border(4.dp, MaterialTheme.colorScheme.primary, CircleShape)
                                  .clickable {
                                      tasbeehCount++
                                      prefs.edit().putInt("tasbeeh_count", tasbeehCount).apply()
                                  },
                              contentAlignment = Alignment.Center
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("$tasbeehCount", fontSize = 46.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                                  Text("اضغط للتسبيح", fontSize = 14.sp, color = Color.LightGray)
                              }
                          }
                          Spacer(Modifier.height(20.dp))
                          TvButton("تصفير العداد", Icons.Default.Refresh) {
                              tasbeehCount = 0
                              prefs.edit().putInt("tasbeeh_count", 0).apply()
                          }
                      }
                  } else {
                      val filtered = AZKAR_LIST.filter { it.category == selectedCategory }
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          items(filtered) { zikr ->
                              var count by remember(zikr) { mutableIntStateOf(zikr.targetCount) }
                              Card(
                                  modifier = Modifier.fillMaxWidth().clickable { if (count > 0) count-- },
                                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                                  shape = RoundedCornerShape(14.dp)
                              ) {
                                  Column(modifier = Modifier.padding(16.dp)) {
                                      Text(zikr.text, fontSize = 19.sp, lineHeight = 32.sp)
                                      Spacer(Modifier.height(8.dp))
                                      Text(
                                          text = if (count > 0) "المتبقي: $count (اضغط للعد)" else "تمت القراءة ✓",
                                          color = if (count > 0) MaterialTheme.colorScheme.primary else Color(0xFF4CAF50),
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SettingsAndUpdateScreen() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
              val scope = rememberCoroutineScope()
              var updateStatus by remember { mutableStateOf("الإصدار الحالي: v2.0 (متصل بمستودع GitHub الخاص بك)") }
              var selectedAdhanUrl by remember { mutableStateOf(prefs.getString("adhan_url", ADHAN_VOICES.first().second)!!) }

              LazyColumn(verticalArrangement = Arrangement.spacedBy(14.dp), modifier = Modifier.fillMaxSize()) {
                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          shape = RoundedCornerShape(16.dp)
                      ) {
                          Column(modifier = Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("التحديث الهوائي المباشر (Online Update)", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text(updateStatus, fontSize = 14.sp, color = Color.LightGray)
                              TvButton("تحديث التطبيق أونلاين الآن", Icons.Default.SystemUpdate, Modifier.fillMaxWidth()) {
                                  updateStatus = "جاري البحث عن أحدث نسخة وتحميلها من GitHub..."
                                  scope.launch(Dispatchers.IO) {
                                      try {
                                          val apkUrl = "https://github.com/Alifathy2/HANA-Quran-Prayer/releases/latest/download/app-debug.apk"
                                          val dm = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                                          val req = DownloadManager.Request(Uri.parse(apkUrl))
                                              .setTitle("تحديث تطبيق هنا القرآن")
                                              .setDescription("جاري تحميل أحدث نسخة...")
                                              .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                                              .setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "Hona-AlQuran-Update.apk")
                                              .setAllowedOverMetered(true)
                                          dm.enqueue(req)
                                          withContext(Dispatchers.Main) {
                                              updateStatus = "بدأ التحميل في شريط الإشعارات! اضغط على الإشعار عند انتهائه للتثبيت."
                                              Toast.makeText(context, "جاري تحميل التحديث في الإشعارات...", Toast.LENGTH_LONG).show()
                                          }
                                      } catch (e: Exception) {
                                          withContext(Dispatchers.Main) {
                                              updateStatus = "تعذر التحميل التلقائي، سيتم فتح رابط التحديث المباشر..."
                                              context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://github.com/Alifathy2/HANA-Quran-Prayer/releases/latest")))
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }

                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          shape = RoundedCornerShape(16.dp)
                      ) {
                          Column(modifier = Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("اختيار صوت المؤذن", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              ADHAN_VOICES.forEach { (name, url) ->
                                  Row(
                                      modifier = Modifier.fillMaxWidth().clickable {
                                          selectedAdhanUrl = url
                                          prefs.edit().putString("adhan_url", url).apply()
                                          File(context.filesDir, "cached_adhan.mp3").delete()
                                          Toast.makeText(context, "تم اختيار: $name", Toast.LENGTH_SHORT).show()
                                      }.padding(vertical = 8.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      RadioButton(selected = selectedAdhanUrl == url, onClick = null)
                                      Spacer(Modifier.width(8.dp))
                                      Text(name, fontSize = 16.sp)
                                  }
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  TvButton("تشغيل وتجربة الأذان", Icons.Default.VolumeUp, Modifier.weight(1f)) {
                                      val i = Intent(context, AdhanService::class.java).apply { putExtra("PRAYER_NAME", "التجربة") }
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(i) else context.startService(i)
                                  }
                                  TvButton("إيقاف الصوت", Icons.Default.Stop, Modifier.weight(1f)) {
                                      context.startService(Intent(context, AdhanService::class.java).apply { action = "STOP_ADHAN" })
                                  }
                              }
                          }
                      }
                  }

                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          shape = RoundedCornerShape(16.dp)
                      ) {
                          Column(modifier = Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("حماية الأذان في الخلفية", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text("اضغط على الزرار بالأسفل وامنح التطبيق استثناء البطارية ليعمل الأذان مدى الحياة دون إغلاق:", fontSize = 14.sp, color = Color.LightGray)
                              TvButton("تفعيل العمل الدائم في الخلفية", Icons.Default.BatteryChargingFull, Modifier.fillMaxWidth()) {
                                  val pm = context.getSystemService(PowerManager::class.java)
                                  if (!pm.isIgnoringBatteryOptimizations(context.packageName)) {
                                      context.startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                          data = Uri.parse("package:${context.packageName}")
                                      })
                                  } else {
                                      Toast.makeText(context, "مُفعّل بالفعل! التطبيق محمي في الخلفية.", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace

      - name: Upload APK to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hona-AlQuran-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish Direct OTA Release on GitHub
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "أحدث إصدار من تطبيق هنا القرآن (Direct APK)"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
