name: Build Signed Release APK (HANA EL Quran v5.1)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean Old Files & Generate v5.1 Project
        run: |
          rm -rf app/src/main/java
          rm -rf app/build

          # 1. إعداد gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 2. إعداد settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HonaAlQuran"
          include(":app")
          EOF

          # 3. إعداد build.gradle.kts الرئيسي
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 4. إنشاء هيكل المجلدات
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/java/com/hona/alquran/service

          # 5. جلب ملف صوت أذان المحور (azan_012.mp3) أو تحميله تلقائياً
          find . -maxdepth 3 -name "azan_012.mp3" -exec cp {} app/src/main/res/raw/adhan.mp3 \; || true
          find . -maxdepth 3 -name "adhan.mp3" ! -path "./app/src/main/res/raw/adhan.mp3" -exec cp {} app/src/main/res/raw/adhan.mp3 \; || true

          if [ ! -s app/src/main/res/raw/adhan.mp3 ]; then
            curl -L -A "Mozilla/5.0" -s "https://ia801900.us.archive.org/28/items/90-azan/012.mp3" -o app/src/main/res/raw/adhan.mp3 || true
          fi
          if [ -f app/src/main/res/raw/adhan.mp3 ]; then
            FILE_SIZE=$(stat -c%s "app/src/main/res/raw/adhan.mp3" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -lt 20000 ]; then
              curl -L -A "Mozilla/5.0" -s "https://www.islamcan.com/audio/adhan/azan1.mp3" -o app/src/main/res/raw/adhan.mp3 || true
            fi
          fi
          if [ -f app/src/main/res/raw/adhan.mp3 ]; then
            FILE_SIZE=$(stat -c%s "app/src/main/res/raw/adhan.mp3" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -lt 20000 ]; then
              rm -f app/src/main/res/raw/adhan.mp3
            fi
          fi

          # 6. إعداد FileProvider للتحديث الداخلي المباشر
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <files-path name="updates" path="." />
              <cache-path name="cache_updates" path="." />
              <external-files-path name="ext_updates" path="." />
          </paths>
          EOF

          # 7. أيقونة التطبيق الاحترافية
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#071E22" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0F353C" android:pathData="M54,54m-45,0a45,45 0,1 1,90 0a45,45 0,1 1,-90 0"/>
              <path android:strokeColor="#D4AF37" android:strokeWidth="2" android:fillColor="#00000000" android:pathData="M54,54m-41,0a41,41 0,1 1,82 0a41,41 0,1 1,-82 0"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#E5C158" android:pathData="M54,22A22,22 0,1 0,76 44A18,18 0,1 1,54 22Z"/>
              <path android:fillColor="#FFD700" android:pathData="M65,28L66.8,32.2L71.2,32.5L67.8,35.4L68.9,39.8L65,37.4L61.1,39.8L62.2,35.4L58.8,32.5L63.2,32.2Z"/>
              <path android:fillColor="#E5C158" android:pathData="M34,60 L52,64 L52,78 L34,74 Z"/>
              <path android:fillColor="#C59B27" android:pathData="M74,60 L56,64 L56,78 L74,74 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 8. قواعد ProGuard
          cat << 'EOF' > app/proguard-rules.pro
          -keep class com.hona.alquran.** { *; }
          -keep class com.batoulapps.adhan.** { *; }
          -dontwarn **
          EOF

          # 9. إعداد app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hona.alquran"
              compileSdk = 34

              defaultConfig {
                  applicationId = "alhana.quran"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 8
                  versionName = "5.1"
                  resourceConfigurations += setOf("ar", "en")
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("../alhana.jks")
                      storePassword = System.getenv("KEYSTORE_PASS") ?: "AlHana2026Secure"
                      keyAlias = "alhana_key"
                      keyPassword = System.getenv("KEYSTORE_PASS") ?: "AlHana2026Secure"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("com.batoulapps.adhan:adhan:1.2.1")
              implementation("com.google.android.gms:play-services-location:21.3.0")
          }
          EOF

          # 10. إعداد themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.HonaAlQuran" parent="android:Theme.Material.NoActionBar" />
          </resources>
          EOF

          # 11. إعداد AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="هَنَا القُرآن - HANA EL Quran"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.HonaAlQuran"
                  tools:targetApi="34">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".service.AdhanReceiver" android:enabled="true" android:exported="false" />
                  <receiver android:name=".service.BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".service.AdhanService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />

                  <service
                      android:name=".service.MediaPlaybackService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          # 12. كود PrayerCalculator.kt
          cat << 'EOF' > app/src/main/java/com/hona/alquran/PrayerCalculator.kt
          package com.hona.alquran

          import android.content.Context
          import android.icu.util.IslamicCalendar
          import android.icu.util.ULocale
          import com.batoulapps.adhan.CalculationMethod
          import com.batoulapps.adhan.Coordinates
          import com.batoulapps.adhan.Madhab
          import com.batoulapps.adhan.PrayerTimes
          import com.batoulapps.adhan.Qibla
          import com.batoulapps.adhan.data.DateComponents
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone

          data class PrayerItem(val name: String, val timeInMillis: Long, val formattedTime: String)

          object PrayerCalculator {
              fun saveLocation(context: Context, lat: Double, lng: Double) {
                  context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE).edit()
                      .putFloat("lat", lat.toFloat()).putFloat("lng", lng.toFloat()).apply()
              }

              fun getSavedLocation(context: Context): Pair<Double, Double> {
                  val p = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                  return Pair(p.getFloat("lat", 30.0444f).toDouble(), p.getFloat("lng", 31.2357f).toDouble())
              }

              fun getQiblaAngle(context: Context): Float {
                  val (lat, lng) = getSavedLocation(context)
                  return Qibla(Coordinates(lat, lng)).direction.toFloat()
              }

              fun getTodayPrayers(context: Context, lat: Double, lng: Double, date: Date = Date()): List<PrayerItem> {
                  val p = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                  val mIdx = p.getInt("calc_method", 0)
                  val hanafi = p.getBoolean("madhab_hanafi", false)
                  val method = when (mIdx) {
                      1 -> CalculationMethod.UMM_AL_QURA
                      2 -> CalculationMethod.MUSLIM_WORLD_LEAGUE
                      else -> CalculationMethod.EGYPTIAN
                  }
                  val params = method.parameters.apply {
                      madhab = if (hanafi) Madhab.HANAFI else Madhab.SHAFI
                  }
                  val pt = PrayerTimes(Coordinates(lat, lng), DateComponents.from(date), params)
                  val sdf = SimpleDateFormat("hh:mm a", Locale("ar")).apply { timeZone = TimeZone.getDefault() }
                  return listOf(
                      PrayerItem("الفجر", pt.fajr.time, sdf.format(pt.fajr)),
                      PrayerItem("الشروق", pt.sunrise.time, sdf.format(pt.sunrise)),
                      PrayerItem("الظهر", pt.dhuhr.time, sdf.format(pt.dhuhr)),
                      PrayerItem("العصر", pt.asr.time, sdf.format(pt.asr)),
                      PrayerItem("المغرب", pt.maghrib.time, sdf.format(pt.maghrib)),
                      PrayerItem("العشاء", pt.isha.time, sdf.format(pt.isha))
                  )
              }

              fun getNextPrayer(context: Context, lat: Double, lng: Double): PrayerItem {
                  val now = System.currentTimeMillis()
                  val today = getTodayPrayers(context, lat, lng).filter { it.name != "الشروق" }
                  today.firstOrNull { it.timeInMillis > now }?.let { return it }
                  val cal = Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR, 1) }
                  return getTodayPrayers(context, lat, lng, cal.time).first()
              }

              fun getHijriDateString(): String {
                  return try {
                      val cal = IslamicCalendar(ULocale("ar@calendar=islamic-umalqura"))
                      val months = listOf("محرم", "صفر", "ربيع الأول", "ربيع الآخر", "جمادى الأولى", "جمادى الآخرة", "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة")
                      "${cal.get(IslamicCalendar.DAY_OF_MONTH)} ${months.getOrElse(cal.get(IslamicCalendar.MONTH)) { "" }} ${cal.get(IslamicCalendar.YEAR)} هـ"
                  } catch (_: Exception) { "" }
              }
          }
          EOF

          # 13. خدمات الأذان
          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/AdhanScheduler.kt
          package com.hona.alquran.service

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import com.hona.alquran.PrayerCalculator
          import java.util.Calendar

          object AdhanScheduler {
              fun scheduleAllPrayers(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val (lat, lng) = PrayerCalculator.getSavedLocation(context)
                  val now = System.currentTimeMillis()
                  val prayers = PrayerCalculator.getTodayPrayers(context, lat, lng).filter { it.name != "الشروق" } +
                                PrayerCalculator.getTodayPrayers(context, lat, lng, Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR, 1) }.time).filter { it.name != "الشروق" }
                  prayers.filter { it.timeInMillis > now }.forEachIndexed { i, p ->
                      val pi = PendingIntent.getBroadcast(context, 100 + i, Intent(context, AdhanReceiver::class.java).apply { putExtra("PRAYER_NAME", p.name) }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !am.canScheduleExactAlarms()) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, p.timeInMillis, pi)
                          } else {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, p.timeInMillis, pi)
                          }
                      } catch (_: Exception) { am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, p.timeInMillis, pi) }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/AdhanReceiver.kt
          package com.hona.alquran.service

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class AdhanReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val name = intent.getStringExtra("PRAYER_NAME") ?: "الصلاة"
                  val si = Intent(context, AdhanService::class.java).apply { putExtra("PRAYER_NAME", name) }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(si) else context.startService(si)
                  AdhanScheduler.scheduleAllPrayers(context)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/AdhanService.kt
          package com.hona.alquran.service

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import com.hona.alquran.MainActivity
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          class AdhanService : Service() {
              private var mp: MediaPlayer? = null
              private var wl: PowerManager.WakeLock? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP_ADHAN") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  wl = (getSystemService(Context.POWER_SERVICE) as PowerManager).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Hana::Wl").apply { acquire(300000L) }
                  val name = intent?.getStringExtra("PRAYER_NAME") ?: "الصلاة"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel("ch", "تنبيهات الأذان", NotificationManager.IMPORTANCE_HIGH))
                  }
                  val stopPi = PendingIntent.getService(this, 0, Intent(this, AdhanService::class.java).apply { action = "STOP_ADHAN" }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val openPi = PendingIntent.getActivity(this, 1, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val notif = NotificationCompat.Builder(this, "ch")
                      .setContentTitle("هَنَا القُرآن - حان الآن موعد أذان $name")
                      .setContentText("حي على الصلاة.. حي على الفلاح")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentIntent(openPi)
                      .addAction(android.R.drawable.ic_media_pause, "إيقاف الأذان", stopPi)
                      .setOngoing(true)
                      .build()
                  startForeground(1001, notif)
                  playAdhan()
                  return START_NOT_STICKY
              }

              private fun playAdhan() {
                  Thread {
                      try {
                          mp?.release()
                          val prefs = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                          val selectedUrl = prefs.getString("adhan_url", "RAW_BUILTIN") ?: "RAW_BUILTIN"
                          val attrs = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()

                          val resId = resources.getIdentifier("adhan", "raw", packageName)

                          if (selectedUrl == "RAW_BUILTIN" && resId != 0) {
                              val afd = resources.openRawResourceFd(resId)
                              mp = MediaPlayer().apply {
                                  setAudioAttributes(attrs)
                                  setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                                  afd.close()
                                  prepare()
                                  setOnCompletionListener { stopSelf() }
                                  start()
                              }
                              return@Thread
                          }

                          val cached = File(filesDir, "custom_adhan.mp3")
                          if (!cached.exists() || cached.length() < 20000) {
                              try {
                                  val conn = URL(selectedUrl).openConnection() as HttpURLConnection
                                  conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                                  conn.connectTimeout = 10000
                                  conn.inputStream.use { i -> cached.outputStream().use { o -> i.copyTo(o) } }
                              } catch (_: Exception) {}
                          }

                          if (cached.exists() && cached.length() > 20000) {
                              mp = MediaPlayer().apply {
                                  setAudioAttributes(attrs)
                                  setDataSource(cached.absolutePath)
                                  prepare()
                                  setOnCompletionListener { stopSelf() }
                                  start()
                              }
                          } else if (resId != 0) {
                              val afd = resources.openRawResourceFd(resId)
                              mp = MediaPlayer().apply {
                                  setAudioAttributes(attrs)
                                  setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                                  afd.close()
                                  prepare()
                                  setOnCompletionListener { stopSelf() }
                                  start()
                              }
                          } else {
                              val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                              mp = MediaPlayer().apply {
                                  setAudioAttributes(attrs)
                                  setDataSource(applicationContext, uri)
                                  prepare()
                                  setOnCompletionListener { stopSelf() }
                                  start()
                              }
                          }
                      } catch (_: Exception) {
                          stopSelf()
                      }
                  }.start()
              }

              override fun onDestroy() {
                  try { mp?.stop(); mp?.release() } catch (_: Exception) {}
                  mp = null
                  if (wl?.isHeld == true) wl?.release()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 14. خدمة الوسائط للقرآن والراديو في الخلفية (مع الاستيراد الصحيح لـ mutableStateOf)
          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/MediaPlaybackService.kt
          package com.hona.alquran.service

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.compose.runtime.mutableStateOf
          import androidx.core.app.NotificationCompat
          import com.hona.alquran.MainActivity

          class MediaPlaybackService : Service() {
              companion object {
                  var currentTitle = mutableStateOf<String?>(null)
                  var currentUrl = mutableStateOf<String?>(null)
                  var isPlaying = mutableStateOf(false)
                  var isBuffering = mutableStateOf(false)
              }

              private var mp: MediaPlayer? = null
              private var wl: PowerManager.WakeLock? = null
              private val channelId = "hana_media_playback"
              private var titleText: String = "تلاوة القرآن الكريم"
              private var subtitleText: String = "هَنَا القُرآن - HANA EL Quran"

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      "ACTION_PLAY" -> {
                          val url = intent.getStringExtra("URL") ?: return START_NOT_STICKY
                          titleText = intent.getStringExtra("TITLE") ?: "تلاوة القرآن الكريم"
                          subtitleText = intent.getStringExtra("SUBTITLE") ?: "هَنَا القُرآن - HANA EL Quran"
                          startPlayback(url)
                      }
                      "ACTION_TOGGLE" -> {
                          togglePlayPause()
                      }
                      "ACTION_STOP" -> {
                          stopPlayback()
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun startPlayback(url: String) {
                  if (wl == null) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Hana::MediaWakeLock").apply { acquire(3 * 60 * 60 * 1000L) }
                  }
                  currentTitle.value = titleText
                  currentUrl.value = url
                  isBuffering.value = true
                  isPlaying.value = false
                  updateNotification("جاري التحميل والتشغيل...")

                  Thread {
                      try {
                          mp?.release()
                          mp = MediaPlayer().apply {
                              setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_MEDIA)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                      .build()
                              )
                              setDataSource(url)
                              setOnPreparedListener {
                                  isBuffering.value = false
                                  isPlaying.value = true
                                  it.start()
                                  updateNotification(subtitleText)
                              }
                              setOnCompletionListener {
                                  stopPlayback()
                              }
                              setOnErrorListener { _, _, _ ->
                                  stopPlayback()
                                  true
                              }
                              prepareAsync()
                          }
                      } catch (_: Exception) {
                          stopPlayback()
                      }
                  }.start()
              }

              private fun togglePlayPause() {
                  try {
                      val player = mp ?: return
                      if (player.isPlaying) {
                          player.pause()
                          isPlaying.value = false
                          updateNotification("متوقف مؤقتاً - $subtitleText")
                      } else {
                          player.start()
                          isPlaying.value = true
                          updateNotification(subtitleText)
                      }
                  } catch (_: Exception) {}
              }

              private fun stopPlayback() {
                  isPlaying.value = false
                  isBuffering.value = false
                  currentTitle.value = null
                  currentUrl.value = null
                  try {
                      mp?.stop()
                      mp?.release()
                  } catch (_: Exception) {}
                  mp = null
                  if (wl?.isHeld == true) wl?.release()
                  wl = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun updateNotification(statusSubText: String) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(channelId, "مشغل القرآن والراديو", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }

                  val openPi = PendingIntent.getActivity(
                      this, 10, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val togglePi = PendingIntent.getService(
                      this, 11, Intent(this, MediaPlaybackService::class.java).apply { action = "ACTION_TOGGLE" },
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val stopPi = PendingIntent.getService(
                      this, 12, Intent(this, MediaPlaybackService::class.java).apply { action = "ACTION_STOP" },
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val playPauseIcon = if (isPlaying.value) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play
                  val playPauseLabel = if (isPlaying.value) "إيقاف مؤقت" else "تشغيل"

                  val notif = NotificationCompat.Builder(this, channelId)
                      .setContentTitle(titleText)
                      .setContentText(statusSubText)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentIntent(openPi)
                      .addAction(playPauseIcon, playPauseLabel, togglePi)
                      .addAction(android.R.drawable.ic_delete, "إيقاف", stopPi)
                      .setOngoing(isPlaying.value || isBuffering.value)
                      .build()

                  startForeground(2002, notif)
              }

              override fun onDestroy() {
                  stopPlayback()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
