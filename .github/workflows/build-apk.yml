                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  TvButton("تشغيل وتجربة الأذان", Icons.Default.VolumeUp, Modifier.weight(1f)) {
                                      val i = Intent(context, AdhanService::class.java).apply { putExtra("PRAYER_NAME", "التجربة") }
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(i) else context.startService(i)
                                  }
                                  TvButton("إيقاف الصوت", Icons.Default.Stop, Modifier.weight(1f)) {
                                      context.startService(Intent(context, AdhanService::class.java).apply { action = "STOP_ADHAN" })
                                  }
                              }
                          }
                      }
                  }

                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          shape = RoundedCornerShape(16.dp)
                      ) {
                          Column(modifier = Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              Text("إعدادات الشكل والألوان وحجم الخط", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text("اختر لون ثيم التطبيق:", fontSize = 14.sp, color = Color.LightGray)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                                  TvButton("الزمردي الملكي", Icons.Default.Palette, Modifier.weight(1f)) { onThemeChange(0) }
                                  TvButton("الكحلي الليلي", Icons.Default.DarkMode, Modifier.weight(1f)) { onThemeChange(1) }
                                  TvButton("البني الأندلسي", Icons.Default.ColorLens, Modifier.weight(1f)) { onThemeChange(2) }
                              }

                              Spacer(Modifier.height(4.dp))
                              Text("حجم خط القرآن والأذكار:", fontSize = 14.sp, color = Color.LightGray)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                                  TvButton("خط عادي", Icons.Default.FormatSize, Modifier.weight(1f)) { onFontScaleChange(1.0f) }
                                  TvButton("خط كبير", Icons.Default.FormatSize, Modifier.weight(1f)) { onFontScaleChange(1.2f) }
                                  TvButton("خط ضخم", Icons.Default.FormatSize, Modifier.weight(1f)) { onFontScaleChange(1.4f) }
                              }
                          }
                      }
                  }

                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          shape = RoundedCornerShape(16.dp)
                      ) {
                          Column(modifier = Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("طريقة حساب مواقيت الصلاة", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              val methods = listOf(
                                  0 to "الهيئة المصرية العامة للمساحة",
                                  1 to "تقويم أم القرى (مكة المكرمة)",
                                  2 to "رابطة العالم الإسلامي"
                              )
                              methods.forEach { (idx, title) ->
                                  Row(
                                      modifier = Modifier.fillMaxWidth().clickable {
                                          calcMethod = idx
                                          prefs.edit().putInt("calc_method", idx).apply()
                                          onCalculationChanged()
                                          AdhanScheduler.scheduleAllPrayers(context)
                                      }.padding(vertical = 6.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      RadioButton(selected = calcMethod == idx, onClick = null)
                                      Spacer(Modifier.width(8.dp))
                                      Text(title, fontSize = 15.sp)
                                  }
                              }

                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(top = 6.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text("حساب العصر على المذهب الحنفي", fontSize = 15.sp)
                                  Switch(
                                      checked = isHanafi,
                                      onCheckedChange = {
                                          isHanafi = it
                                          prefs.edit().putBoolean("madhab_hanafi", it).apply()
                                          onCalculationChanged()
                                          AdhanScheduler.scheduleAllPrayers(context)
                                      }
                                  )
                              }
                          }
                      }
                  }

                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          shape = RoundedCornerShape(16.dp)
                      ) {
                          Column(modifier = Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("العمل الدائم في الخلفية", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              TvButton("تفعيل حماية الأذان من الإغلاق", Icons.Default.BatteryChargingFull, Modifier.fillMaxWidth()) {
                                  val pm = context.getSystemService(PowerManager::class.java)
                                  if (!pm.isIgnoringBatteryOptimizations(context.packageName)) {
                                      context.startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                          data = Uri.parse("package:${context.packageName}")
                                      })
                                  } else {
                                      Toast.makeText(context, "مُفعّل بالفعل! التطبيق محمي في الخلفية.", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate Keystore if not present
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'AlHana2026Secure' }}
        run: |
          if [ ! -f "alhana.jks" ]; then
            keytool -genkey -v -keystore alhana.jks -keyalg RSA -keysize 2048 -validity 10000 -alias alhana_key -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=Al-Hana, OU=Mobile, O=Al-Hana App, L=Cairo, S=Cairo, C=EG"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'AlHana2026Secure' }}
        run: |
          gradle assembleRelease -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/alhana.quran.apk

      - name: Upload Signed APK & Keystore to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlHana-Signed-Release-And-Keystore
          path: |
            app/build/outputs/apk/release/alhana.quran.apk
            alhana.jks

      - name: Publish Direct OTA Release on GitHub
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Al-Hana: Quran, Adhkar & Prayer (v3.0 Signed Release)"
          files: app/build/outputs/apk/release/alhana.quran.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
