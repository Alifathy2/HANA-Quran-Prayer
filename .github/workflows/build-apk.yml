          # 3. AudioEngine.kt
          cat << 'EOF' > app/src/main/java/com/hona/alquran/AudioEngine.kt
          package com.hona.alquran

          import android.app.*
          import android.content.*
          import android.media.*
          import android.os.*
          import android.widget.Toast
          import androidx.compose.runtime.MutableState
          import androidx.compose.runtime.mutableStateOf
          import androidx.core.app.NotificationCompat
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          object MediaPlaybackState {
              val currentTitle: MutableState<String?> = mutableStateOf(null)
              val currentUrl: MutableState<String?> = mutableStateOf(null)
              val isPlaying: MutableState<Boolean> = mutableStateOf(false)
              val isBuffering: MutableState<Boolean> = mutableStateOf(false)
          }

          object AudioEngine {
              private var mp: MediaPlayer? = null
              private var wl: PowerManager.WakeLock? = null
              private val mainHandler = Handler(Looper.getMainLooper())
              private var lastTitle = ""
              private var lastSubtitle = ""
              private var offlinePlaylist = emptyList<File>()
              private var offlineIndex = 0
              private const val CHANNEL_ID = "hana_direct_audio_ch"

              private fun resolveRedirectUrl(originalUrl: String): String {
                  if (!originalUrl.startsWith("http")) return originalUrl
                  return try {
                      var current = originalUrl
                      repeat(5) {
                          val conn = (URL(current).openConnection() as HttpURLConnection).apply {
                              instanceFollowRedirects = false; requestMethod = "GET"
                              setRequestProperty("User-Agent", "Mozilla/5.0"); connectTimeout = 6000; readTimeout = 6000
                          }
                          if (conn.responseCode in 300..399) {
                              val loc = conn.getHeaderField("Location")
                              conn.disconnect()
                              if (!loc.isNullOrEmpty()) current = loc else return current
                          } else { conn.disconnect(); return current }
                      }
                      current
                  } catch (_: Exception) { originalUrl }
              }

              fun playOfflineRadio(context: Context) {
                  val appCtx = context.applicationContext
                  val savedAudios = appCtx.filesDir.listFiles { f -> f.name.startsWith("audio_") && f.name.endsWith(".mp3") && f.length() > 15000 }?.sortedBy { it.name } ?: emptyList()
                  if (savedAudios.isEmpty()) {
                      Toast.makeText(appCtx, "لا توجد سور صوتية محفوظة بعد! حمّل أي سورة من قسم القرآن وستعمل هنا بدون إنترنت.", Toast.LENGTH_LONG).show()
                      return
                  }
                  offlinePlaylist = savedAudios; offlineIndex = 0
                  playOfflineTrackAt(appCtx, 0)
              }

              private fun playOfflineTrackAt(appCtx: Context, index: Int) {
                  if (offlinePlaylist.isEmpty()) return
                  val file = offlinePlaylist[index % offlinePlaylist.size]
                  val surahNum = file.name.substringAfterLast("_").substringBefore(".mp3")
                  lastTitle = "راديو أوفلاين (سورة رقم $surahNum)"
                  lastSubtitle = "بث محلي متواصل بدون إنترنت (${index + 1}/${offlinePlaylist.size})"
                  MediaPlaybackState.currentTitle.value = lastTitle
                  MediaPlaybackState.currentUrl.value = "OFFLINE_RADIO"
                  MediaPlaybackState.isBuffering.value = false
                  try {
                      mp?.reset(); mp?.release()
                      mp = MediaPlayer().apply {
                          setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                          setDataSource(file.absolutePath)
                          prepare()
                          setOnCompletionListener { offlineIndex = (offlineIndex + 1) % offlinePlaylist.size; playOfflineTrackAt(appCtx, offlineIndex) }
                          start()
                      }
                      MediaPlaybackState.isPlaying.value = true
                      showControlNotification(appCtx, lastSubtitle)
                  } catch (_: Exception) { stop(appCtx) }
              }

              fun play(context: Context, url: String, title: String, subtitle: String) {
                  if (url == "OFFLINE_RADIO") { playOfflineRadio(context); return }
                  offlinePlaylist = emptyList()
                  val appCtx = context.applicationContext
                  lastTitle = title; lastSubtitle = subtitle
                  MediaPlaybackState.currentTitle.value = title
                  MediaPlaybackState.currentUrl.value = url
                  MediaPlaybackState.isBuffering.value = true
                  MediaPlaybackState.isPlaying.value = false

                  try {
                      if (wl == null) {
                          wl = (appCtx.getSystemService(Context.POWER_SERVICE) as PowerManager).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Hana::DirectAudioLock").apply {
                              setReferenceCounted(false); acquire(3 * 60 * 60 * 1000L)
                          }
                      }
                  } catch (_: Exception) {}

                  showControlNotification(appCtx, "جاري الاتصال والتحميل...")

                  Thread {
                      try {
                          mp?.reset(); mp?.release()
                          val finalUrl = resolveRedirectUrl(url)
                          mp = MediaPlayer().apply {
                              setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                              setDataSource(finalUrl)
                              setOnPreparedListener { p ->
                                  mainHandler.post {
                                      MediaPlaybackState.isBuffering.value = false
                                      MediaPlaybackState.isPlaying.value = true
                                      p.start()
                                      showControlNotification(appCtx, lastSubtitle)
                                  }
                              }
                              setOnCompletionListener { mainHandler.post { stop(appCtx) } }
                              setOnErrorListener { _, _, _ ->
                                  mainHandler.post { Toast.makeText(appCtx, "تعذر تشغيل البث، جرب إذاعة أخرى أو راديو أوفلاين", Toast.LENGTH_SHORT).show(); stop(appCtx) }
                                  true
                              }
                              prepareAsync()
                          }
                      } catch (_: Exception) {
                          mainHandler.post { Toast.makeText(appCtx, "تعذر تشغيل الصوت، تحقق من الإنترنت أو شغل راديو أوفلاين", Toast.LENGTH_SHORT).show(); stop(appCtx) }
                      }
                  }.start()
              }

              fun toggle(context: Context) {
                  val appCtx = context.applicationContext
                  try {
                      val player = mp ?: return
                      if (player.isPlaying) {
                          player.pause(); MediaPlaybackState.isPlaying.value = false
                          showControlNotification(appCtx, "متوقف مؤقتاً - اضغط استئناف")
                      } else {
                          player.start(); MediaPlaybackState.isPlaying.value = true
                          showControlNotification(appCtx, lastSubtitle)
                      }
                  } catch (_: Exception) {}
              }

              fun stop(context: Context) {
                  val appCtx = context.applicationContext
                  offlinePlaylist = emptyList()
                  MediaPlaybackState.isPlaying.value = false; MediaPlaybackState.isBuffering.value = false
                  MediaPlaybackState.currentTitle.value = null; MediaPlaybackState.currentUrl.value = null
                  try { mp?.stop(); mp?.release() } catch (_: Exception) {}
                  mp = null
                  try { if (wl?.isHeld == true) wl?.release() } catch (_: Exception) {}
                  wl = null
                  try { appCtx.getSystemService(NotificationManager::class.java).cancel(2002) } catch (_: Exception) {}
              }

              private fun showControlNotification(context: Context, statusText: String) {
                  try {
                      val nm = context.getSystemService(NotificationManager::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) nm.createNotificationChannel(NotificationChannel(CHANNEL_ID, "مشغل القرآن والراديو", NotificationManager.IMPORTANCE_LOW))
                      val openPi = PendingIntent.getActivity(context, 10, Intent(context, MainActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_SINGLE_TOP }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val togglePi = PendingIntent.getBroadcast(context, 11, Intent(context, MediaActionReceiver::class.java).apply { action = "ACTION_TOGGLE" }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val stopPi = PendingIntent.getBroadcast(context, 12, Intent(context, MediaActionReceiver::class.java).apply { action = "ACTION_STOP" }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val playing = MediaPlaybackState.isPlaying.value
                      val notif = NotificationCompat.Builder(context, CHANNEL_ID)
                          .setContentTitle(lastTitle).setContentText(statusText).setSmallIcon(android.R.drawable.ic_media_play).setContentIntent(openPi)
                          .addAction(if (playing) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play, if (playing) "إيقاف مؤقت" else "استئناف", togglePi)
                          .addAction(android.R.drawable.ic_delete, "إيقاف نهائي", stopPi)
                          .setOngoing(playing || MediaPlaybackState.isBuffering.value).build()
                      nm.notify(2002, notif)
                  } catch (_: Exception) {}
              }
          }

          class MediaActionReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.action) {
                      "ACTION_TOGGLE" -> AudioEngine.toggle(context)
                      "ACTION_STOP" -> AudioEngine.stop(context)
                  }
              }
          }
          EOF

          # 4. ServicesAndReceivers.kt
          cat << 'EOF' > app/src/main/java/com/hona/alquran/ServicesAndReceivers.kt
          package com.hona.alquran

          import android.app.*
          import android.content.*
          import android.media.*
          import android.os.*
          import android.speech.tts.TextToSpeech
          import androidx.core.app.NotificationCompat
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.*

          object AdhanScheduler {
              fun scheduleAllPrayers(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val prefs = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                  val (lat, lng) = PrayerCalculator.getSavedLocation(context)
                  val now = System.currentTimeMillis()
                  val prayers = PrayerCalculator.getTodayPrayers(context, lat, lng).filter { it.key != "sunrise" } +
                                PrayerCalculator.getTodayPrayers(context, lat, lng, Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR, 1) }.time).filter { it.key != "sunrise" }

                  for (i in 0..25) {
                      am.cancel(PendingIntent.getBroadcast(context, 100 + i, Intent(context, AdhanReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      am.cancel(PendingIntent.getBroadcast(context, 200 + i, Intent(context, AdhanReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                  }

                  prayers.filter { it.timeInMillis > now + 5000L }.forEachIndexed { i, p ->
                      if (prefs.getBoolean("enable_${p.key}", true)) {
                          val intent = Intent(context, AdhanReceiver::class.java).apply {
                              putExtra("PRAYER_KEY", p.key); putExtra("PRAYER_NAME", p.name); putExtra("SCHEDULED_TIME", p.timeInMillis); putExtra("IS_PRE_REMINDER", false)
                          }
                          scheduleExact(context, am, p.timeInMillis, PendingIntent.getBroadcast(context, 100 + i, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      }
                      val preMinutes = prefs.getInt("pre_min_${p.key}", 0)
                      val preTime = p.timeInMillis - (preMinutes * 60 * 1000L)
                      if (preMinutes > 0 && preTime > now + 5000L) {
                          val preIntent = Intent(context, AdhanReceiver::class.java).apply {
                              putExtra("PRAYER_KEY", p.key); putExtra("PRAYER_NAME", p.name); putExtra("SCHEDULED_TIME", preTime); putExtra("IS_PRE_REMINDER", true); putExtra("PRE_MINUTES", preMinutes)
                          }
                          scheduleExact(context, am, preTime, PendingIntent.getBroadcast(context, 200 + i, preIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      }
                  }
                  scheduleSalawatReminder(context)
              }

              fun scheduleExact(context: Context, am: AlarmManager, triggerAtMillis: Long, operation: PendingIntent) {
                  try {
                      val showIntent = PendingIntent.getActivity(context, 0, Intent(context, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                      am.setAlarmClock(AlarmManager.AlarmClockInfo(triggerAtMillis, showIntent), operation)
                  } catch (_: Exception) {
                      try { am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMillis, operation) }
                      catch (_: Exception) { am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMillis, operation) }
                  }
              }

              fun scheduleSalawatReminder(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val prefs = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                  val pi = PendingIntent.getBroadcast(context, 555, Intent(context, SalawatReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  am.cancel(pi)
                  if (prefs.getBoolean("salawat_enabled", false)) {
                      val intervalMins = prefs.getInt("salawat_interval", 15).coerceAtLeast(1)
                      scheduleExact(context, am, System.currentTimeMillis() + (intervalMins * 60 * 1000L), pi)
                  }
                  SalawatKeepAliveReceiver.syncState(context)
              }
          }

          class AdhanReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val scheduledTime = intent.getLongExtra("SCHEDULED_TIME", 0L)
                  if (scheduledTime > 0L && kotlin.math.abs(System.currentTimeMillis() - scheduledTime) > 150_000L) {
                      AdhanScheduler.scheduleAllPrayers(context); return
                  }
                  val name = intent.getStringExtra("PRAYER_NAME") ?: "الصلاة"
                  if (intent.getBooleanExtra("IS_PRE_REMINDER", false)) {
                      val mins = intent.getIntExtra("PRE_MINUTES", 10)
                      val nm = context.getSystemService(NotificationManager::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) nm.createNotificationChannel(NotificationChannel("pre_prayer_ch", "التنبيه قبل الصلاة", NotificationManager.IMPORTANCE_HIGH))
                      nm.notify(4004, NotificationCompat.Builder(context, "pre_prayer_ch")
                          .setContentTitle("اقترب موعد صلاة $name").setContentText("متبقي $mins دقائق على أذان $name")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm).setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)).setAutoCancel(true).build())
                  } else {
                      try {
                          val si = Intent(context, AdhanService::class.java).apply { putExtra("PRAYER_NAME", name); putExtra("PRAYER_KEY", intent.getStringExtra("PRAYER_KEY") ?: "fajr") }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(si) else context.startService(si)
                      } catch (_: Exception) {}
                  }
                  AdhanScheduler.scheduleAllPrayers(context)
              }
          }

          class SalawatReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  try {
                      val si = Intent(context, AdhanService::class.java).apply { action = "PLAY_SALAWAT" }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(si) else context.startService(si)
                  } catch (_: Exception) {}
                  AdhanScheduler.scheduleSalawatReminder(context)
              }
          }

          class SalawatKeepAliveReceiver : BroadcastReceiver() {
              companion object {
                  fun syncState(context: Context) {
                      val prefs = context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                      val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val pi = PendingIntent.getBroadcast(context, 888, Intent(context, SalawatKeepAliveReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      am.cancel(pi)
                      if (prefs.getBoolean("salawat_enabled", false)) {
                          val intervalMins = prefs.getInt("salawat_interval", 15).coerceAtLeast(1)
                          AdhanScheduler.scheduleExact(context, am, System.currentTimeMillis() + (intervalMins * 60 * 1000L), pi)
                      }
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  if (context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE).getBoolean("salawat_enabled", false)) {
                      try { (context.getSystemService(Context.POWER_SERVICE) as PowerManager).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Hana::SalawatSilentLock").acquire(15000L) } catch (_: Exception) {}
                      try {
                          val si = Intent(context, AdhanService::class.java).apply { action = "PLAY_SALAWAT" }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(si) else context.startService(si)
                      } catch (_: Exception) {}
                      syncState(context)
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED || intent.action == "android.intent.action.QUICKBOOT_POWERON") {
                      AdhanScheduler.scheduleAllPrayers(context)
                      SalawatKeepAliveReceiver.syncState(context)
                  }
              }
          }

          class AdhanService : Service() {
              private var mp: MediaPlayer? = null
              private var wl: PowerManager.WakeLock? = null
              private var tts: TextToSpeech? = null
              private val mainHandler = Handler(Looper.getMainLooper())
              private var screenOffReceiver: BroadcastReceiver? = null
              private var isCurrentlyPlayingAdhan = false

              override fun onCreate() {
                  super.onCreate()
                  screenOffReceiver = object : BroadcastReceiver() {
                      override fun onReceive(context: Context?, intent: Intent?) {
                          if (intent?.action == Intent.ACTION_SCREEN_OFF && isCurrentlyPlayingAdhan) stopSelf()
                      }
                  }
                  registerReceiver(screenOffReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP_ADHAN") { stopSelf(); return START_NOT_STICKY }
                  try {
                      if (wl == null) wl = (getSystemService(Context.POWER_SERVICE) as PowerManager).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Hana::Wl").apply { setReferenceCounted(false); acquire(300000L) }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel("ch", "تنبيهات الأذان والصلاة على النبي", NotificationManager.IMPORTANCE_HIGH))
                      val stopPi = PendingIntent.getService(this, 0, Intent(this, AdhanService::class.java).apply { action = "STOP_ADHAN" }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val openPi = PendingIntent.getActivity(this, 1, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)

                      if (intent?.action == "PLAY_SALAWAT") {
                          isCurrentlyPlayingAdhan = false
                          startForeground(1001, NotificationCompat.Builder(this, "ch")
                              .setContentTitle("صلِّ على محمد ﷺ").setContentText("اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ")
                              .setSmallIcon(android.R.drawable.ic_popup_reminder).setContentIntent(openPi).addAction(android.R.drawable.ic_media_pause, "إيقاف", stopPi).setAutoCancel(true).build())
                          playSalawatAudio()
                          return START_NOT_STICKY
                      }

                      isCurrentlyPlayingAdhan = true
                      val name = intent?.getStringExtra("PRAYER_NAME") ?: "الصلاة"
                      val prayerKey = intent?.getStringExtra("PRAYER_KEY") ?: "fajr"
                      startForeground(1001, NotificationCompat.Builder(this, "ch")
                          .setContentTitle("هَنَا القُرآن - حان الآن موعد أذان $name").setContentText("اضغط زر الباور لإلغاء الصوت أو أزرار الصوت للتحكم")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm).setContentIntent(openPi).addAction(android.R.drawable.ic_media_pause, "إيقاف الأذان", stopPi).setOngoing(true).build())

                      val playInSilent = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE).getBoolean("silent_$prayerKey", true)
                      val isDeviceSilent = (getSystemService(Context.AUDIO_SERVICE) as AudioManager).ringerMode != AudioManager.RINGER_MODE_NORMAL
                      if (isDeviceSilent && !playInSilent && prayerKey != "test") { stopSelf(); return START_NOT_STICKY }
                      playAdhan()
                  } catch (_: Exception) {}
                  return START_NOT_STICKY
              }

              private fun playRawOrFile(resId: Int, file: File?, attrs: AudioAttributes, vol: Float = 1.0f): Boolean {
                  return try {
                      val player = MediaPlayer().apply { setAudioAttributes(attrs) }
                      if (resId != 0) {
                          resources.openRawResourceFd(resId).use { afd -> player.setDataSource(afd.fileDescriptor, afd.startOffset, afd.length) }
                      } else if (file != null && file.exists() && file.length() > 3000) {
                          player.setDataSource(file.absolutePath)
                      } else return false
                      player.prepare(); player.setVolume(vol, vol); player.setOnCompletionListener { stopSelf() }; player.start()
                      mp = player; true
                  } catch (_: Exception) { false }
              }

              private fun playSalawatAudio() {
                  Thread {
                      try {
                          mp?.release()
                          val prefs = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                          val voiceChoice = prefs.getInt("salawat_voice_choice", 1)
                          val targetVolume = prefs.getFloat(if (voiceChoice == 2) "salawat_vol_2" else "salawat_vol_1", 1.0f).coerceIn(0.05f, 1.0f)
                          val attrs = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build()
                          var resId = resources.getIdentifier(if (voiceChoice == 2) "salawt2" else "salawat", "raw", packageName)
                          if (resId == 0) resId = resources.getIdentifier("salawat", "raw", packageName)
                          if (playRawOrFile(resId, null, attrs, targetVolume)) return@Thread

                          val cached = File(filesDir, "salawat_voice_$voiceChoice.mp3")
                          if (!cached.exists() || cached.length() < 3000) {
                              try {
                                  val text = if (voiceChoice == 2) "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّد" else "صَلِّ عَلَى مُحَمَّد، اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّد"
                                  val conn = (URL("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=${URLEncoder.encode(text, "UTF-8")}").openConnection() as HttpURLConnection).apply {
                                      instanceFollowRedirects = true; setRequestProperty("User-Agent", "Mozilla/5.0"); connectTimeout = 8000
                                  }
                                  conn.inputStream.use { i -> cached.outputStream().use { o -> i.copyTo(o) } }
                              } catch (_: Exception) {}
                          }
                          if (playRawOrFile(0, cached, attrs, targetVolume)) return@Thread

                          mainHandler.post {
                              tts = TextToSpeech(applicationContext) { status ->
                                  if (status == TextToSpeech.SUCCESS) {
                                      tts?.language = Locale("ar")
                                      tts?.speak("صَلِّ عَلَى مُحَمَّد، اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّد", TextToSpeech.QUEUE_FLUSH, null, "salawat_tts")
                                      mainHandler.postDelayed({ stopSelf() }, 6000L)
                                  } else playFallbackRingtone(RingtoneManager.TYPE_NOTIFICATION)
                              }
                          }
                      } catch (_: Exception) { playFallbackRingtone(RingtoneManager.TYPE_NOTIFICATION) }
                  }.start()
              }

              private fun playFallbackRingtone(type: Int) {
                  try {
                      mp = MediaPlayer().apply {
                          setDataSource(applicationContext, RingtoneManager.getDefaultUri(type))
                          prepare(); setOnCompletionListener { stopSelf() }; start()
                      }
                  } catch (_: Exception) { stopSelf() }
              }

              private fun playAdhan() {
                  Thread {
                      try {
                          mp?.release()
                          val selectedUrl = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE).getString("adhan_url", "RAW_BUILTIN") ?: "RAW_BUILTIN"
                          val attrs = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build()
                          val resId = resources.getIdentifier("adhan", "raw", packageName)
                          if (selectedUrl == "RAW_BUILTIN" && playRawOrFile(resId, null, attrs)) return@Thread

                          val cached = File(filesDir, "custom_adhan.mp3")
                          if (!cached.exists() || cached.length() < 20000) {
                              try {
                                  val conn = (URL(selectedUrl).openConnection() as HttpURLConnection).apply { instanceFollowRedirects = true; setRequestProperty("User-Agent", "Mozilla/5.0"); connectTimeout = 10000 }
                                  conn.inputStream.use { i -> cached.outputStream().use { o -> i.copyTo(o) } }
                              } catch (_: Exception) {}
                          }
                          if (cached.length() > 20000 && playRawOrFile(0, cached, attrs)) return@Thread
                          if (!playRawOrFile(resId, null, attrs)) playFallbackRingtone(RingtoneManager.TYPE_ALARM)
                      } catch (_: Exception) { stopSelf() }
                  }.start()
              }

              override fun onDestroy() {
                  isCurrentlyPlayingAdhan = false
                  try { screenOffReceiver?.let { unregisterReceiver(it) } } catch (_: Exception) {}
                  try { mp?.stop(); mp?.release() } catch (_: Exception) {}
                  mp = null
                  try { tts?.stop(); tts?.shutdown() } catch (_: Exception) {}
                  tts = null
                  if (wl?.isHeld == true) wl?.release()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
