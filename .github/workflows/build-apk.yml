              val apkUrl = "https://github.com/Alifathy2/HANA-Quran-Prayer/releases/latest/download/alhana.quran.apk?t=${System.currentTimeMillis()}"
              try {
                  val dm = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                  val downloadId = dm.enqueue(DownloadManager.Request(Uri.parse(apkUrl))
                      .setTitle("تحديث هَنَا القُرآن ($cleanVer)").setDescription("جاري تنزيل التحديث...")
                      .setMimeType("application/vnd.android.package-archive")
                      .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                      .setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName).setAllowedOverMetered(true))
                  Toast.makeText(context, "بدأ تحميل التحديث... سيفتح التثبيت تلقائياً فور الانتهاء", Toast.LENGTH_LONG).show()
                  CoroutineScope(Dispatchers.IO).launch {
                      var downloading = true
                      while (downloading) {
                          val cursor = dm.query(DownloadManager.Query().setFilterById(downloadId))
                          if (cursor != null && cursor.moveToFirst()) {
                              val statusIdx = cursor.getColumnIndex(DownloadManager.COLUMN_STATUS)
                              when (if (statusIdx >= 0) cursor.getInt(statusIdx) else -1) {
                                  DownloadManager.STATUS_SUCCESSFUL -> { downloading = false; withContext(Dispatchers.Main) { installApkFile(context, existingFile) } }
                                  DownloadManager.STATUS_FAILED -> downloading = false
                              }
                          }
                          cursor?.close()
                          delay(1000L)
                      }
                  }
              } catch (_: Exception) { context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(apkUrl))) }
          }

