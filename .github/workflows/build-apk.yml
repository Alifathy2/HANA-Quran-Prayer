          # 16. خدمة الأذان وخدمة الصوت مع تحكم أزرار الصوت وخفض الصوت أو زر الباور للإلغاء (AdhanService.kt)
          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/AdhanService.kt
          package com.hona.alquran.service

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import com.hona.alquran.MainActivity
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          class AdhanService : Service() {
              private var mp: MediaPlayer? = null
              private var wl: PowerManager.WakeLock? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP_ADHAN" || intent?.action == "MUTE_ADHAN") {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  try {
                      if (wl == null) {
                          wl = (getSystemService(Context.POWER_SERVICE) as PowerManager).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Hana::Wl").apply {
                              setReferenceCounted(false)
                              acquire(300000L)
                          }
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel("ch", "تنبيهات الأذان والصلاة على النبي", NotificationManager.IMPORTANCE_HIGH))
                      }

                      val stopPi = PendingIntent.getService(this, 0, Intent(this, AdhanService::class.java).apply { action = "STOP_ADHAN" }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val openPi = PendingIntent.getActivity(this, 1, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)

                      if (intent?.action == "PLAY_SALAWAT") {
                          val salawatNotif = NotificationCompat.Builder(this, "ch")
                              .setContentTitle("صلِّ على محمد ﷺ")
                              .setContentText("اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ")
                              .setSmallIcon(android.R.drawable.ic_popup_reminder)
                              .setContentIntent(openPi)
                              .addAction(android.R.drawable.ic_media_pause, "إيقاف", stopPi)
                              .setAutoCancel(true)
                              .build()

                          startForeground(1001, salawatNotif)
                          playSalawatAudio()
                          return START_NOT_STICKY
                      }

                      val name = intent?.getStringExtra("PRAYER_NAME") ?: "الصلاة"
                      val prayerKey = intent?.getStringExtra("PRAYER_KEY") ?: "fajr"

                      val notif = NotificationCompat.Builder(this, "ch")
                          .setContentTitle("هَنَا القُرآن - حان الآن موعد أذان $name")
                          .setContentText("حي على الصلاة.. (اضغط زر الباور أو خفض الصوت للإلغاء)")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentIntent(openPi)
                          .addAction(android.R.drawable.ic_media_pause, "إيقاف الأذان", stopPi)
                          .setOngoing(true)
                          .build()

                      startForeground(1001, notif)

                      val prefs = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                      val playInSilent = prefs.getBoolean("silent_$prayerKey", true)
                      val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val isDeviceSilent = audioManager.ringerMode != AudioManager.RINGER_MODE_NORMAL

                      if (isDeviceSilent && !playInSilent && prayerKey != "test") {
                          stopSelf()
                          return START_NOT_STICKY
                      }

                      playAdhan(playInSilent)
                  } catch (_: Exception) {}
                  return START_NOT_STICKY
              }

              private fun playSalawatAudio() {
                  Thread {
                      try {
                          mp?.release()
                          val prefs = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                          val soundChoice = prefs.getString("salawat_sound_choice", "salawat.mp3") ?: "salawat.mp3"
                          val volumeLevel = prefs.getFloat("salawat_volume", 1.0f).coerceIn(0.1f, 1.0f)

                          val attrs = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()

                          val resId = resources.getIdentifier(if (soundChoice == "salawt2.mp3") "salawt2" else "salawat", "raw", packageName)
                          if (resId != 0) {
                              val afd = resources.openRawResourceFd(resId)
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                              afd.close()
                              player.setVolume(volumeLevel, volumeLevel)
                              player.prepare()
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                              return@Thread
                          }

                          playDefaultNotificationSound()
                      } catch (_: Exception) {
                          playDefaultNotificationSound()
                      }
                  }.start()
              }

              private fun playDefaultNotificationSound() {
                  try {
                      val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                      val player = MediaPlayer()
                      player.setDataSource(applicationContext, uri)
                      player.prepare()
                      player.setOnCompletionListener { stopSelf() }
                      player.start()
                      mp = player
                  } catch (_: Exception) {
                      stopSelf()
                  }
              }

              private fun playAdhan(playInSilent: Boolean) {
                  Thread {
                      try {
                          mp?.release()
                          val prefs = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                          val selectedUrl = prefs.getString("adhan_url", "RAW_BUILTIN") ?: "RAW_BUILTIN"
                          val adhanVol = prefs.getFloat("adhan_volume", 1.0f).coerceIn(0.1f, 1.0f)
                          val usageType = if (playInSilent) AudioAttributes.USAGE_ALARM else AudioAttributes.USAGE_NOTIFICATION
                          val attrs = AudioAttributes.Builder()
                              .setUsage(usageType)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()

                          val resId = resources.getIdentifier("adhan", "raw", packageName)

                          if (selectedUrl == "RAW_BUILTIN" && resId != 0) {
                              val afd = resources.openRawResourceFd(resId)
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                              afd.close()
                              player.setVolume(adhanVol, adhanVol)
                              player.prepare()
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                              return@Thread
                          }

                          val cached = File(filesDir, "custom_adhan.mp3")
                          if (!cached.exists() || cached.length() < 20000) {
                              try {
                                  val conn = URL(selectedUrl).openConnection() as HttpURLConnection
                                  conn.instanceFollowRedirects = true
                                  conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                                  conn.connectTimeout = 8000
                                  conn.inputStream.use { i -> cached.outputStream().use { o -> i.copyTo(o) } }
                              } catch (_: Exception) {}
                          }

                          if (cached.exists() && cached.length() > 20000) {
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(cached.absolutePath)
                              player.setVolume(adhanVol, adhanVol)
                              player.prepare()
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                          } else if (resId != 0) {
                              val afd = resources.openRawResourceFd(resId)
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                              afd.close()
                              player.setVolume(adhanVol, adhanVol)
                              player.prepare()
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                          } else {
                              val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                              val player = MediaPlayer()
                              player.setAudioAttributes(attrs)
                              player.setDataSource(applicationContext, uri)
                              player.prepare()
                              player.setOnCompletionListener { stopSelf() }
                              player.start()
                              mp = player
                          }
                      } catch (_: Exception) {
                          stopSelf()
                      }
                  }.start()
              }

              override fun onDestroy() {
                  try { mp?.stop(); mp?.release() } catch (_: Exception) {}
                  mp = null
                  if (wl?.isHeld == true) wl?.release()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
