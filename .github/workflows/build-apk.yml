          @Composable
          fun RadioBroadcastScreen() {
              val context = LocalContext.current
              var playingStation by remember { mutableStateOf<RadioStation?>(null) }
              var isBuffering by remember { mutableStateOf(false) }
              val radioPlayer = remember { MediaPlayer() }

              DisposableEffect(Unit) {
                  onDispose {
                      try { radioPlayer.stop(); radioPlayer.release() } catch (_: Exception) {}
                  }
              }

              fun playStation(station: RadioStation) {
                  if (playingStation == station) {
                      try { radioPlayer.stop() } catch (_: Exception) {}
                      playingStation = null
                      isBuffering = false
                      return
                  }
                  playingStation = station
                  isBuffering = true
                  Toast.makeText(context, "جاري الاتصال ببث: ${station.name}", Toast.LENGTH_SHORT).show()
                  Thread {
                      try {
                          radioPlayer.reset()
                          radioPlayer.setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .build()
                          )
                          radioPlayer.setDataSource(station.streamUrl)
                          radioPlayer.prepareAsync()
                          radioPlayer.setOnPreparedListener {
                              isBuffering = false
                              it.start()
                          }
                          radioPlayer.setOnErrorListener { _, _, _ ->
                              isBuffering = false
                              playingStation = null
                              true
                          }
                      } catch (_: Exception) {
                          isBuffering = false
                          playingStation = null
                      }
                  }.start()
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  Card(
                      modifier = Modifier.fillMaxWidth().padding(bottom = 14.dp),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                      shape = RoundedCornerShape(18.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(18.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column(modifier = Modifier.weight(1f)) {
                              Text("بث إذاعات القرآن الكريم المباشر", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Text(
                                  if (playingStation != null) (if (isBuffering) "جاري التحميل: ${playingStation!!.name}..." else "يعمل الآن: ${playingStation!!.name}")
                                  else "اختر إذاعة للاستماع المباشر على مدار 24 ساعة",
                                  fontSize = 13.sp,
                                  color = Color.LightGray
                              )
                          }
                          if (playingStation != null) {
                              TvButton("إيقاف البث", Icons.Default.Stop) {
                                  try { radioPlayer.stop() } catch (_: Exception) {}
                                  playingStation = null
                                  isBuffering = false
                              }
                          }
                      }
                  }

                  LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      items(RADIO_STATIONS) { station ->
                          val isPlaying = playingStation == station
                          var focused by remember { mutableStateOf(false) }
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .background(
                                      if (isPlaying) MaterialTheme.colorScheme.primary.copy(alpha = 0.22f) else MaterialTheme.colorScheme.surface,
                                      RoundedCornerShape(16.dp)
                                  )
                                  .onFocusChanged { focused = it.isFocused }
                                  .focusable()
                                  .border(if (focused || isPlaying) 2.dp else 0.dp, MaterialTheme.colorScheme.primary, RoundedCornerShape(16.dp))
                                  .clickable { playStation(station) }
                                  .padding(16.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                  Icon(
                                      if (isPlaying) Icons.Default.GraphicEq else Icons.Default.Radio,
                                      contentDescription = null,
                                      tint = MaterialTheme.colorScheme.primary,
                                      modifier = Modifier.size(30.dp)
                                  )
                                  Spacer(Modifier.width(14.dp))
                                  Column {
                                      Text(station.name, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                                      Text(station.subtitle, fontSize = 13.sp, color = Color.LightGray)
                                  }
                              }
                              Icon(
                                  if (isPlaying) Icons.Default.PauseCircleFilled else Icons.Default.PlayCircleFilled,
                                  contentDescription = null,
                                  tint = MaterialTheme.colorScheme.primary,
                                  modifier = Modifier.size(36.dp)
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun QuranScreen(fontScale: Float) {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
              val scope = rememberCoroutineScope()

              var surahs by remember { mutableStateOf(emptyList<SurahInfo>()) }
              var searchQuery by remember { mutableStateOf("") }
              var selectedSurah by remember { mutableStateOf<SurahInfo?>(null) }
              var ayahs by remember { mutableStateOf(emptyList<AyahWithTafsir>()) }
              var isLoading by remember { mutableStateOf(true) }
              var showTafsir by remember { mutableStateOf(true) }
              var selectedReciter by remember { mutableStateOf(QURAN_RECITERS.first()) }
              var isPlayingAudio by remember { mutableStateOf(false) }
              val audioPlayer = remember { MediaPlayer() }
              var savedBookmarkSurah by remember { mutableIntStateOf(prefs.getInt("bookmark_surah", 1)) }

              DisposableEffect(Unit) {
                  onDispose {
                      try { audioPlayer.stop(); audioPlayer.release() } catch (_: Exception) {}
                  }
              }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      try {
                          val cacheFile = File(context.filesDir, "surahs_cache.json")
                          val json = if (cacheFile.exists()) cacheFile.readText() else URL("https://api.alquran.cloud/v1/surah").readText().also { cacheFile.writeText(it) }
                          val data = JSONObject(json).getJSONArray("data")
                          val list = mutableListOf<SurahInfo>()
                          for (i in 0 until data.length()) {
                              val item = data.getJSONObject(i)
                              list.add(SurahInfo(item.getInt("number"), item.getString("name"), item.getInt("numberOfAyahs")))
                          }
                          surahs = list
                      } catch (_: Exception) {} finally { isLoading = false }
                  }
              }

              fun openSurah(surah: SurahInfo) {
                  selectedSurah = surah
                  isLoading = true
                  prefs.edit().putInt("bookmark_surah", surah.number).apply()
                  savedBookmarkSurah = surah.number
                  scope.launch(Dispatchers.IO) {
                      try {
                          val cacheFile = File(context.filesDir, "surah_${surah.number}.json")
                          val res = if (cacheFile.exists()) cacheFile.readText() else URL("https://api.alquran.cloud/v1/surah/${surah.number}/editions/quran-uthmani,ar.muyassar").readText().also { cacheFile.writeText(it) }
                          val editions = JSONObject(res).getJSONArray("data")
                          val quranAyahs = editions.getJSONObject(0).getJSONArray("ayahs")
                          val tafsirAyahs = editions.getJSONObject(1).getJSONArray("ayahs")
                          val combined = mutableListOf<AyahWithTafsir>()
                          for (i in 0 until quranAyahs.length()) {
                              combined.add(
                                  AyahWithTafsir(
                                      quranAyahs.getJSONObject(i).getInt("numberInSurah"),
                                      quranAyahs.getJSONObject(i).getString("text"),
                                      tafsirAyahs.getJSONObject(i).getString("text")
                                  )
                              )
                          }
                          ayahs = combined
                      } catch (_: Exception) {} finally { isLoading = false }
                  }
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  if (selectedSurah == null) {
                      OutlinedTextField(
                          value = searchQuery,
                          onValueChange = { searchQuery = it },
                          placeholder = { Text("ابحث عن اسم السورة...") },
                          leadingIcon = { Icon(Icons.Default.Search, null) },
                          modifier = Modifier.fillMaxWidth().padding(bottom = 10.dp),
                          singleLine = true
                      )

                      val bookmarked = surahs.firstOrNull { it.number == savedBookmarkSurah }
                      if (bookmarked != null) {
                          TvButton("استكمال القراءة: ${bookmarked.name}", Icons.Default.Bookmark, Modifier.fillMaxWidth().padding(bottom = 10.dp)) {
                              openSurah(bookmarked)
                          }
                      }

                      if (isLoading) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }
                      } else {
                          val filtered = surahs.filter { it.name.contains(searchQuery) || it.number.toString() == searchQuery }
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              items(filtered) { surah ->
                                  var focused by remember { mutableStateOf(false) }
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .background(MaterialTheme.colorScheme.surface, RoundedCornerShape(14.dp))
                                          .onFocusChanged { focused = it.isFocused }
                                          .focusable()
                                          .border(if (focused) 2.dp else 0.dp, MaterialTheme.colorScheme.primary, RoundedCornerShape(14.dp))
                                          .clickable { openSurah(surah) }
                                          .padding(16.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Text("${surah.number}. ${surah.name}", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                                      Text("${surah.ayahsCount} آية", color = MaterialTheme.colorScheme.primary)
                                  }
                              }
                          }
                      }
                  } else {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(bottom = 10.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          TvButton("الفهرس", Icons.Default.ArrowBack) {
                              try { audioPlayer.stop() } catch (_: Exception) {}
                              isPlayingAudio = false
                              selectedSurah = null
                          }
                          Text(selectedSurah!!.name, fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              TvButton(if (isPlayingAudio) "إيقاف" else "تلاوة", if (isPlayingAudio) Icons.Default.Stop else Icons.Default.PlayArrow) {
                                  if (isPlayingAudio) {
                                      try { audioPlayer.stop() } catch (_: Exception) {}
                                      isPlayingAudio = false
                                  } else {
                                      val formattedNum = String.format(Locale.US, "%03d", selectedSurah!!.number)
                                      val audioUrl = "${selectedReciter.serverUrl}/$formattedNum.mp3"
                                      Toast.makeText(context, "جاري تشغيل تلاوة ${selectedReciter.name}...", Toast.LENGTH_SHORT).show()
                                      Thread {
                                          try {
                                              audioPlayer.reset()
                                              audioPlayer.setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                                              audioPlayer.setDataSource(audioUrl)
                                              audioPlayer.prepare()
                                              audioPlayer.start()
                                              isPlayingAudio = true
                                              audioPlayer.setOnCompletionListener { isPlayingAudio = false }
                                          } catch (_: Exception) {}
                                      }.start()
                                  }
                              }
                              TvButton(if (showTafsir) "إخفاء التفسير" else "التفسير", Icons.Default.Description) { showTafsir = !showTafsir }
                          }
                      }

                      if (isLoading) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }
                      } else {
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              items(ayahs) { ayah ->
                                  var focused by remember { mutableStateOf(false) }
                                  Column(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .background(MaterialTheme.colorScheme.surface, RoundedCornerShape(16.dp))
                                          .onFocusChanged { focused = it.isFocused }
                                          .focusable()
                                          .border(if (focused) 2.dp else 0.dp, MaterialTheme.colorScheme.primary, RoundedCornerShape(16.dp))
                                          .padding(18.dp)
                                  ) {
                                      Text(
                                          text = "${ayah.text} ﴿${ayah.numberInSurah}﴾",
                                          fontSize = (23 * fontScale).sp,
                                          lineHeight = (40 * fontScale).sp,
                                          textAlign = TextAlign.Right,
                                          modifier = Modifier.fillMaxWidth()
                                      )
                                      if (showTafsir) {
                                          HorizontalDivider(modifier = Modifier.padding(vertical = 10.dp), color = Color.Gray.copy(alpha = 0.3f))
                                          Text(
                                              text = "التفسير الميسر: ${ayah.tafsir}",
                                              fontSize = (15 * fontScale).sp,
                                              color = Color(0xFFE0E0E0),
                                              lineHeight = (26 * fontScale).sp
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

