                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.92f)),
                          shape = RoundedCornerShape(22.dp)
                      ) {
                          Column(modifier = Modifier.fillMaxWidth().padding(18.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              Spacer(Modifier.height(8.dp))
                              Box(
                                  modifier = Modifier
                                      .background(Color(0xFF06281E), RoundedCornerShape(50))
                                      .border(1.dp, MaterialTheme.colorScheme.primary.copy(alpha = 0.5f), RoundedCornerShape(50))
                                      .padding(horizontal = 20.dp, vertical = 6.dp)
                              ) {
                                  Text("🕌 مواقيت الصلاة • $stat", fontSize = 13.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              }
                              Spacer(Modifier.height(10.dp))
                              Text("الصلاة القادمة: ${next?.name ?: ""} بعد", fontSize = 15.sp, color = Color(0xFFE0E0E0))
                              Text(cd, fontSize = 38.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
