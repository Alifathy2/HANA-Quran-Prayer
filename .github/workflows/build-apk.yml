          cat << 'EOF' > app/src/main/java/com/hona/alquran/service/AdhanService.kt
          package com.hona.alquran.service

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.*
          import android.os.*
          import androidx.core.app.NotificationCompat
          import com.hona.alquran.MainActivity

          class AdhanService : Service() {
              private var mp: MediaPlayer? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP_ADHAN") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel("ch", "الأذان والتنبيهات", NotificationManager.IMPORTANCE_HIGH))
                      }
                      val openPi = PendingIntent.getActivity(this, 1, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                      val stopPi = PendingIntent.getService(this, 0, Intent(this, AdhanService::class.java).apply { action = "STOP_ADHAN" }, PendingIntent.FLAG_IMMUTABLE)

                      val notif = NotificationCompat.Builder(this, "ch")
                          .setContentTitle(if (intent?.action == "PLAY_SALAWAT") "صلِّ على محمد ﷺ" else "حان الآن موعد الأذان")
                          .setContentText("اضغط زر الباور أو خفض الصوت للإلغاء")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentIntent(openPi)
                          .addAction(android.R.drawable.ic_media_pause, "إيقاف", stopPi)
                          .setOngoing(true)
                          .build()

                      startForeground(1001, notif)

                      Thread {
                          try {
                              mp?.release()
                              val prefs = getSharedPreferences("hona_prefs", Context.MODE_PRIVATE)
                              val vol = prefs.getFloat("adhan_volume", 1.0f)
                              val soundChoice = if (intent?.action == "PLAY_SALAWAT") prefs.getString("salawat_sound_choice", "salawat.mp3") else "adhan.mp3"
                              
                              val resId = resources.getIdentifier(if (soundChoice == "salawt2.mp3") "salawt2" else if (soundChoice == "salawat.mp3") "salawat" else "adhan", "raw", packageName)
                              if (resId != 0) {
                                  val afd = resources.openRawResourceFd(resId)
                                  mp = MediaPlayer().apply {
                                      setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                                      afd.close()
                                      setVolume(vol, vol)
                                      prepare()
                                      setOnCompletionListener { stopSelf() }
                                      start()
                                  }
                              }
                          } catch (_: Exception) {
                              stopSelf()
                          }
                      }.start()
                  } catch (_: Exception) {}
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  try { mp?.stop(); mp?.release() } catch (_: Exception) {}
                  mp = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED || intent.action == "android.intent.action.QUICKBOOT_POWERON") {
                      AdhanScheduler.scheduleAllPrayers(context)
                  }
              }
          }
