          // بوصلة القبلة مع رسم الكعبة المشرفة الذهبية والسوداء بدلاً من النقطة البيضاء
          @Composable
          fun CompassView() {
              val context = LocalContext.current
              val qiblaAngle = remember { PrayerCalculator.getQiblaAngle(context) }
              var azimuth by remember { mutableFloatStateOf(0f) }

              DisposableEffect(Unit) {
                  val sm = context.getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  val sensor = sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR) ?: sm.getDefaultSensor(Sensor.TYPE_ORIENTATION)
                  val listener = object : SensorEventListener {
                      override fun onSensorChanged(e: SensorEvent?) {
                          if (e == null) return
                          if (e.sensor.type == Sensor.TYPE_ROTATION_VECTOR) {
                              val rm = FloatArray(9)
                              SensorManager.getRotationMatrixFromVector(rm, e.values)
                              val ori = FloatArray(3)
                              SensorManager.getOrientation(rm, ori)
                              azimuth = ((Math.toDegrees(ori[0].toDouble()) + 360) % 360).toFloat()
                          } else azimuth = e.values[0]
                      }
                      override fun onAccuracyChanged(s: Sensor?, a: Int) {}
                  }
                  if (sensor != null) sm.registerListener(listener, sensor, SensorManager.SENSOR_DELAY_UI)
                  onDispose { sm.unregisterListener(listener) }
              }

              val rot = (qiblaAngle - azimuth + 360f) % 360f
              val primary = MaterialTheme.colorScheme.primary
              val surface = MaterialTheme.colorScheme.surface

              Column(modifier = Modifier.fillMaxSize().padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                  Text("بوصلة اتجاه القبلة المشرفة", fontSize = 21.sp, fontWeight = FontWeight.Bold, color = primary)
                  Text("زاوية الكعبة من موقعك: ${qiblaAngle.toInt()}° من الشمال", fontSize = 14.sp, color = Color.LightGray)
                  Spacer(Modifier.height(22.dp))
                  Box(modifier = Modifier.size(240.dp), contentAlignment = Alignment.Center) {
                      Canvas(modifier = Modifier.fillMaxSize()) {
                          drawCircle(color = surface)
                          drawCircle(color = primary, style = Stroke(width = 5.dp.toPx()))
                          drawCircle(color = primary.copy(alpha = 0.25f), radius = size.minDimension * 0.36f, style = Stroke(width = 1.5.dp.toPx()))

                          // مؤشر السهم الذهبي والكعبة عند طرفه
                          rotate(degrees = rot) {
                              val tipY = 30.dp.toPx()
                              drawLine(color = primary, start = center, end = Offset(center.x, tipY), strokeWidth = 6.dp.toPx())

                              // رسم الكعبة المشرفة عند طرف السهم
                              val kSize = 26.dp.toPx()
                              val kLeft = center.x - kSize / 2f
                              val kTop = tipY - kSize / 2f
                              drawRect(color = Color(0xFF111111), topLeft = Offset(kLeft, kTop), size = Size(kSize, kSize))
                              drawRect(color = Color(0xFFFFD700), topLeft = Offset(kLeft, kTop), size = Size(kSize, kSize), style = Stroke(width = 2.dp.toPx()))
                              drawLine(
                                  color = Color(0xFFFFD700),
                                  start = Offset(kLeft, kTop + kSize * 0.28f),
                                  end = Offset(kLeft + kSize, kTop + kSize * 0.28f),
                                  strokeWidth = 3.dp.toPx()
                              )
                          }

                          // رسم كعبة مركزية أنيقة في منتصف البوصلة بدلاً من النقطة البيضاء
                          val centerKSize = 24.dp.toPx()
                          val cLeft = center.x - centerKSize / 2f
                          val cTop = center.y - centerKSize / 2f
                          drawRect(color = Color(0xFF111111), topLeft = Offset(cLeft, cTop), size = Size(centerKSize, centerKSize))
                          drawRect(color = Color(0xFFFFD700), topLeft = Offset(cLeft, cTop), size = Size(centerKSize, centerKSize), style = Stroke(width = 2.dp.toPx()))
                          drawLine(
                              color = Color(0xFFFFD700),
                              start = Offset(cLeft, cTop + centerKSize * 0.3f),
                              end = Offset(cLeft + centerKSize, cTop + centerKSize * 0.3f),
                              strokeWidth = 2.5.dp.toPx()
                          )
                      }
                  }
                  Spacer(Modifier.height(14.dp))
                  Text("وجّه الهاتف حتى تشير الكعبة الذهبية للأعلى", fontSize = 13.sp, color = Color.LightGray)
              }
          }

