                  IslamicArticle("غزوة بدر الكبرى", "2 هـ", "انتصر المسلمون رغم قلة عددهم.")
              )
              val SARAYA_LIST = listOf(
                  IslamicArticle("سرية حمزة بن عبد المطلب", "1 هـ", "أول سرية في الإسلام.")
              )
              val QURAN_STORIES = listOf(
                  IslamicArticle("أصحاب الكهف", "سورة الكهف", "فتية آمنوا بربهم فنجاهم الله.")
              )
              val QURAN_RULES = listOf(
