                      .setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "alhana-update.apk")
                  dm.enqueue(req)
                  Toast.makeText(context, "بدأ تنزيل التحديث في شريط الإشعارات ✓", Toast.LENGTH_LONG).show()
              } catch (_: Exception) {
                  context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(apkUrl)))
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  AdhanScheduler.scheduleAllPrayers(this)
                  setContent {
                      val prefs = remember { getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
                      var theme by remember { mutableIntStateOf(prefs.getInt("theme", 0)) }
                      var scale by remember { mutableFloatStateOf(prefs.getFloat("scale", 1.0f)) }

                      val cs = darkColorScheme(primary = Color(0xFFE5A93B), background = Color(0xFF06281E), surface = Color(0xFF0B3B2D), onPrimary = Color(0xFF052219), onBackground = Color.White, onSurface = Color.White)

                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme(colorScheme = cs) {
                              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                                  MainApp(theme = theme, onTheme = { theme = it; prefs.edit().putInt("theme", it).apply() }, scale = scale, onScale = { scale = it; prefs.edit().putFloat("scale", it).apply() })
                              }
                          }
                      }
                  }
              }

              // زر الصوت يخفض الصوت، وزر الباور يلغي صوت الأذان
              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Int {
                  when (keyCode) {
                      KeyEvent.KEYCODE_VOLUME_UP, KeyEvent.KEYCODE_VOLUME_DOWN -> {
                          val am = getSystemService(Context.AUDIO_SERVICE) as android.media.AudioManager
                          am.adjustStreamVolume(android.media.AudioManager.STREAM_ALARM, android.media.AudioManager.ADJUST_LOWER, 0)
                          am.adjustStreamVolume(android.media.AudioManager.STREAM_MUSIC, android.media.AudioManager.ADJUST_LOWER, 0)
                          Toast.makeText(this, "تم تخفيض الصوت ✓", Toast.LENGTH_SHORT).show()
                          return true
                      }
                      KeyEvent.KEYCODE_POWER -> {
                          stopService(Intent(this, AdhanService::class.java).apply { action = "STOP_ADHAN" })
                          Toast.makeText(this, "تم إيقاف الأذان والتنبيهات ✓", Toast.LENGTH_SHORT).show()
                          return true
                      }
                  }
                  return super.onKeyDown(keyCode, event)
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun MainApp(theme: Int, onTheme: (Int) -> Unit, scale: Float, onScale: (Float) -> Unit) {
              val context = LocalContext.current
              var tab by remember { mutableIntStateOf(0) }
              var prayers by remember { mutableStateOf(emptyList<PrayerItem>()) }
              var nextP by remember { mutableStateOf<PrayerItem?>(null) }
              var countdown by remember { mutableStateOf("00:00:00") }
              var locStatus by remember { mutableStateOf(PrayerCalculator.getSavedCityName(context)) }

              var updateDialogMessage by remember { mutableStateOf<String?>(null) }
              var isLatestVersionState by remember { mutableStateOf(false) }

              val currentPlayingTitle by MediaPlaybackState.currentTitle
              val isPlayingAudio by MediaPlaybackState.isPlaying

              fun refresh() {
                  val (lat, lng) = PrayerCalculator.getSavedLocation(context)
                  prayers = PrayerCalculator.getTodayPrayers(context, lat, lng)
                  nextP = PrayerCalculator.getNextPrayer(context, lat, lng)
                  locStatus = PrayerCalculator.getSavedCityName(context)
              }

              LaunchedEffect(Unit) { refresh() }

              LaunchedEffect(nextP) {
                  while (true) {
                      nextP?.let {
                          val diff = it.timeInMillis - System.currentTimeMillis()
                          if (diff <= 0) refresh()
                          else countdown = String.format(Locale.US, "%02d:%02d:%02d", diff / 3600000, (diff / 60000) % 60, (diff / 1000) % 60)
                      }
                      delay(1000)
                  }
              }

              if (updateDialogMessage != null) {
                  AlertDialog(
                      onDismissRequest = { updateDialogMessage = null },
                      title = { Text(if (isLatestVersionState) "أنت على أحدث إصدار!" else "تحديث جديد متاح!", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold) },
                      text = { Text(updateDialogMessage ?: "") },
                      confirmButton = {
                          if (!isLatestVersionState) {
                              UniformButton("تحديث الآن") { updateDialogMessage = null; triggerDirectDownloadUpdate(context) }
                          } else {
                              UniformButton("حسناً") { updateDialogMessage = null }
                          }
                      },
                      containerColor = MaterialTheme.colorScheme.surface,
                      titleContentColor = Color.White,
                      textContentColor = Color.White
                  )
              }

              val navItems = listOf(
                  Triple(0, "الصلاة", Icons.Default.Mosque),
                  Triple(1, "القرآن", Icons.Default.MenuBook),
                  Triple(2, "الأذكار", Icons.Default.Favorite),
                  Triple(3, "المزيد", Icons.Default.Apps)
              )

              Scaffold(
                  containerColor = Color.Transparent,
                  topBar = {
                      Row(
                          modifier = Modifier.fillMaxWidth().background(MaterialTheme.colorScheme.surface).padding(14.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text("هَنَا القُرآن (v$CURRENT_APP_VERSION)", fontSize = 17.sp, fontWeight = FontWeight.Bold, color = Color.White)
                          IconButton(onClick = {
                              CoroutineScope(Dispatchers.IO).launch {
                                  try {
                                      val conn = (URL("https://github.com/Alifathy2/HANA-Quran-Prayer/releases/latest/download/version.json").openConnection() as HttpURLConnection)
                                      val json = conn.inputStream.bufferedReader().readText()
                                      val remoteCode = JSONObject(json).optInt("versionCode", CURRENT_VERSION_CODE)
                                      withContext(Dispatchers.Main) {
                                          if (remoteCode <= CURRENT_VERSION_CODE) {
                                              isLatestVersionState = true
                                              updateDialogMessage = "التطبيق على أحدث نسخة بالفعل (v$CURRENT_APP_VERSION)."
                                          } else {
                                              isLatestVersionState = false
                                              updateDialogMessage = "يتوفر إصدار جديد."
                                          }
                                      }
                                  } catch (_: Exception) {
                                      withContext(Dispatchers.Main) {
                                          isLatestVersionState = true
                                          updateDialogMessage = "أنت تستخدم أحدث نسخة حالياً (v$CURRENT_APP_VERSION)."
                                      }
                                  }
                              }
                          }) { Icon(Icons.Default.SystemUpdate, null, tint = MaterialTheme.colorScheme.primary) }
                      }
                  },
                  bottomBar = {
                      Column {
                          if (currentPlayingTitle != null) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().background(Color(0xFF041B14)).padding(12.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(currentPlayingTitle ?: "", color = MaterialTheme.colorScheme.primary, fontSize = 14.sp, maxLines = 1, modifier = Modifier.weight(1f))
                                  UniformButton(if (isPlayingAudio) "إيقاف" else "استئناف") { toggleMediaService(context) }
                              }
                          }
                          NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {
                              navItems.forEach { (idx, title, icon) ->
                                  NavigationBarItem(
                                      selected = tab == idx,
                                      onClick = { tab = idx },
                                      icon = { Icon(icon, title, tint = if (tab == idx) MaterialTheme.colorScheme.primary else Color.LightGray) },
                                      label = { Text(title, color = if (tab == idx) MaterialTheme.colorScheme.primary else Color.LightGray) }
                                  )
                              }
                          }
                      }
                  }
              } { pad ->
                  Box(modifier = Modifier.fillMaxSize().padding(pad).padding(12.dp)) {
                      when (tab) {
                          0 -> PrayerDashboard(prayers, nextP, countdown, locStatus)
                          1 -> QuranScreen(scale)
                          2 -> AzkarOnlyScreen(scale)
                          3 -> MoreSectionScreen(theme, onTheme, scale, onScale) { refresh() }
                      }
                  }
              }
          }

          @Composable
