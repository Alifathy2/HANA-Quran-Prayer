          // 2. قسم القرآن الكريم (مع حرف i لأسباب النزول + التحميل الكامل بدون إنترنت + تحميل صوت القراء)
          @Composable
          fun QuranScreen(scale: Float) {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("hona_prefs", Context.MODE_PRIVATE) }
              val scope = rememberCoroutineScope()

              var surahs by remember { mutableStateOf(emptyList<SurahInfo>()) }
              var query by remember { mutableStateOf("") }
              var selSurah by remember { mutableStateOf<SurahInfo?>(null) }
              var infoDialogSurah by remember { mutableStateOf<SurahInfo?>(null) }
              var ayahs by remember { mutableStateOf(emptyList<AyahWithTafsir>()) }
              var loading by remember { mutableStateOf(true) }
              var tafsir by remember { mutableStateOf(true) }
              var bookmark by remember { mutableIntStateOf(prefs.getInt("bookmark", 1)) }
              var selectedReciterIndex by remember { mutableIntStateOf(prefs.getInt("reciter_idx", 0)) }

              var offlineDownloadProgress by remember { mutableIntStateOf(-1) }
              var audioDownloadStatus by remember { mutableStateOf<String?>(null) }

              val currentUrl by MediaPlaybackState.currentUrl
              val isPlaying by MediaPlaybackState.isPlaying

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      try {
                          val cache = File(context.filesDir, "surahs.json")
                          val json = if (cache.exists()) cache.readText() else URL("https://api.alquran.cloud/v1/surah").readText().also { cache.writeText(it) }
                          val data = JSONObject(json).getJSONArray("data")
                          val list = mutableListOf<SurahInfo>()
                          for (i in 0 until data.length()) {
                              val it = data.getJSONObject(i)
                              list.add(SurahInfo(it.getInt("number"), it.getString("name"), it.getInt("numberOfAyahs")))
                          }
                          surahs = list
                      } catch (_: Exception) {} finally { loading = false }
                  }
              }

              // نافذة معلومات السورة وأسباب النزول عند الضغط على (i)
              if (infoDialogSurah != null) {
                  val s = infoDialogSurah!!
                  val meta = IslamicRepository.getSurahDetails(s.number, s.name, s.ayahsCount)
                  AlertDialog(
                      onDismissRequest = { infoDialogSurah = null },
                      title = {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("معلومات ${s.name}", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                              IconButton(onClick = { infoDialogSurah = null }) { Icon(Icons.Default.Close, null, tint = Color.White) }
                          }
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("• التصنيف وعدد الآيات: ${meta.revelationTypeAr}", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                              Text("• سبب النزول وتاريخها:\n${meta.reasonOfRevelation}", fontSize = 14.sp, lineHeight = 22.sp)
                              Text("• فضل السورة ومحورها:\n${meta.virtuesAndTheme}", fontSize = 14.sp, lineHeight = 22.sp)
                          }
                      },
                      confirmButton = {
                          UniformButton("حسناً") { infoDialogSurah = null }
                      },
                      containerColor = MaterialTheme.colorScheme.surface,
                      titleContentColor = Color.White,
                      textContentColor = Color.White
                  )
              }

              fun openSurah(s: SurahInfo) {
                  selSurah = s; loading = true
                  prefs.edit().putInt("bookmark", s.number).apply()
                  bookmark = s.number
                  scope.launch(Dispatchers.IO) {
                      try {
                          val cache = File(context.filesDir, "surah_${s.number}.json")
                          val res = if (cache.exists()) cache.readText() else URL("https://api.alquran.cloud/v1/surah/${s.number}/editions/quran-uthmani,ar.muyassar").readText().also { cache.writeText(it) }
                          val ed = JSONObject(res).getJSONArray("data")
                          val qa = ed.getJSONObject(0).getJSONArray("ayahs")
                          val ta = ed.getJSONObject(1).getJSONArray("ayahs")
                          val list = mutableListOf<AyahWithTafsir>()
                          for (i in 0 until qa.length()) list.add(AyahWithTafsir(qa.getJSONObject(i).getInt("numberInSurah"), qa.getJSONObject(i).getString("text"), ta.getJSONObject(i).getString("text")))
                          ayahs = list
                      } catch (_: Exception) {} finally { loading = false }
                  }
              }

              if (selSurah == null) {
                  Column(modifier = Modifier.fillMaxSize()) {
                      OutlinedTextField(
                          value = query,
                          onValueChange = { query = it },
                          placeholder = { Text("ابحث عن اسم السورة...") },
                          leadingIcon = { Icon(Icons.Default.Search, null, tint = MaterialTheme.colorScheme.primary) },
                          modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp),
                          singleLine = true
                      )

                      // أزرار استكمال القراءة وتحميل المصحف كاملاً بدون إنترنت
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp)) {
                          surahs.firstOrNull { it.number == bookmark }?.let { bm ->
                              UniformButton("علامة القراءة: ${bm.name}", Modifier.weight(1f)) { openSurah(bm) }
                          }
                          UniformButton(
                              text = if (offlineDownloadProgress in 1..114) "جاري التحميل ($offlineDownloadProgress/114)" else "تحميل المصحف أوفلاين",
                              modifier = Modifier.weight(1f)
                          ) {
                              if (offlineDownloadProgress in 1..114) return@UniformButton
                              offlineDownloadProgress = 1
                              scope.launch(Dispatchers.IO) {
                                  for (num in 1..114) {
                                      offlineDownloadProgress = num
                                      val f = File(context.filesDir, "surah_$num.json")
                                      if (!f.exists() || f.length() < 100) {
                                          try {
                                              val txt = URL("https://api.alquran.cloud/v1/surah/$num/editions/quran-uthmani,ar.muyassar").readText()
                                              f.writeText(txt)
                                          } catch (_: Exception) {}
                                      }
                                  }
                                  withContext(Dispatchers.Main) {
                                      offlineDownloadProgress = -1
                                      Toast.makeText(context, "تم حفظ القرآن الكريم والتفسير كاملاً للعمل بدون إنترنت ✓", Toast.LENGTH_LONG).show()
                                  }
                              }
                          }
                      }

                      if (loading) Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator(color = MaterialTheme.colorScheme.primary) }
                      else LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          items(surahs.filter { it.name.contains(query) || it.number.toString() == query }) { s ->
                              val isOfflineSaved = File(context.filesDir, "surah_${s.number}.json").exists()
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .border(0.8.dp, MaterialTheme.colorScheme.primary.copy(alpha = 0.3f), RoundedCornerShape(14.dp))
                                      .clickable { openSurah(s) },
                                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.92f)),
                                  shape = RoundedCornerShape(14.dp)
                              ) {
                                  Row(modifier = Modifier.padding(horizontal = 14.dp, vertical = 12.dp).fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Text("${s.number}. ${s.name}", fontSize = 17.sp, fontWeight = FontWeight.Bold)
                                          if (isOfflineSaved) {
                                              Spacer(Modifier.width(6.dp))
                                              Icon(Icons.Default.OfflinePin, contentDescription = "محفوظة", tint = Color(0xFF4CAF50), modifier = Modifier.size(16.dp))
                                          }
                                      }
                                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                          Text("${s.ayahsCount} آية", color = MaterialTheme.colorScheme.primary, fontSize = 13.sp)
                                          IconButton(
                                              onClick = { infoDialogSurah = s },
                                              modifier = Modifier.size(34.dp).background(MaterialTheme.colorScheme.primary.copy(alpha = 0.18f), CircleShape)
                                          ) {
                                              Icon(Icons.Default.Info, contentDescription = "معلومات السورة", tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(20.dp))
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              } else {
                  val currentReciter = RECITERS.getOrElse(selectedReciterIndex) { RECITERS.first() }
                  val num = String.format(Locale.US, "%03d", selSurah!!.number)
                  val remoteUrl = "${currentReciter.serverUrl}/$num.mp3"
                  val localAudioFile = File(context.filesDir, "audio_${selectedReciterIndex}_$num.mp3")
                  val effectiveAudioSource = if (localAudioFile.exists() && localAudioFile.length() > 15000) localAudioFile.absolutePath else remoteUrl
                  val isThisSurahPlaying = (currentUrl == remoteUrl || currentUrl == localAudioFile.absolutePath) && isPlaying

                  Column(modifier = Modifier.fillMaxSize()) {
                      Row(modifier = Modifier.fillMaxWidth().padding(bottom = 6.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          UniformButton("الفهرس") { selSurah = null }
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text(selSurah!!.name, fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              IconButton(onClick = { infoDialogSurah = selSurah }) {
                                  Icon(Icons.Default.Info, contentDescription = "سبب النزول", tint = MaterialTheme.colorScheme.primary)
                              }
                          }
                          UniformButton(if (tafsir) "إخفاء التفسير" else "التفسير") { tafsir = !tafsir }
                      }

                      // شريط اختيار القارئ + تشغيل التلاوة بالخلفية + تحميل السورة صوتياً بدون إنترنت
                      ScrollableTabRow(
                          selectedTabIndex = selectedReciterIndex,
                          containerColor = MaterialTheme.colorScheme.surface,
                          contentColor = MaterialTheme.colorScheme.primary,
                          edgePadding = 4.dp,
                          modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp)
                      ) {
                          RECITERS.forEachIndexed { idx, rec ->
                              Tab(
                                  selected = selectedReciterIndex == idx,
                                  onClick = {
                                      selectedReciterIndex = idx
                                      prefs.edit().putInt("reciter_idx", idx).apply()
                                  },
                                  text = { Text(rec.name, fontSize = 12.sp, maxLines = 1, softWrap = false) }
                              )
                          }
                      }

                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp)) {
                          UniformButton(if (isThisSurahPlaying) "إيقاف مؤقت" else "تشغيل التلاوة بالخلفية", Modifier.weight(1f)) {
                              if (currentUrl == effectiveAudioSource) {
                                  toggleMediaService(context)
                              } else {
                                  startMediaService(
                                      context = context,
                                      url = effectiveAudioSource,
                                      title = "تلاوة ${selSurah!!.name}",
                                      subtitle = currentReciter.name
                                  )
                              }
                          }
                          UniformButton(
                              text = if (localAudioFile.exists() && localAudioFile.length() > 15000) "محفوظة صوتياً ✓" else (audioDownloadStatus ?: "تحميل الصوت أوفلاين"),
                              modifier = Modifier.weight(1f)
                          ) {
                              if (localAudioFile.exists() && localAudioFile.length() > 15000) {
                                  Toast.makeText(context, "تلاوة السورة محفوظة بالفعل وتعمل بدون إنترنت", Toast.LENGTH_SHORT).show()
                                  return@UniformButton
                              }
                              audioDownloadStatus = "جاري التحميل..."
                              scope.launch(Dispatchers.IO) {
                                  try {
                                      URL(remoteUrl).openStream().use { i -> localAudioFile.outputStream().use { o -> i.copyTo(o) } }
                                      withContext(Dispatchers.Main) {
                                          audioDownloadStatus = null
                                          Toast.makeText(context, "تم حفظ تلاوة ${selSurah!!.name} للعمل بدون إنترنت ✓", Toast.LENGTH_LONG).show()
                                      }
                                  } catch (_: Exception) {
                                      withContext(Dispatchers.Main) {
                                          audioDownloadStatus = null
                                          Toast.makeText(context, "تعذر التحميل، تأكد من الاتصال بالإنترنت", Toast.LENGTH_SHORT).show()
                                      }
                                  }
                              }
                          }
                      }

                      if (loading) Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator(color = MaterialTheme.colorScheme.primary) }
                      else LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          items(ayahs) { a ->
                              Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.92f)), shape = RoundedCornerShape(14.dp)) {
                                  Column(modifier = Modifier.padding(16.dp).fillMaxWidth()) {
                                      Text("${a.text} ﴿${a.numberInSurah}﴾", fontSize = (22 * scale).sp, lineHeight = (38 * scale).sp, textAlign = TextAlign.Right, modifier = Modifier.fillMaxWidth())
                                      if (tafsir) {
                                          HorizontalDivider(modifier = Modifier.padding(vertical = 8.dp), color = Color.Gray.copy(alpha = 0.3f))
                                          Text("التفسير الميسر: ${a.tafsir}", fontSize = (15 * scale).sp, lineHeight = (25 * scale).sp, color = Color(0xFFE0E0E0), textAlign = TextAlign.Right, modifier = Modifier.fillMaxWidth())
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // 3. قسم الأذكار المستقل
