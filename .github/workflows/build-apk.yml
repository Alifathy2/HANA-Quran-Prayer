              // قصص الأنبياء كاملة من أول سيدنا آدم إلى خاتم الأنبياء محمد ﷺ
              val PROPHETS_STORIES = listOf(
                  IslamicArticle("1. سيدنا آدم عليه السلام (أبو البشر)", "بداية الخلق والاستخلاف في الأرض", "خلق الله آدم بيده من طين الأرض ونفخ فيه من روحه، وأسجد له الملائكة تكريماً إلا إبليس أبى واستكبر. أسكن الله آدم وزوجه حواء الجنة، فلما وسوس لهما الشيطان فأكلا من الشجرة تابا إلى الله وأنابا: (رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ)، فتاب الله عليهما وأهبطهما إلى الأرض لعمارتها بالتوحيد."),
                  IslamicArticle("2. سيدنا إدريس عليه السلام", "أول من خط بالقلم ورفع مكاناً علياً", "هو أول نبي بُعث بعد آدم وشيث عليهما السلام، كان كثير العبادة والتسبيح، وأول من خط بالقلم وخاط الثياب، ورفعه الله مكاناً علياً في السماء الرابعة كما رآه النبي ﷺ في رحلة الإسراء والمعراج."),
                  IslamicArticle("3. سيدنا نوح عليه السلام (شيخ المرسلين)", "950 عاماً من الدعوة والسفينة", "دعا قومه إلى توحيد الله ألف سنة إلا خمسين عاماً ليلاً ونهاراً سراً وجهاراً، فلم يؤمن معه إلا قليل. فأوحى الله إليه أن يصنع الفلك بأعيننا ووحينا، فلما جاء أمر الله وفار التنور حمل فيها من كل زوجين اثنين وأهله والمؤمنين، وأغرق الله الكافرين بالطوفان العظيم."),
                  IslamicArticle("4. سيدنا هود عليه السلام", "نبي الله إلى قوم عاد", "أرسله الله إلى قوم عاد في الأحقاف الذين أعطاهم الله بسطة في الجسم وقوة في البنيان فاغترّوا وقالوا (من أشد منا قوة)، فدعاهم هود لعبادة الله وحده فكذبوه، فأرسل الله عليهم ريحاً صرصراً عاتية سبع ليال وثمانية أيام حسوماً ونجى هوداً والذين آمنوا معه."),
                  IslamicArticle("5. سيدنا صالح عليه السلام", "ناقة الله ومعجزة قوم ثمود", "أرسله الله إلى ثمود الذين ينحتون من الجبال بيوتاً، وطلبوا منه آية فأخرج الله لهم من صخرة صماء ناقة عظيمة لها شرب يوم ولهم شرب يوم معلوم، فعقروها وتكبروا، فأخذتهم الصيحة والرجفة فأصبحوا في دارهم جاثمين ونجى الله صالحاً والمؤمنين."),
                  IslamicArticle("6. سيدنا إبراهيم خليل الرحمن عليه السلام", "أبو الأنبياء وباني الكعبة المشرفة", "حطّم الأصنام بيده ليوقظ عقول قومه، فلما ألقوه في النار العظيمة قال: (حسبي الله ونعم الوكيل)، فجعلها الله برداً وسلاماً عليه. ثم ابتلاه الله بذبح ابنه إسماعيل فاستسلما لأمر الله وفداه الله بذبح عظيم، ورفعا معاً قواعد الكعبة المشرفة لتكون قبلة للمسلمين."),
                  IslamicArticle("7. سيدنا لوط عليه السلام", "الدعوة إلى العفة والطهارة", "آمن مع إبراهيم وهاجر معه، ثم أرسله الله إلى أهل سدوم الذين ابتدعوا فاحشة لم يسبقهم بها أحد من العالمين، فنصحهم لوط وحذرهم فكذبوه، فأمر الله لوطاً أن يسري بأهله ليلاً وجعل عالي قريتهم سافلها وأمطر عليها حجارة من سجيل."),
                  IslamicArticle("8. سيدنا إسماعيل وإسحاق ويعقوب عليهم السلام", "الذرية المباركة من بيت النبوة", "إسماعيل هو الذبيح الصابر ورسول الله إلى قبيلة جرهم والعماليق، ومن نسله جاء سيدنا محمد ﷺ. وإسحاق هو بشارة الملائكة لإبراهيم وسارة، ومن نسله جاء ابنه يعقوب (إسرائيل) الذي ضرب أروع الأمثلة في الصبر الجميل وحسن الظن بالله."),
                  IslamicArticle("9. سيدنا يوسف الصديق عليه السلام", "من الجب والسجن إلى عزيز مصر", "ابتُلي بالحسد من إخوته فألقوه في البئر صغيراً، ثم بيع في مصر وابتُلي بالسجن ظلماً، فصبر واتقى الله فمكّن الله له وجعله على خزائن مصر، وجمع شمله بأبيه يعقوب وإخوته وعفا عنهم قائلاً: (لا تثريب عليكم اليوم يغفر الله لكم)."),
                  IslamicArticle("10. سيدنا أيوب عليه السلام", "نموذج الصبر على البلاء والشفاء", "آتاه الله المال والولد والصحة ثم ابتلاه في ماله وولده وجسده سنوات طويلة فما زاد إلا حمداً وشكراً، ثم نادى ربه: (أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ)، فأمره الله أن يضرب برجله الأرض فنبع ماء بارد اغتسل وشرب منه فعاد شاباً صحيحاً وردّ الله له أهله ومثلهم معهم."),
                  IslamicArticle("11. سيدنا شعيب عليه السلام (خطيب الأنبياء)", "نبي أهل مدين والعدل في الميزان", "أرسله الله إلى أهل مدين الذين كانوا يبخسون الناس أشياءهم ويطففون المكيال والميزان، فدعاهم إلى التوحيد والعدل في المعاملات فاستكبروا، فأخذتهم الرجفة وعذاب يوم الظلة ونجى الله شعيباً والمؤمنين."),
                  IslamicArticle("12. سيدنا موسى وهارون عليهما السلام", "كليم الله ونجاة بني إسرائيل من فرعون", "أرسله الله مع أخيه هارون إلى فرعون الطاغية بالآيات التسع، فلما خرج موسى بقومه وحاصرهم البحر قال بيقين: (كَلَّا إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ)، فضرب بعصاه البحر فانفلق اثني عشر طريقاً يابساً ونجا المؤمنون وأغرق الله فرعون وجنوده."),
                  IslamicArticle("13. سيدنا داود وسليمان عليهما السلام", "الملك والنبوة وتسخير الكون", "آتى الله داود الزبور وألان له الحديد وكانت الجبال والطير تسبح معه. وورثه ابنه سليمان في النبوة والملك، وسخّر الله له الريح والجن وعلم منطق الطير والنمل، وحكم بالعدل والرحمة."),
                  IslamicArticle("14. سيدنا يونس عليه السلام (ذو النون)", "التسبيح في ظلمات البحر وبطن الحوت", "حين التقمه الحوت في ظلمات البحر والليل، نادى ربه بالتسبيح والاعتراف: (لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ)، فاستجاب الله له ونجاه من الغم وأنبت عليه شجرة من يقطين وأرسله إلى مائة ألف أو يزيدون فآمنوا جميعاً."),
                  IslamicArticle("15. سيدنا زكريا ويحيى عليهما السلام", "استجابة الدعاء عند الكبر", "دعا زكريا ربه دعاءً خفياً أن يرزقه ولداً صالحاً يرث النبوة، فبشرته الملائكة بيحيى سيداً وحصوراً ونبياً من الصالحين، آتاه الله الحكم صبياً وكان تقياً باراً بوالديه."),
                  IslamicArticle("16. سيدنا عيسى ابن مريم عليه السلام", "كلمة الله وروحه والمبشر بأحمد ﷺ", "خلقه الله بكلمة (كن) من أم صديقة طاهرة دون أب ليكون آية للعالمين، وتكلم في المهد صبياً، وأيده الله بإحياء الموتى وإبراء الأكمه والأبرص بإذن الله، وبشّر برسول يأتي من بعده اسمه أحمد، ورفعه الله إليه حياً."),
                  IslamicArticle("17. خاتم الأنبياء والمرسلين سيدنا محمد ﷺ", "رحمة الله للعالمين وسيد ولد آدم", "وُلد بمكة عام الفيل يتيماً، وعُرف بالصادق الأمين، ونزل عليه الوحي في غار حراء وعمره أربعون عاماً، فبلّغ الرسالة وأدى الأمانة وجاهد في الله حق جهاده حتى أتم الله به الدين وأخرج الناس من الظلمات إلى النور، صلوات ربي وسلامه عليه وعلى آله وصحبه أجمعين.")
              )

              // قسم غزوات النبي ﷺ الكبرى
              val GHAZWAT_LIST = listOf(
                  IslamicArticle("1. غزوة بدر الكبرى (17 رمضان 2 هـ)", "يوم الفرقان وأول نصر عظيم", "خرج النبي ﷺ في 313 من الصحابة رضي الله عنهم، فالتقوا بجيش قريش البالغ نحو 1000 مقاتل. تضرع النبي ﷺ لربه فأمده الله بألف من الملائكة مردفين، وانتصر المسلمون نصراً مؤزراً أعز الله به الإسلام وأذل الشرك."),
                  IslamicArticle("2. غزوة أُحد (شوال 3 هـ)", "درس الطاعة والثبات عند الابتلاء", "خرج المشركون بقيادة أبي سفيان في 3000 مقاتل للثأر ليوم بدر. كان النصر في البداية للمسلمين حتى نزل الرماة من الجبل ظناً أن المعركة انتهت، فالتف خالد بن الوليد من خلف الجبل واستُشهد سبعون من الصحابة على رأسهم حمزة بن عبد المطلب رضي الله عنه."),
                  IslamicArticle("3. غزوة الخندق / الأحزاب (شوال 5 هـ)", "حفر الخندق وهزيمة الأحزاب بالريح", "تحزّبت قريش وغطفان واليهود في 10 آلاف مقاتل لاستئصال المدينة، فأشار سلمان الفارسي بحفر الخندق شمال المدينة، وصبر المسلمون على الجوع والبرد شهراً كاملاً حتى أرسل الله على الأحزاب ريحاً وجنوداً لم يروها فردّهم خائبين."),
                  IslamicArticle("4. غزوة بني المصطلق / المريسيع (شعبان 5 هـ)", "إبطال كيد المنافقين", "خرج النبي ﷺ لمواجهة بني المصطلق الذين تجمعوا لغزو المدينة، فانتصر المسلمون عليهم، وتزوج النبي ﷺ جويرية بنت الحارث فأعتق الصحابة مائة أهل بيت من بني المصطلق إكراماً لأصهار رسول الله ﷺ."),
                  IslamicArticle("5. صلح الحديبية وبيعة الرضوان (ذو القعدة 6 هـ)", "الفتح المبين وبداية انتشار الإسلام", "خرج النبي ﷺ مع 1400 صحابي لأداء العمرة فمنعتهم قريش، فتم عقد صلح الحديبية لمدة عشر سنوات، وسماه الله (فتحاً مبيناً) لأنه أتاح للمسلمين دعوة القبائل والملوك للإسلام فدخل الناس في دين الله أفواجاً."),
                  IslamicArticle("6. غزوة خيبر (محرم 7 هـ)", "فتح حصون خيبر على يد علي بن أبي طالب", "توجه النبي ﷺ إلى حصون خيبر التي كانت وكراً للتآمر ضد المسلمين، وقال: «لأعطين الراية غداً رجلاً يحب الله ورسوله ويحبه الله ورسوله»، فأعطاها لعلي بن أبي طالب رضي الله عنه ففتح الله على يديه الحصون حصناً تلو الآخر."),
                  IslamicArticle("7. غزوة فتح مكة (20 رمضان 8 هـ)", "يوم العفو العام وتحطيم الأصنام", "بعد أن نقضت قريش صلح الحديبية، سار النبي ﷺ في 10 آلاف مقاتل فدخل مكة خاضعاً لله دون قتال يذكر، وحطم 360 صنماً حول الكعبة وهو يتلو: (جَاءَ الْحَقُّ وَزَهَقَ الْبَاطِلُ)، وعفا عن أهل مكة قائلاً: «اذهبوا فأنتم الطلقاء»."),
                  IslamicArticle("8. غزوة حُنين (شوال 8 هـ)", "النصر بعد الثبات مع النبي ﷺ", "اجتمعت قبيلتا هوازن وثقيف في 20 ألف مقاتل، فأُعجب بعض المسلمين بكثرتهم (12 ألفاً) وقالوا لن نُغلب اليوم من قلة، ففاجأهم العدو بالكمين في الوادي، فثبت النبي ﷺ ونادى في الصحابة فعادوا وانتصروا نصراً ساحقاً."),
                  IslamicArticle("9. غزوة تبوك / العسرة (رجب 9 هـ)", "آخر غزوات النبي ﷺ وتأمين حدود الشام", "خرج النبي ﷺ في 30 ألف مقاتل في حر شديد ومسافة بعيدة لمواجهة الروم في شمال الجزيرة العربية، فتفرقت جيوش الروم ولم يجرؤوا على المواجهة، وعاد المسلمون وقد دانت الجزيرة العربية كلها للإسلام.")
              )

              // قسم سرايا النبي ﷺ وبعوثه
              val SARAYA_LIST = listOf(
                  IslamicArticle("1. سرية سيف البحر (رمضان 1 هـ)", "أول راية عقدها النبي ﷺ في الإسلام", "بقيادة حمزة بن عبد المطلب رضي الله عنه في ثلاثين راكباً من المهاجرين لاعتراض عير قريش بقيادة أبي جهل، وحجز مجدي بن عمرو الجهني بين الفريقين فلم يقع قتال."),
